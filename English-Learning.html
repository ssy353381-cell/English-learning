<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<title>English Quest — 多益滿分之路</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>
/* ===== css/base.css ===== */
/* ==========================================================================
   base.css — 設計變數、reset、主題、排版基礎
   ========================================================================== */

:root {
  /* 主色（活潑、鼓勵向） */
  --green:        #58cc02;
  --green-dark:   #46a302;
  --green-soft:   #d7ffb8;
  --blue:         #1cb0f6;
  --blue-dark:    #1899d6;
  --blue-soft:    #ddf4ff;
  --purple:       #ce82ff;
  --purple-dark:  #a568cc;
  --gold:         #ffc800;
  --gold-dark:    #e6a400;
  --red:          #ff4b4b;
  --red-dark:     #ea2b2b;
  --red-soft:     #ffdfe0;
  --orange:       #ff9600;

  /* 中性色 */
  --bg:           #ffffff;
  --bg-alt:       #f7f7f7;
  --surface:      #ffffff;
  --border:       #e5e5e5;
  --border-strong:#d0d0d0;
  --text:         #3c3c3c;
  --text-soft:    #777777;
  --text-faint:   #afafaf;

  /* 尺寸 */
  --topbar-h:     56px;
  --nav-h:        62px;
  --radius:       16px;
  --radius-sm:    10px;
  --radius-lg:    24px;
  --maxw:         720px;

  /* 立體按鈕的下緣厚度 */
  --lip:          4px;

  --font: "Nunito", "Segoe UI", "Microsoft JhengHei", "PingFang TC",
          "Noto Sans TC", system-ui, -apple-system, sans-serif;
  --font-en: "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
}

/* 深色主題 */
html[data-theme="dark"] {
  --bg:           #131f24;
  --bg-alt:       #1a2b32;
  --surface:      #1f2f36;
  --border:       #37464f;
  --border-strong:#4a5c66;
  --text:         #f1f7fb;
  --text-soft:    #a3b5bf;
  --text-faint:   #6b7f8a;
  --green-soft:   #24401a;
  --blue-soft:    #16333f;
  --red-soft:     #3d1f22;
}

/* ---------- reset ---------- */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
  padding-top: var(--topbar-h);
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
}

h1, h2, h3, h4 { margin: 0 0 .5em; line-height: 1.3; font-weight: 800; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p  { margin: 0 0 .8em; }

button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  border: none;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

input, textarea, select {
  font-family: inherit;
  font-size: 16px; /* 避免 iOS 自動放大 */
  color: var(--text);
}

ul, ol { margin: 0 0 .8em; padding-left: 1.4em; }
li { margin-bottom: .3em; }

table { border-collapse: collapse; width: 100%; }

/* 英文內容統一字體，避免中日韓字體把英文變醜 */
.en, .word-main, .sentence-en { font-family: var(--font-en); }

/* ---------- 主容器 ---------- */
.view {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 16px 16px 32px;
  min-height: calc(100vh - var(--topbar-h) - var(--nav-h));
}

/* ---------- 通用工具 ---------- */
.muted     { color: var(--text-soft); }
.faint     { color: var(--text-faint); }
.center    { text-align: center; }
.right     { text-align: right; }
.bold      { font-weight: 800; }
.small     { font-size: .85rem; }
.tiny      { font-size: .75rem; }
.big       { font-size: 1.4rem; }
.huge      { font-size: 2.2rem; font-weight: 800; }
.nowrap    { white-space: nowrap; }
.hidden    { display: none !important; }
.mt0  { margin-top: 0; }
.mt8  { margin-top: 8px; }
.mt16 { margin-top: 16px; }
.mt24 { margin-top: 24px; }
.mt32 { margin-top: 32px; }
.mb0  { margin-bottom: 0; }
.mb8  { margin-bottom: 8px; }
.mb16 { margin-bottom: 16px; }
.mb24 { margin-bottom: 24px; }
.row       { display: flex; align-items: center; gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.wrap      { flex-wrap: wrap; }
.grow      { flex: 1 1 auto; min-width: 0; }
.stack     { display: flex; flex-direction: column; gap: 12px; }
.text-green  { color: var(--green-dark); }
.text-red    { color: var(--red-dark); }
.text-blue   { color: var(--blue-dark); }
.text-gold   { color: var(--gold-dark); }

/* ---------- 動畫 ---------- */
@keyframes pop     { 0%{transform:scale(.85);opacity:0} 60%{transform:scale(1.04)} 100%{transform:scale(1);opacity:1} }
@keyframes slideUp { from{transform:translateY(16px);opacity:0} to{transform:translateY(0);opacity:1} }
@keyframes shake   { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
@keyframes bounce  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes spin    { to { transform: rotate(360deg); } }
@keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:.45} }

.anim-pop   { animation: pop .25s ease-out; }
.anim-slide { animation: slideUp .3s ease-out; }
.anim-shake { animation: shake .4s ease-in-out; }
.anim-bounce{ animation: bounce .6s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
}

/* ---------- 捲軸 ---------- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

::selection { background: var(--green-soft); color: var(--text); }

</style>
<style>
/* ===== css/components.css ===== */
/* ==========================================================================
   components.css — 元件樣式
   ========================================================================== */

/* ============ 頂部狀態列 ============ */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  height: var(--topbar-h);
  background: var(--surface);
  border-bottom: 2px solid var(--border);
}
.topbar-inner {
  max-width: var(--maxw); height: 100%; margin: 0 auto;
  padding: 0 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.brand { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.brand-logo { font-size: 1.35rem; }
.brand-name { font-weight: 800; letter-spacing: -.02em; font-size: 1rem; color: var(--green-dark); }

.stat-chips { display: flex; align-items: center; gap: 4px; }
.chip {
  display: flex; align-items: center; gap: 3px;
  padding: 4px 8px; border-radius: 999px;
  font-weight: 800; font-size: .92rem; color: var(--text);
  transition: background .15s;
}
.chip:hover { background: var(--bg-alt); }
.chip-icon { font-size: 1rem; line-height: 1; }
.chip-streak { color: var(--orange); }
.chip-gem    { color: var(--blue-dark); }
.chip-xp     { color: var(--gold-dark); }

.chip-goal { position: relative; width: 36px; height: 36px; padding: 0; justify-content: center; }
.ring { width: 34px; height: 34px; transform: rotate(-90deg); }
.ring-bg, .ring-fg { fill: none; stroke-width: 4; }
.ring-bg { stroke: var(--border); }
.ring-fg {
  stroke: var(--green); stroke-linecap: round;
  stroke-dasharray: 97.39; stroke-dashoffset: 97.39;
  transition: stroke-dashoffset .5s ease;
}
.ring-label {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: .58rem; font-weight: 800; color: var(--text-soft);
}

/* ============ 底部導覽 ============ */
.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--surface);
  border-top: 2px solid var(--border);
  display: flex;
}
.navbtn {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; color: var(--text-faint); font-size: .68rem; font-weight: 700;
  border-top: 3px solid transparent; margin-top: -2px;
  transition: color .15s;
}
.navicon { font-size: 1.3rem; line-height: 1.15; filter: grayscale(1) opacity(.6); transition: filter .15s; }
.navbtn.active { color: var(--green-dark); border-top-color: var(--green); }
.navbtn.active .navicon { filter: none; }

/* 進行課程時隱藏導覽，避免分心 */
body.in-lesson .bottomnav { display: none; }
body.in-lesson { padding-bottom: 0; }

/* ============ 按鈕 ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 20px; border-radius: var(--radius-sm);
  font-weight: 800; font-size: .95rem; letter-spacing: .01em;
  background: var(--bg-alt); color: var(--text);
  border-bottom: var(--lip) solid var(--border-strong);
  transition: transform .06s, filter .12s;
  user-select: none;
}
.btn:active { transform: translateY(var(--lip)); border-bottom-width: 0; margin-bottom: var(--lip); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--green); color: #fff; border-bottom-color: var(--green-dark); }
.btn-blue    { background: var(--blue);  color: #fff; border-bottom-color: var(--blue-dark); }
.btn-gold    { background: var(--gold);  color: #4a3600; border-bottom-color: var(--gold-dark); }
.btn-danger  { background: var(--red);   color: #fff; border-bottom-color: var(--red-dark); }
.btn-purple  { background: var(--purple);color: #fff; border-bottom-color: var(--purple-dark); }
.btn-ghost   { background: transparent; border: 2px solid var(--border); border-bottom-width: var(--lip); color: var(--text-soft); }
.btn-lg   { padding: 15px 28px; font-size: 1.02rem; width: 100%; }
.btn-sm   { padding: 7px 13px; font-size: .82rem; --lip: 3px; }
.btn-block{ width: 100%; }

/* ============ 卡片 ============ */
.card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}
.card-tight { padding: 12px; }
.card-hl { border-color: var(--green); background: var(--green-soft); }
.card-title { font-weight: 800; font-size: 1rem; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }

/* ============ 進度條 ============ */
.pbar {
  height: 14px; background: var(--border); border-radius: 999px; overflow: hidden;
  flex: 1 1 auto;
}
.pbar-fill {
  height: 100%; background: var(--green); border-radius: 999px;
  width: 0%; transition: width .35s ease;
  background-image: linear-gradient(180deg, rgba(255,255,255,.35) 0 45%, transparent 45%);
}
.pbar-fill.blue { background-color: var(--blue); }
.pbar-fill.gold { background-color: var(--gold); }
.pbar-sm { height: 8px; }

/* ============ 關卡地圖 ============ */
.stage-header {
  border-radius: var(--radius); padding: 14px 16px; margin: 18px 0 10px;
  color: #fff; background: var(--green);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.stage-header.locked { background: var(--border-strong); }
.stage-header h2 { margin: 0; font-size: 1.05rem; }
.stage-header .stage-sub { font-size: .78rem; opacity: .9; font-weight: 700; }

/* overflow-x:clip 讓被推出去的「空白列框」不會撐出橫向捲軸，
   又不像 hidden 會建立捲動容器（節點上方的提示氣泡仍看得到） */
.path {
  position: relative; padding: 10px 0 24px;
  overflow-x: clip; overflow-y: visible;
}
.path-row {
  display: flex; justify-content: center; align-items: center;
  min-height: 92px; position: relative;
}
/* 蜿蜒偏移：用 vw 讓窄螢幕自動縮小，才不會把節點推出畫面外 */
.path-row[data-off="0"]  { transform: translateX(0); }
.path-row[data-off="1"]  { transform: translateX(clamp(0px, 15vw, 64px)); }
.path-row[data-off="2"]  { transform: translateX(clamp(0px, 22vw, 96px)); }
.path-row[data-off="3"]  { transform: translateX(clamp(0px, 15vw, 64px)); }
.path-row[data-off="4"]  { transform: translateX(0); }
.path-row[data-off="5"]  { transform: translateX(clamp(-64px, -15vw, 0px)); }
.path-row[data-off="6"]  { transform: translateX(clamp(-96px, -22vw, 0px)); }
.path-row[data-off="7"]  { transform: translateX(clamp(-64px, -15vw, 0px)); }

.node {
  position: relative; width: 74px; height: 68px;
  border-radius: 50%;
  background: var(--border); color: #fff;
  border-bottom: 7px solid var(--border-strong);
  display: grid; place-items: center;
  font-size: 1.9rem;
  transition: transform .08s;
}
.node:active:not(.locked) { transform: translateY(5px); border-bottom-width: 2px; }
.node.done    { background: var(--green);  border-bottom-color: var(--green-dark); }
.node.current { background: var(--blue);   border-bottom-color: var(--blue-dark); }
.node.boss    { background: var(--purple); border-bottom-color: var(--purple-dark); width: 84px; height: 78px; font-size: 2.2rem; }
.node.boss.done { background: var(--gold); border-bottom-color: var(--gold-dark); }
.node.locked  { filter: grayscale(1); opacity: .55; cursor: not-allowed; }
/* 還沒做的關卡：虛線 + 🚧，和「做好了但還沒解鎖」的 🔒 區分開來。
   關卡之間的垂直間距很緊，額外加文字標籤會疊到上一關的標題，所以只用圖示；
   「製作中」三個字放在 title 屬性裡。 */
.node.wip { border-style: dashed; border-width: 2px; opacity: .45; }
.node-label {
  position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
  margin-top: 6px; white-space: nowrap;
  font-size: .72rem; font-weight: 800; color: var(--text-soft);
  max-width: min(140px, 40vw); overflow: hidden; text-overflow: ellipsis;
}
.node-crown {
  position: absolute; top: -10px; right: -6px;
  font-size: .95rem; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25));
}
.node-here {
  position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  margin-bottom: 8px; background: var(--surface); color: var(--blue-dark);
  border: 2px solid var(--border); border-radius: 8px;
  padding: 2px 9px; font-size: .7rem; font-weight: 800; white-space: nowrap;
  animation: bounce 1.6s ease-in-out infinite;
}

/* ============ 課程進行畫面 ============ */
.lesson-top {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg); padding: 10px 0 12px;
  display: flex; align-items: center; gap: 12px;
}
.lesson-quit { font-size: 1.4rem; color: var(--text-faint); line-height: 1; padding: 0 4px; }

.q-prompt { font-size: 1.15rem; font-weight: 800; margin: 4px 0 16px; }
.q-body { animation: slideUp .25s ease-out; }

/* 選項 */
.opts { display: grid; gap: 10px; }
.opts.grid2 { grid-template-columns: 1fr 1fr; }
.opt {
  text-align: left; padding: 14px 16px;
  border: 2px solid var(--border); border-bottom-width: var(--lip);
  border-radius: var(--radius-sm); background: var(--surface);
  font-weight: 700; transition: background .12s, border-color .12s;
}
.opt:hover:not(.opt-locked) { background: var(--bg-alt); }
.opt.sel     { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-dark); }
.opt.correct { border-color: var(--green); background: var(--green-soft); color: var(--green-dark); }
.opt.wrong   { border-color: var(--red); background: var(--red-soft); color: var(--red-dark); }
.opt-locked  { cursor: default; }
.opt-emoji   { font-size: 2.6rem; display: block; text-align: center; margin-bottom: 4px; }
.opt-kbd {
  display: inline-grid; place-items: center; width: 22px; height: 22px;
  border: 2px solid var(--border); border-radius: 6px;
  font-size: .7rem; color: var(--text-faint); margin-right: 8px; vertical-align: middle;
}

/* 底部批改列 */
.checkbar {
  position: sticky; bottom: 0; z-index: 25;
  margin: 20px -16px -32px; padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 2px solid var(--border);
}
.checkbar.ok  { background: var(--green-soft); border-top-color: var(--green); }
.checkbar.no  { background: var(--red-soft);   border-top-color: var(--red); }
.check-msg { font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.check-msg .ico { font-size: 1.5rem; }
.check-detail { font-weight: 700; font-size: .88rem; margin-top: 2px; }

/* ============ 單字卡 ============ */
.wordcard {
  border: 2px solid var(--border); border-radius: var(--radius-lg);
  background: var(--surface); padding: 22px 18px; text-align: center;
  margin-bottom: 14px;
}
.word-icon { font-size: 3.6rem; line-height: 1; margin-bottom: 6px; }
.word-main { font-size: 2rem; font-weight: 800; letter-spacing: -.01em; }
.word-kk   { font-family: var(--font-mono); color: var(--blue-dark); font-size: .95rem; margin-top: 2px; }
.word-pos  { display: inline-block; background: var(--bg-alt); color: var(--text-soft);
             border-radius: 6px; padding: 1px 7px; font-size: .72rem; font-weight: 800; margin-right: 6px; }
.word-zh   { font-size: 1.15rem; font-weight: 800; margin-top: 8px; }
.speak-btn {
  display: inline-grid; place-items: center; width: 44px; height: 44px;
  border-radius: 50%; background: var(--blue-soft); color: var(--blue-dark);
  font-size: 1.3rem; border-bottom: 3px solid var(--blue);
}
.speak-btn:active { transform: translateY(3px); border-bottom-width: 0; }
.speak-btn.playing { animation: pulse .8s infinite; }
.speak-btn.slow { font-size: .78rem; font-weight: 800; }

.ex-list { text-align: left; margin-top: 14px; border-top: 2px dashed var(--border); padding-top: 12px; }
.ex-item { margin-bottom: 10px; }
.ex-item:last-child { margin-bottom: 0; }
.sentence-en { font-weight: 700; }
.sentence-zh { color: var(--text-soft); font-size: .88rem; }
.ex-tag { font-size: .65rem; font-weight: 800; padding: 1px 6px; border-radius: 5px; vertical-align: 2px; }
.ex-tag.daily { background: var(--green-soft); color: var(--green-dark); }
.ex-tag.work  { background: var(--blue-soft);  color: var(--blue-dark); }

/* ============ 拖曳排句（寫作） ============ */
.build-area {
  min-height: 78px; border-bottom: 2px solid var(--border);
  padding: 8px 0; margin-bottom: 18px;
  display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start;
}
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.tok {
  padding: 8px 13px; border: 2px solid var(--border); border-bottom-width: 3px;
  border-radius: 10px; background: var(--surface); font-weight: 700;
  font-family: var(--font-en);
}
.tok:active { transform: translateY(2px); border-bottom-width: 1px; }
.tok.used { opacity: .25; pointer-events: none; }
.tok.ghost { visibility: hidden; }

/* ============ 填空 ============ */
.blank-input {
  border: none; border-bottom: 3px solid var(--blue);
  background: transparent; padding: 2px 6px; min-width: 96px;
  font-weight: 800; font-family: var(--font-en); text-align: center;
  outline: none;
}
.blank-input.correct { border-bottom-color: var(--green); color: var(--green-dark); }
.blank-input.wrong   { border-bottom-color: var(--red);   color: var(--red-dark); }
.cloze-text { font-size: 1.1rem; line-height: 2.2; font-family: var(--font-en); }
.textarea {
  width: 100%; min-height: 92px; padding: 12px;
  border: 2px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); resize: vertical; line-height: 1.6;
  font-family: var(--font-en); outline: none;
}
.textarea:focus { border-color: var(--blue); }

/* ============ 閱讀 ============ */
.article {
  background: var(--surface); border: 2px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  font-family: var(--font-en); font-size: 1.02rem; line-height: 1.95;
}
.article h3 { font-family: var(--font-en); margin-bottom: 10px; }
.w {
  cursor: pointer; border-radius: 3px;
  border-bottom: 1px dotted transparent;
}
.w.known { border-bottom-color: var(--blue); }
.w:hover { background: var(--gold); }
.readtimer {
  font-family: var(--font-mono); font-weight: 800; color: var(--text-soft);
  font-size: .85rem;
}
.wordpop {
  position: fixed; z-index: 90; max-width: 260px;
  background: var(--surface); border: 2px solid var(--blue);
  border-radius: var(--radius-sm); padding: 10px 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
  animation: pop .15s ease-out;
}

/* ============ 口說 ============ */
.mic-btn {
  width: 96px; height: 96px; border-radius: 50%;
  background: var(--blue); color: #fff; font-size: 2.6rem;
  border-bottom: 6px solid var(--blue-dark);
  display: grid; place-items: center; margin: 8px auto;
}
.mic-btn:active { transform: translateY(4px); border-bottom-width: 2px; }
.mic-btn.rec { background: var(--red); border-bottom-color: var(--red-dark); animation: pulse 1s infinite; }
.heard {
  font-family: var(--font-en); font-size: 1.05rem; font-weight: 700;
  padding: 10px 12px; border-radius: var(--radius-sm); background: var(--bg-alt);
  min-height: 44px;
}
.heard .hit  { color: var(--green-dark); }
.heard .miss { color: var(--red-dark); text-decoration: underline wavy var(--red); }
.score-big { font-size: 2.6rem; font-weight: 800; line-height: 1; }

/* ============ 徽章 / 成就 ============ */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 12px; }
.badge {
  text-align: center; padding: 12px 6px; border-radius: var(--radius-sm);
  border: 2px solid var(--border); background: var(--surface);
}
.badge.got { border-color: var(--gold); background: linear-gradient(180deg, #fff9e6, var(--surface)); }
html[data-theme="dark"] .badge.got { background: linear-gradient(180deg, #3a3115, var(--surface)); }
.badge-ico { font-size: 2rem; line-height: 1.2; }
.badge.locked .badge-ico { filter: grayscale(1) opacity(.35); }
.badge-name { font-size: .7rem; font-weight: 800; line-height: 1.3; }

/* ============ 統計 ============ */
.bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.bar {
  width: 100%; background: var(--green); border-radius: 6px 6px 0 0;
  min-height: 3px; transition: height .4s ease;
}
.bar.today { background: var(--blue); }
.bar-lab { font-size: .65rem; color: var(--text-faint); font-weight: 800; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.kpi { text-align: center; padding: 12px 8px; border: 2px solid var(--border); border-radius: var(--radius-sm); }
.kpi-num { font-size: 1.55rem; font-weight: 800; line-height: 1.2; }
.kpi-lab { font-size: .72rem; color: var(--text-soft); font-weight: 700; }

/* ============ 彈窗 ============ */
.modal-root { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; }
/* display 會蓋掉瀏覽器內建的 [hidden]，少了這行，關掉的彈窗會留在畫面上擋住點擊 */
.modal-root[hidden] { display: none; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.5); }
.modal-box {
  position: relative; z-index: 1; width: 100%; max-width: 460px;
  max-height: 86vh; overflow-y: auto;
  background: var(--surface); border-radius: var(--radius-lg);
  padding: 22px 20px; animation: pop .2s ease-out;
}
.modal-x { position: absolute; top: 10px; right: 12px; font-size: 1.1rem; color: var(--text-faint); }

/* ============ Toast ============ */
.toast-root {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--nav-h) + 16px); z-index: 120;
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none; width: max-content; max-width: 90vw;
}
.toast {
  background: #2b2b2b; color: #fff; font-weight: 800; font-size: .88rem;
  padding: 10px 16px; border-radius: 999px; animation: pop .2s ease-out;
  box-shadow: 0 6px 18px rgba(0,0,0,.25);
}
.toast.good { background: var(--green-dark); }
.toast.bad  { background: var(--red-dark); }
.toast.gold { background: var(--gold-dark); color: #fff; }

/* ============ 其他小元件 ============ */
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: .72rem; font-weight: 800;
  background: var(--bg-alt); color: var(--text-soft);
}
.tag.green { background: var(--green-soft); color: var(--green-dark); }
.tag.blue  { background: var(--blue-soft);  color: var(--blue-dark); }
.tag.red   { background: var(--red-soft);   color: var(--red-dark); }
.tag.gold  { background: #fff3cf; color: var(--gold-dark); }
html[data-theme="dark"] .tag.gold { background: #3a3115; }

.divider { height: 2px; background: var(--border); border-radius: 2px; margin: 18px 0; }

.empty {
  text-align: center; padding: 44px 16px; color: var(--text-soft);
}
.empty-ico { font-size: 3rem; margin-bottom: 8px; }

.list-row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 0; border-bottom: 2px solid var(--border);
}
.list-row:last-child { border-bottom: none; }

.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 2; }
.switch-track {
  position: absolute; inset: 0; border-radius: 999px;
  background: var(--border-strong); transition: background .2s;
}
.switch-knob {
  position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
  border-radius: 50%; background: #fff; transition: transform .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.switch input:checked ~ .switch-track { background: var(--green); }
.switch input:checked ~ .switch-knob  { transform: translateX(20px); }

.seg { display: flex; gap: 0; border: 2px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.seg button { flex: 1; padding: 8px 6px; font-weight: 800; font-size: .85rem; color: var(--text-soft); }
.seg button.on { background: var(--green); color: #fff; }

.hint-box {
  background: var(--blue-soft); border-left: 5px solid var(--blue);
  border-radius: 8px; padding: 11px 13px; margin: 12px 0; font-size: .92rem;
}
.warn-box {
  background: var(--red-soft); border-left: 5px solid var(--red);
  border-radius: 8px; padding: 11px 13px; margin: 12px 0; font-size: .92rem;
}
.rule-box {
  background: var(--bg-alt); border-radius: var(--radius-sm);
  padding: 12px 14px; margin: 10px 0;
}
.rule-formula {
  font-family: var(--font-en); font-weight: 800; font-size: 1.05rem;
  color: var(--green-dark); text-align: center; padding: 6px 0;
}
.tbl th, .tbl td { padding: 7px 8px; border-bottom: 2px solid var(--border); text-align: left; font-size: .9rem; }
.tbl th { font-weight: 800; color: var(--text-soft); font-size: .78rem; }
.tbl td.en { font-family: var(--font-en); font-weight: 700; }

/* ===== 多益 Part 1 / Part 2 ===== */

/* 照片本身自帶背景色 —— 它是「照片」，不該跟著深色主題翻轉 */
.photo-frame {
  border: 2px solid var(--border); border-radius: var(--radius);
  overflow: hidden; margin: 10px 0; line-height: 0;
}
.photo-frame svg { width: 100%; height: auto; display: block; }

.ask-card {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--blue-soft); border-radius: var(--radius-sm);
  padding: 12px 14px; margin: 10px 0;
}
.ask-label {
  font-size: .72rem; font-weight: 800; color: var(--blue-dark);
  border: 2px solid var(--blue); border-radius: 999px; padding: 2px 9px;
}
.ask-card .sentence-en { flex: 1 1 100%; }

/* 選項編號改用 A–D；鍵盤快捷仍是 1–4，只是數字不顯示 */
.opts-lettered .opt-kbd { display: none; }
.opt-letter {
  display: inline-grid; place-items: center; width: 26px; height: 26px;
  border: 2px solid var(--border-strong); border-radius: 999px;
  font-family: var(--font-en); font-weight: 800; font-size: .8rem;
  color: var(--text-soft); margin-right: 10px; vertical-align: middle;
}
.opt.correct .opt-letter { border-color: var(--green-dark); color: var(--green-dark); }
.opt.wrong .opt-letter   { border-color: var(--red-dark); color: var(--red-dark); }

/* 正在朗讀的選項 */
.opt-playing { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }

/* 只靠耳朵作答：選項文字預設收起來。
   這裡用 display:none 而不是 visibility:hidden —— 後者會保留「折行後的高度」，
   長句子的選項就變得比較高，等於用眼睛就看得出哪個選項最長。 */
.opt-say { display: inline-block; vertical-align: middle; min-height: 1.5em; }
.opt-text.is-hidden,
.ask-text.is-hidden { display: none; }

/* 作答後的四選項對照 */
.opt-review { display: grid; gap: 8px; margin: 4px 0 8px; }
.opt-review-row {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 10px; border-radius: var(--radius-sm); background: var(--bg-alt);
}
.opt-review-row.is-answer { background: var(--green-soft); }
.opt-review-row.is-ask { background: var(--blue-soft); margin-bottom: 8px; }
.opt-review-row .opt-letter { margin-right: 0; flex: 0 0 auto; }

</style>

<script>
/* ===== js/state.js ===== */
/* ==========================================================================
   state.js — 全域狀態、localStorage 存檔、匯出/匯入、進度碼
   使用方式：State.data 讀取，改完呼叫 State.save()
   ========================================================================== */
(function (global) {
  'use strict';

  var KEY = 'eq.save.v1';
  var VERSION = 1;

  /* ---------- 日期工具（一律用「本地時間」的 YYYY-MM-DD） ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function dayStr(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function addDays(str, n) {
    var p = str.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    d.setDate(d.getDate() + n);
    return dayStr(d);
  }

  function daysBetween(a, b) {
    var pa = a.split('-'), pb = b.split('-');
    var da = new Date(+pa[0], +pa[1] - 1, +pa[2]);
    var db = new Date(+pb[0], +pb[1] - 1, +pb[2]);
    return Math.round((db - da) / 86400000);
  }

  /* ---------- 預設存檔 ---------- */
  function blank() {
    return {
      v: VERSION,
      created: dayStr(),
      profile: {
        nickname: '',
        goalMin: 40,          // 每日目標分鐘數：20 / 40 / 60
        // 起步取向：phonics 先把發音練穩 / vocab 先衝單字與句子。
        // 只換發音關卡的出題配方，不動解鎖鏈 —— 舊存檔補進來會拿到 phonics，體感不變。
        track: 'phonics',
        rate: 0.85,           // TTS 語速
        voice: '',            // 指定的語音名稱（空 = 自動挑）
        theme: 'auto',        // auto / light / dark
        sound: true,          // 音效
        autoPlay: true,       // 出現英文時自動朗讀
        showKK: true          // 顯示 KK 音標
      },
      // 關卡進度： { 's0u1': { s:2, best:0.92, n:3, at:'2026-08-04' } }  s=星數
      units: {},
      // 間隔重複： { 's0_001': { ef:2.5, iv:1, rep:2, due:'2026-08-06', lap:0 } }
      srs: {},
      // 弱點怪獸： [ { k:'v:s0_001', t:'vocab', u:'s0u7', n:2, at:'2026-08-04' } ]
      weak: [],
      // 遊戲化
      g: {
        xp: 0, lvl: 1, gems: 0,
        streak: 0, bestStreak: 0, freeze: 0,
        // shieldUsedN 是「還沒告訴使用者」的擋刀次數，Gamify.noticeShield() 報過就歸零
        lastDay: '', shieldUsedOn: '', shieldUsedN: 0, doubleDay: ''
      },
      // 今日
      today: {
        day: dayStr(), xp: 0, min: 0, lessons: 0, newWords: 0,
        correct: 0, total: 0, challenge: false
      },
      // 歷史： { '2026-08-04': { xp:120, min:38, l:3, c:56, t:62 } }
      hist: {},
      // 成就： { 'first_lesson': '2026-08-04' }
      ach: {},
      // 累計
      total: { correct: 0, answered: 0, min: 0, lessons: 0, sessions: 0 }
    };
  }

  /* ---------- 深層合併（讓舊存檔補上新欄位） ---------- */
  function fill(target, defaults) {
    for (var k in defaults) {
      if (!Object.prototype.hasOwnProperty.call(defaults, k)) continue;
      var dv = defaults[k];
      if (target[k] === undefined || target[k] === null) {
        target[k] = (dv && typeof dv === 'object' && !Array.isArray(dv)) ? fill({}, dv) : dv;
      } else if (dv && typeof dv === 'object' && !Array.isArray(dv) && typeof target[k] === 'object') {
        fill(target[k], dv);
      }
    }
    return target;
  }

  var data = blank();
  var listeners = [];

  /* ---------- 讀檔 / 存檔 ---------- */
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { /* 隱私模式 */ }
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        data = fill(parsed, blank());
      } catch (e) {
        console.warn('存檔毀損，改用新檔', e);
        data = blank();
      }
    }
    rollDay();
    return data;
  }

  var saveTimer = null;
  function save(immediate) {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    if (immediate) { writeNow(); return; }
    saveTimer = setTimeout(writeNow, 250);   // 合併連續寫入
  }

  function writeNow() {
    saveTimer = null;
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) {
      console.error('無法存檔（可能是空間已滿或瀏覽器封鎖）', e);
      if (global.UI && UI.toast) UI.toast('⚠️ 進度存檔失敗，請檢查瀏覽器設定', 'bad', 4000);
    }
    for (var i = 0; i < listeners.length; i++) { try { listeners[i](data); } catch (e) {} }
  }

  function onChange(fn) { listeners.push(fn); }

  /* ---------- 跨日處理：結算昨天、重置今天、判斷 streak ---------- */
  function rollDay() {
    var now = dayStr();
    if (data.today.day === now) return false;

    // 把昨天的成績寫進歷史
    if (data.today.day && (data.today.xp > 0 || data.today.total > 0)) {
      data.hist[data.today.day] = {
        xp: data.today.xp, min: Math.round(data.today.min),
        l: data.today.lessons, c: data.today.correct, t: data.today.total
      };
    }

    // streak 判定：昨天有達標才續，否則看有沒有護盾
    if (data.g.lastDay) {
      var gap = daysBetween(data.g.lastDay, now);
      if (gap > 1) {
        var missed = gap - 1;
        if (data.g.freeze >= missed) {
          data.g.freeze -= missed;                   // 護盾擋掉
          data.g.shieldUsedOn = now;
          data.g.shieldUsedN = (data.g.shieldUsedN || 0) + missed;
        } else {
          data.g.streak = 0;                         // 斷了
        }
      }
    }

    data.today = {
      day: now, xp: 0, min: 0, lessons: 0, newWords: 0,
      correct: 0, total: 0, challenge: false
    };
    save(true);
    return true;
  }

  /* ---------- 匯出 / 匯入 ---------- */
  function toJSON() { return JSON.stringify(data); }

  function download() {
    var blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'EnglishQuest-進度-' + dayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  // UTF-8 安全的 base64（進度碼用，方便手機剪貼簿同步）
  function b64encode(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    for (var i = 0; i < bytes.length; i += 8192) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    }
    return btoa(bin);
  }

  function b64decode(b64) {
    var bin = atob(b64.replace(/\s+/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function toCode() { return 'EQ1:' + b64encode(JSON.stringify(data)); }

  function fromCode(code) {
    code = (code || '').trim();
    if (code.indexOf('EQ1:') === 0) code = code.slice(4);
    return importJSON(b64decode(code));
  }

  function importJSON(text) {
    var incoming = JSON.parse(text);
    if (!incoming || typeof incoming !== 'object' || !incoming.v) {
      throw new Error('這不是有效的 English Quest 進度檔');
    }
    data = fill(incoming, blank());
    rollDay();
    save(true);
    return data;
  }

  function reset() {
    data = blank();
    save(true);
  }

  /* ---------- 常用小工具 ---------- */
  function unit(id) {
    if (!data.units[id]) data.units[id] = { s: 0, lv: 0, best: 0, n: 0, at: '' };
    if (data.units[id].lv === undefined) data.units[id].lv = data.units[id].s > 0 ? 1 : 0;
    return data.units[id];
  }

  function isUnitDone(id) { return !!(data.units[id] && data.units[id].s > 0); }

  function goalPct() {
    var target = data.profile.goalMin * 3;   // 每分鐘約 3 XP → 40 分鐘 = 120 XP
    if (target <= 0) return 1;
    return Math.min(1, data.today.xp / target);
  }

  function goalXP() { return data.profile.goalMin * 3; }

  /* ---------- 學習時間累計（每 10 秒 tick 一次） ---------- */
  var tickTimer = null;
  var lastActive = Date.now();

  function markActive() { lastActive = Date.now(); }

  function startClock() {
    if (tickTimer) return;
    tickTimer = setInterval(function () {
      // 只有近 90 秒內有互動才算「在學習」，避免掛著不動也在計時
      if (Date.now() - lastActive < 90000 && !document.hidden) {
        data.today.min += 10 / 60;
        data.total.min += 10 / 60;
        save();
      }
    }, 10000);
    ['click', 'keydown', 'touchstart', 'pointerdown'].forEach(function (ev) {
      document.addEventListener(ev, markActive, { passive: true });
    });
  }

  global.State = {
    VERSION: VERSION,
    get data() { return data; },
    load: load,
    save: save,
    onChange: onChange,
    rollDay: rollDay,
    dayStr: dayStr,
    addDays: addDays,
    daysBetween: daysBetween,
    toJSON: toJSON,
    toCode: toCode,
    fromCode: fromCode,
    importJSON: importJSON,
    download: download,
    reset: reset,
    unit: unit,
    isUnitDone: isUnitDone,
    goalPct: goalPct,
    goalXP: goalXP,
    startClock: startClock,
    markActive: markActive
  };
})(window);

</script>
<script>
/* ===== js/content.js ===== */
/* ==========================================================================
   content.js — 內容查詢層
   把 data/*.js 的各份資料合併、建索引，提供給題型與排程使用。
   ========================================================================== */
(function (global) {
  'use strict';

  function cat() {
    var out = [];
    for (var i = 0; i < arguments.length; i++) {
      var a = arguments[i];
      if (a && a.length) out = out.concat(a);
    }
    return out;
  }

  var VOCAB   = cat(global.DATA_VOCAB_S0,
                    global.DATA_VOCAB_S1A, global.DATA_VOCAB_S1B, global.DATA_VOCAB_S1C,
                    global.DATA_VOCAB_S2, global.DATA_VOCAB_S2B);
  var GRAMMAR = cat(global.DATA_GRAMMAR_S0, global.DATA_GRAMMAR_S1, global.DATA_GRAMMAR_S2);
  var READING = cat(global.DATA_READING_S0, global.DATA_READING_S1, global.DATA_READING_S2);
  var PHOTO   = cat(global.DATA_PHOTO_S2);      // 多益 Part 1：看圖聽描述
  var RESPOND = cat(global.DATA_RESPOND_S2);    // 多益 Part 2：應答問題
  var PHONICS = global.DATA_PHONICS || {};
  var IRREG   = global.DATA_IRREGULAR || [];
  var CUR     = global.DATA_CURRICULUM || { stages: [], rules: {} };

  /* ---------- 索引 ---------- */
  var byId = {}, vocabByUnit = {}, grammarByUnit = {}, readingByUnit = {};
  var photoByUnit = {}, respondByUnit = {};
  var unitById = {}, stageOfUnit = {}, unitOrder = [];

  VOCAB.forEach(function (v) {
    byId[v.id] = v;
    (vocabByUnit[v.u] = vocabByUnit[v.u] || []).push(v);
  });
  GRAMMAR.forEach(function (g) {
    byId[g.id] = g;
    (grammarByUnit[g.u] = grammarByUnit[g.u] || []).push(g);
  });
  READING.forEach(function (r) {
    byId[r.id] = r;
    (readingByUnit[r.u] = readingByUnit[r.u] || []).push(r);
  });
  PHOTO.forEach(function (p) {
    byId[p.id] = p;
    (photoByUnit[p.u] = photoByUnit[p.u] || []).push(p);
  });
  RESPOND.forEach(function (q) {
    byId[q.id] = q;
    (respondByUnit[q.u] = respondByUnit[q.u] || []).push(q);
  });
  // 不規則動詞不綁關卡，但要能用 id 查回來（弱點怪獸需要）
  IRREG.forEach(function (iv) { byId[iv.id] = iv; });

  CUR.stages.forEach(function (st) {
    (st.units || []).forEach(function (u) {
      unitById[u.id] = u;
      stageOfUnit[u.id] = st;
      unitOrder.push(u.id);
    });
  });

  /* ---------- 基本查詢 ---------- */
  function unit(id)      { return unitById[id] || null; }
  function stageOf(id)   { return stageOfUnit[id] || null; }
  function stages()      { return CUR.stages; }
  function rules()       { return CUR.rules; }
  function item(id)      { return byId[id] || null; }
  function vocabOf(uid)  { return vocabByUnit[uid] || []; }
  function grammarOf(uid){ return grammarByUnit[uid] || []; }
  function readingOf(uid){ return readingByUnit[uid] || []; }
  function photoOf(uid)  { return photoByUnit[uid] || []; }
  function respondOf(uid){ return respondByUnit[uid] || []; }
  function phonics(key)  { return PHONICS[key] || null; }
  function irregulars()  { return IRREG; }
  function allVocab()    { return VOCAB; }

  /* 這個關卡「以及之前所有關卡」的單字（複習題要從舊字裡抽） */
  function vocabUpTo(uid) {
    var idx = unitOrder.indexOf(uid);
    if (idx < 0) return VOCAB.slice();
    var out = [];
    for (var i = 0; i <= idx; i++) out = out.concat(vocabByUnit[unitOrder[i]] || []);
    return out;
  }

  function grammarUpTo(uid) {
    var idx = unitOrder.indexOf(uid);
    if (idx < 0) return GRAMMAR.slice();
    var out = [];
    for (var i = 0; i <= idx; i++) out = out.concat(grammarByUnit[unitOrder[i]] || []);
    return out;
  }

  /* 魔王關自己沒有 Part 1／Part 2 題目，要能往前把所有學過的都收進來 */
  function upTo(byUnit, all, uid) {
    var idx = unitOrder.indexOf(uid);
    if (idx < 0) return all.slice();
    var out = [];
    for (var i = 0; i <= idx; i++) out = out.concat(byUnit[unitOrder[i]] || []);
    return out;
  }
  function photoUpTo(uid)   { return upTo(photoByUnit, PHOTO, uid); }
  function respondUpTo(uid) { return upTo(respondByUnit, RESPOND, uid); }

  /* ---------- 關卡順序與解鎖 ---------- */
  function orderedUnitIds() { return unitOrder.slice(); }

  function prevUnitId(uid) {
    var i = unitOrder.indexOf(uid);
    return i > 0 ? unitOrder[i - 1] : null;
  }

  /**
   * 關卡實際採用的配方。
   * 發音關卡另外備了一份「單字優先」的 planVocab：解鎖是一條鏈，想快點學句子的人
   * 一樣得走完 s0u1–s0u5，所以能換的只有同一關裡出哪些題。沒有 planVocab 就用 plan。
   */
  function planOf(uid) {
    var u = unitById[uid];
    if (!u) return null;
    var track = (State.data.profile && State.data.profile.track) || 'phonics';
    if (track === 'vocab' && u.planVocab && u.planVocab.length) return u.planVocab;
    return (u.plan && u.plan.length) ? u.plan : null;
  }

  /** 關卡可玩的條件：階段開放、有課表，而且真的有內容可出題 */
  function isReady(uid) {
    var u = unitById[uid];
    if (!u) return false;
    var st = stageOfUnit[uid];
    if (!st || !st.ready || !u.plan || !u.plan.length) return false;
    // 有任何一種自己的內容就算數：純聽力關卡（Part 1／Part 2）沒有單字也沒有文法，
    // 魔王關則相反 —— 題目全往前借，只有自己的短文。
    var hasContent = (vocabByUnit[uid] && vocabByUnit[uid].length) ||
                     (grammarByUnit[uid] && grammarByUnit[uid].length) ||
                     (readingByUnit[uid] && readingByUnit[uid].length) ||
                     (photoByUnit[uid] && photoByUnit[uid].length) ||
                     (respondByUnit[uid] && respondByUnit[uid].length);
    return !!hasContent;
  }

  /** 解鎖條件：第一關永遠開；其餘要前一關拿到至少 1 星，且該階段內容已備妥 */
  function isUnlocked(uid) {
    if (!isReady(uid)) return false;
    var prev = prevUnitId(uid);
    if (!prev) return true;
    return State.isUnitDone(prev);
  }

  /** 目前應該打的那一關（第一個已解鎖但還沒過的關） */
  function currentUnitId() {
    for (var i = 0; i < unitOrder.length; i++) {
      var id = unitOrder[i];
      if (!isReady(id)) continue;
      if (!State.isUnitDone(id) && isUnlocked(id)) return id;
    }
    // 全部打完 → 回傳最後一個可用關卡
    for (var j = unitOrder.length - 1; j >= 0; j--) {
      if (isReady(unitOrder[j])) return unitOrder[j];
    }
    return unitOrder[0];
  }

  /* ---------- 隨機與誘答選項 ---------- */
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function sample(arr, n) { return shuffle(arr).slice(0, n); }

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  /**
   * 產生誘答用的單字：優先挑同詞性、同關卡附近的字，比較有鑑別度。
   */
  function distractors(target, n, pool) {
    pool = pool || vocabUpTo(target.u);
    var same = pool.filter(function (v) { return v.id !== target.id && v.pos === target.pos; });
    var rest = pool.filter(function (v) { return v.id !== target.id && v.pos !== target.pos; });
    var out = sample(same, n);
    if (out.length < n) out = out.concat(sample(rest, n - out.length));
    if (out.length < n) {
      var wide = VOCAB.filter(function (v) { return v.id !== target.id; });
      out = out.concat(sample(wide, n - out.length));
    }
    return out.slice(0, n);
  }

  /* ---------- 統計 ---------- */
  function counts() {
    return {
      vocab: VOCAB.length,
      grammar: GRAMMAR.length,
      reading: READING.length,
      photo: PHOTO.length,
      respond: RESPOND.length,
      units: unitOrder.filter(isReady).length,
      unitsAll: unitOrder.length
    };
  }

  global.Content = {
    unit: unit, stageOf: stageOf, stages: stages, rules: rules, item: item,
    vocabOf: vocabOf, grammarOf: grammarOf, readingOf: readingOf,
    photoOf: photoOf, respondOf: respondOf,
    vocabUpTo: vocabUpTo, grammarUpTo: grammarUpTo, allVocab: allVocab,
    photoUpTo: photoUpTo, respondUpTo: respondUpTo,
    phonics: phonics, irregulars: irregulars,
    orderedUnitIds: orderedUnitIds, prevUnitId: prevUnitId, planOf: planOf,
    isReady: isReady, isUnlocked: isUnlocked, currentUnitId: currentUnitId,
    shuffle: shuffle, sample: sample, pick: pick, distractors: distractors,
    counts: counts
  };
})(window);

</script>
<script>
/* ===== js/srs.js ===== */
/* ==========================================================================
   srs.js — 間隔重複（SM-2 簡化版）
   單字要真的記住，靠的不是看幾次，而是「在快忘掉的那一刻剛好複習到」。
   --------------------------------------------------------------------------
   評分 q： 0 = 完全忘記   1 = 想很久才答對   2 = 順利答對
   ========================================================================== */
(function (global) {
  'use strict';

  var FIRST_STEPS = [0, 1, 3];   // 前三次的間隔（天）：當天再看一次 → 隔天 → 三天後
  var MAX_IV = 240;              // 上限 8 個月

  function rec(id) {
    var s = State.data.srs;
    if (!s[id]) {
      s[id] = { ef: 2.5, iv: 0, rep: 0, due: State.dayStr(), lap: 0, n: 0 };
    }
    return s[id];
  }

  function has(id) { return !!State.data.srs[id]; }

  /** 記錄一次作答結果，更新下次複習日 */
  function grade(id, q) {
    var r = rec(id);
    r.n = (r.n || 0) + 1;

    if (q <= 0) {
      // 忘了 → 打回重來，當天再排一次
      r.lap = (r.lap || 0) + 1;
      r.rep = 0;
      r.iv = 0;
      r.ef = Math.max(1.3, r.ef - 0.2);
      r.due = State.dayStr();
    } else {
      if (r.rep < FIRST_STEPS.length) {
        r.iv = FIRST_STEPS[r.rep];
      } else {
        r.iv = Math.round(Math.max(1, r.iv) * r.ef);
      }
      if (q === 1) r.iv = Math.max(1, Math.round(r.iv * 0.6));   // 想很久 → 間隔打折
      r.iv = Math.min(MAX_IV, r.iv);
      r.rep++;
      // EF 調整
      r.ef = Math.max(1.3, Math.min(2.8, r.ef + (q === 2 ? 0.06 : -0.08)));
      r.due = State.addDays(State.dayStr(), r.iv);   // iv = 0 代表當天稍後再看一次
    }
    State.save();
    return r;
  }

  /** 到期需要複習的項目 id 清單（依逾期天數排序，逾期最久的先） */
  function dueIds(limit) {
    var today = State.dayStr();
    var s = State.data.srs;
    var out = [];
    for (var id in s) {
      if (!Object.prototype.hasOwnProperty.call(s, id)) continue;
      if (s[id].due <= today) out.push(id);
    }
    out.sort(function (a, b) {
      var d = State.daysBetween(s[b].due, today) - State.daysBetween(s[a].due, today);
      if (d !== 0) return d;
      return (s[a].ef || 2.5) - (s[b].ef || 2.5);   // 難的優先
    });
    return limit ? out.slice(0, limit) : out;
  }

  function dueCount() { return dueIds().length; }

  /** 未來 7 天的到期分布，給統計頁畫圖用 */
  function forecast(days) {
    days = days || 7;
    var out = [];
    var s = State.data.srs;
    for (var d = 0; d < days; d++) {
      var day = State.addDays(State.dayStr(), d);
      var c = 0;
      for (var id in s) {
        if (!Object.prototype.hasOwnProperty.call(s, id)) continue;
        if (d === 0 ? s[id].due <= day : s[id].due === day) c++;
      }
      out.push({ day: day, count: c });
    }
    return out;
  }

  /** 熟練度分級：用來算「已精熟單字數」 */
  function levelOf(id) {
    var r = State.data.srs[id];
    if (!r) return 0;                    // 沒學過
    if (r.iv >= 21) return 3;            // 精熟（間隔超過三週）
    if (r.iv >= 7) return 2;             // 熟悉
    return 1;                            // 學習中
  }

  function stats() {
    var s = State.data.srs;
    var o = { seen: 0, learning: 0, familiar: 0, mastered: 0 };
    for (var id in s) {
      if (!Object.prototype.hasOwnProperty.call(s, id)) continue;
      o.seen++;
      var l = levelOf(id);
      if (l === 3) o.mastered++;
      else if (l === 2) o.familiar++;
      else o.learning++;
    }
    return o;
  }

  /* ---------- 弱點怪獸（答錯的題目） ---------- */
  function weakKey(type, refId) { return type + ':' + refId; }

  function addWeak(type, refId, unitId) {
    var w = State.data.weak;
    var k = weakKey(type, refId);
    for (var i = 0; i < w.length; i++) {
      if (w[i].k === k) { w[i].n++; w[i].at = State.dayStr(); State.save(); return; }
    }
    w.push({ k: k, t: type, r: refId, u: unitId || '', n: 1, at: State.dayStr() });
    State.save();
  }

  function clearWeak(type, refId) {
    var k = weakKey(type, refId);
    var w = State.data.weak;
    for (var i = 0; i < w.length; i++) {
      if (w[i].k === k) { w.splice(i, 1); State.save(); return true; }
    }
    return false;
  }

  function weakList() { return State.data.weak.slice(); }
  function weakCount() { return State.data.weak.length; }

  global.SRS = {
    rec: rec, has: has, grade: grade,
    dueIds: dueIds, dueCount: dueCount, forecast: forecast,
    levelOf: levelOf, stats: stats,
    addWeak: addWeak, clearWeak: clearWeak, weakList: weakList, weakCount: weakCount
  };
})(window);

</script>
<script>
/* ===== js/gamify.js ===== */
/* ==========================================================================
   gamify.js — XP、等級、連續天數、寶石、成就
   設計原則：只給獎勵，不砍血。成人自學最大的敵人是「今天不想開」，
   所以所有機制都往「回來就有好事發生」的方向設計。
   ========================================================================== */
(function (global) {
  'use strict';

  /* ---------- 等級曲線：越後面越慢，但永遠看得到下一級 ---------- */
  function xpForLevel(lv) { return Math.round(60 * Math.pow(lv, 1.45)); }

  function levelInfo() {
    var xp = State.data.g.xp;
    var lv = 1, need = xpForLevel(1), acc = 0;
    while (xp >= acc + need && lv < 200) {
      acc += need; lv++; need = xpForLevel(lv);
    }
    return { level: lv, into: xp - acc, need: need, pct: need ? (xp - acc) / need : 0 };
  }

  /* ---------- 加經驗 ---------- */
  function addXP(n, why) {
    if (!n) return;
    if (State.data.g.doubleDay === State.dayStr()) n *= 2;   // 商店買的雙倍 XP
    var before = levelInfo().level;
    State.data.g.xp += n;
    State.data.today.xp += n;
    var after = levelInfo().level;
    State.data.g.lvl = after;
    State.save();
    if (global.UI) UI.refreshChips();
    if (after > before) {
      Sfx.play('levelup');
      UI.modal(
        '<div class="center">' +
        '<div style="font-size:4rem">🎉</div>' +
        '<h2>升級了！Lv.' + after + '</h2>' +
        '<p class="muted">' + (why || '繼續保持這個節奏') + '</p>' +
        '<button class="btn btn-primary btn-lg mt16" data-modal-close>太棒了</button>' +
        '</div>'
      );
    }
  }

  function addGems(n, why) {
    if (!n) return;
    State.data.g.gems += n;
    State.save();
    if (global.UI) {
      UI.refreshChips();
      UI.toast('💎 +' + n + (why ? '　' + why : ''), 'gold');
    }
  }

  function spendGems(n) {
    if (State.data.g.gems < n) return false;
    State.data.g.gems -= n;
    State.save();
    if (global.UI) UI.refreshChips();
    return true;
  }

  /* ---------- 連續天數 ---------- */
  /** 今天達成每日目標時呼叫；同一天只會生效一次 */
  function touchStreak() {
    var g = State.data.g;
    var today = State.dayStr();
    if (g.lastDay === today) return false;

    var gap = g.lastDay ? State.daysBetween(g.lastDay, today) : 1;
    g.streak = (gap === 1 || !g.lastDay) ? g.streak + 1 : 1;
    g.lastDay = today;
    if (g.streak > g.bestStreak) g.bestStreak = g.streak;
    State.save();

    if (global.UI) {
      UI.refreshChips();
      UI.modal(
        '<div class="center">' +
        '<div style="font-size:4.2rem">🔥</div>' +
        '<h2>連續 ' + g.streak + ' 天！</h2>' +
        '<p class="muted">今天的目標達成了。明天再來，火苗就不會熄。</p>' +
        (g.streak === g.bestStreak && g.streak > 1
          ? '<p class="tag gold">個人新紀錄</p>' : '') +
        '<button class="btn btn-primary btn-lg mt16" data-modal-close>繼續</button>' +
        '</div>'
      );
    }

    // 每 7 天送寶石
    if (g.streak % 7 === 0) addGems(Content.rules().gemPerStreak7 || 15, '連續 ' + g.streak + ' 天獎勵');
    check();
    return true;
  }

  /** 每日目標是否已達成 */
  function goalMet() { return State.data.today.xp >= State.goalXP(); }

  /* ---------- 關卡結算 ---------- */
  /**
   * @param {string} unitId
   * @param {number} correct 答對題數
   * @param {number} total   總題數（不含教學卡）
   * @returns {object} 結算結果
   */
  function finishLesson(unitId, correct, total) {
    var R = Content.rules();
    var u = Content.unit(unitId) || {};
    var rate = total > 0 ? correct / total : 0;
    var passed = rate >= R.passRate;

    var stars = 0;
    if (passed) stars = rate >= R.star3 ? 3 : (rate >= R.star2 ? 2 : 1);

    var xp = correct * R.xpPerCorrect + (passed ? R.xpPerLesson : 0);
    if (passed && u.boss) xp += R.xpBossBonus;
    if (stars === 3) xp += R.xpPerfectBonus;

    var gems = 0;
    var rec = State.unit(unitId);
    var firstClear = passed && rec.s === 0;
    if (firstClear) gems = u.boss ? (R.gemPerBoss || 10) : (R.gemPerLesson || 2);

    // 寫進度
    rec.n = (rec.n || 0) + 1;
    rec.best = Math.max(rec.best || 0, rate);
    if (stars > (rec.s || 0)) rec.s = stars;
    if (passed && !rec.at) rec.at = State.dayStr();

    // 皇冠等級：每通關一次 +1（上限 5），代表這一關被刷了幾輪
    var crownUp = false;
    if (passed && (rec.lv || 0) < 5) { rec.lv = (rec.lv || 0) + 1; crownUp = true; }

    State.data.today.lessons++;
    State.data.today.correct += correct;
    State.data.today.total += total;
    State.data.total.correct += correct;
    State.data.total.answered += total;
    State.data.total.lessons++;
    State.save(true);

    addXP(xp);
    if (gems) addGems(gems, firstClear ? '首次通關' : '');

    var streakFired = false;
    if (goalMet()) streakFired = touchStreak();
    check();

    return {
      passed: passed, stars: stars, rate: rate, crown: rec.lv, crownUp: crownUp,
      xp: xp, gems: gems, firstClear: firstClear, streakFired: streakFired
    };
  }

  /* ---------- 護盾 ---------- */
  /**
   * 護盾是靜靜生效的（rollDay 裡扣掉），不講的話使用者根本不知道自己被救了 —
   * 那 40 顆寶石就白花了。回報一次就把計數歸零。
   */
  function noticeShield() {
    var g = State.data.g;
    if (!g.shieldUsedN) return false;
    var n = g.shieldUsedN;
    g.shieldUsedN = 0;
    State.save(true);
    if (global.UI) {
      UI.modal(
        '<div class="center">' +
        '<div style="font-size:4rem">🛡️</div>' +
        '<h2>護盾幫你擋下來了</h2>' +
        '<p class="muted">你有 ' + n + ' 天沒出現，連續 ' + g.streak + ' 天原本會歸零。' +
        '護盾用掉 ' + n + ' 個，還剩 ' + g.freeze + ' 個。</p>' +
        '<p class="small muted">今天達成目標，火苗就會繼續。</p>' +
        '<button class="btn btn-primary btn-lg mt16" data-modal-close>知道了</button>' +
        '</div>'
      );
    }
    return true;
  }

  function buyFreeze(cost) {
    cost = cost || 40;
    if (State.data.g.freeze >= 3) { UI.toast('護盾最多存 3 個', 'bad'); return false; }
    if (!spendGems(cost)) { UI.toast('寶石不夠', 'bad'); return false; }
    State.data.g.freeze++;
    State.save();
    UI.toast('🛡️ 護盾 +1，斷一天也不會歸零', 'good');
    return true;
  }

  /* ---------- 成就 ---------- */
  function has(id) { return !!State.data.ach[id]; }

  function grant(id) {
    if (has(id)) return false;
    var def = (global.DATA_ACHIEVEMENTS || []).filter(function (a) { return a.id === id; })[0];
    State.data.ach[id] = State.dayStr();
    State.save();
    if (def) {
      if (def.gems) addGems(def.gems, '');
      Sfx.play('badge');
      UI.toast(def.icon + ' 解鎖成就：' + def.name, 'gold', 3200);
    }
    return true;
  }

  /** 掃描所有成就條件，該給的就給 */
  function check() {
    var list = global.DATA_ACHIEVEMENTS || [];
    var ctx = buildCtx();
    for (var i = 0; i < list.length; i++) {
      var a = list[i];
      if (has(a.id)) continue;
      try { if (a.test(ctx)) grant(a.id); } catch (e) { /* 條件寫錯不該擋住學習 */ }
    }
  }

  function buildCtx() {
    var d = State.data;
    var s = SRS.stats();
    var unitsDone = 0, stars = 0, perfect = 0;
    for (var k in d.units) {
      if (!Object.prototype.hasOwnProperty.call(d.units, k)) continue;
      if (d.units[k].s > 0) unitsDone++;
      stars += d.units[k].s || 0;
      if (d.units[k].s === 3) perfect++;
    }
    return {
      d: d, srs: s,
      unitsDone: unitsDone, stars: stars, perfectUnits: perfect,
      streak: d.g.streak, bestStreak: d.g.bestStreak,
      level: levelInfo().level, xp: d.g.xp,
      totalMin: d.total.min, totalAnswered: d.total.answered,
      accuracy: d.total.answered ? d.total.correct / d.total.answered : 0,
      daysStudied: Object.keys(d.hist).length + (d.today.xp > 0 ? 1 : 0)
    };
  }

  function earned() {
    return (global.DATA_ACHIEVEMENTS || []).map(function (a) {
      return { def: a, got: State.data.ach[a.id] || null };
    });
  }

  global.Gamify = {
    xpForLevel: xpForLevel, levelInfo: levelInfo,
    addXP: addXP, addGems: addGems, spendGems: spendGems,
    touchStreak: touchStreak, goalMet: goalMet,
    finishLesson: finishLesson, buyFreeze: buyFreeze, noticeShield: noticeShield,
    has: has, grant: grant, check: check, earned: earned
  };

  /* ==========================================================================
     Sfx — 用 WebAudio 直接合成音效，不需要任何音檔（維持單資料夾可攜）
     ========================================================================== */
  var actx = null;
  function ac() {
    if (!actx) {
      var C = global.AudioContext || global.webkitAudioContext;
      if (!C) return null;
      actx = new C();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  function tone(freq, start, dur, type, vol) {
    var a = ac(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, a.currentTime + start);
    g.gain.setValueAtTime(0.0001, a.currentTime + start);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, a.currentTime + start + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + start + dur);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime + start);
    o.stop(a.currentTime + start + dur + 0.02);
  }

  var Sfx = {
    play: function (name) {
      if (!State.data.profile.sound) return;
      try {
        switch (name) {
          case 'correct': tone(660, 0, .12, 'triangle'); tone(880, .09, .16, 'triangle'); break;
          case 'wrong':   tone(190, 0, .18, 'sawtooth', .10); break;
          case 'click':   tone(520, 0, .05, 'sine', .07); break;
          case 'levelup': [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * .09, .22, 'triangle'); }); break;
          case 'badge':   [784, 988, 1319].forEach(function (f, i) { tone(f, i * .08, .25, 'sine'); }); break;
          case 'finish':  [523, 659, 784].forEach(function (f, i) { tone(f, i * .11, .3, 'sine'); }); break;
        }
      } catch (e) { /* 音效失敗不影響學習 */ }
    }
  };
  global.Sfx = Sfx;

})(window);

</script>
<script>
/* ===== js/speech.js ===== */
/* ==========================================================================
   speech.js — 朗讀（TTS）、口說辨識（STT）、離線錄音降級
   --------------------------------------------------------------------------
   朗讀：speechSynthesis，Windows/Chrome/Edge 有本機語音，離線可用。
   辨識：SpeechRecognition 走雲端，必須連網；斷網時自動改成錄音回放 + 自評。
   ========================================================================== */
(function (global) {
  'use strict';

  var synth = global.speechSynthesis || null;
  var voices = [];
  var pickedVoice = null;

  /* ---------- 語音清單 ---------- */
  function loadVoices() {
    if (!synth) return;
    voices = synth.getVoices() || [];
    pickedVoice = chooseVoice();
  }

  function chooseVoice() {
    if (!voices.length) return null;
    var want = State.data.profile.voice;
    if (want) {
      var exact = voices.filter(function (v) { return v.name === want; })[0];
      if (exact) return exact;
    }
    var en = voices.filter(function (v) { return /^en(-|_|$)/i.test(v.lang); });
    if (!en.length) return null;
    // 優先順序：美式 > 自然音質關鍵字 > 其它英文
    var prefer = ['en-US', 'en_US'];
    var us = en.filter(function (v) { return prefer.indexOf(v.lang) >= 0; });
    var pool = us.length ? us : en;
    var nice = pool.filter(function (v) {
      return /natural|neural|online|aria|jenny|guy|zira|david|samantha/i.test(v.name);
    });
    return (nice[0] || pool[0]);
  }

  function voiceList() {
    return voices.filter(function (v) { return /^en(-|_|$)/i.test(v.lang); });
  }

  if (synth) {
    loadVoices();
    if (typeof synth.onvoiceschanged !== 'undefined') {
      synth.onvoiceschanged = loadVoices;
    }
    // 有些瀏覽器第一次 getVoices() 回空陣列，補一次
    setTimeout(loadVoices, 400);
    setTimeout(loadVoices, 1500);
  }

  /* ---------- 朗讀 ---------- */
  var currentBtn = null;

  function speak(text, opts) {
    opts = opts || {};
    if (!synth || !text) return Promise.resolve(false);

    try { synth.cancel(); } catch (e) {}
    if (currentBtn) { currentBtn.classList.remove('playing'); currentBtn = null; }

    var u = new SpeechSynthesisUtterance(String(text));
    if (!pickedVoice) loadVoices();
    if (pickedVoice) { u.voice = pickedVoice; u.lang = pickedVoice.lang; }
    else u.lang = 'en-US';
    u.rate = opts.rate != null ? opts.rate : (State.data.profile.rate || 0.85);
    u.pitch = opts.pitch != null ? opts.pitch : 1;
    u.volume = 1;

    if (opts.btn) { currentBtn = opts.btn; opts.btn.classList.add('playing'); }

    return new Promise(function (resolve) {
      var done = false;
      function finish(ok) {
        if (done) return; done = true;
        if (opts.btn) opts.btn.classList.remove('playing');
        if (currentBtn === opts.btn) currentBtn = null;
        resolve(ok);
      }
      u.onend = function () { finish(true); };
      u.onerror = function () { finish(false); };
      try { synth.speak(u); } catch (e) { finish(false); }
      // 保險：Chrome 偶爾不觸發 onend
      setTimeout(function () { finish(true); }, 1200 + String(text).length * 90);
    });
  }

  function stop() {
    try { if (synth) synth.cancel(); } catch (e) {}
    if (currentBtn) { currentBtn.classList.remove('playing'); currentBtn = null; }
  }

  function available() { return !!synth && voiceList().length > 0; }

  /** 產生一顆發音按鈕的 HTML（用 data-speak 讓事件代理接手） */
  function btn(text, slow, extraCls) {
    return '<button class="speak-btn ' + (slow ? 'slow ' : '') + (extraCls || '') +
      '" data-speak="' + UI.esc(text) + '"' + (slow ? ' data-slow="1"' : '') +
      ' aria-label="朗讀">' + (slow ? '0.5×' : '🔊') + '</button>';
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-speak]') : null;
    if (!b) return;
    e.preventDefault();
    var slow = b.getAttribute('data-slow') === '1';
    speak(b.getAttribute('data-speak'), {
      btn: b,
      rate: slow ? Math.max(0.4, (State.data.profile.rate || 0.85) * 0.55) : undefined

  /* ==========================================================================
     口說辨識
     ========================================================================== */
  var SR = global.SpeechRecognition || global.webkitSpeechRecognition || null;

  function sttSupported() { return !!SR; }
  function online() { return navigator.onLine !== false; }
  function sttUsable() { return sttSupported() && online(); }

  /**
   * 開始辨識。
   * @returns {object} { stop() } 控制器
   */
  function listen(handlers) {
    handlers = handlers || {};
    if (!SR) { if (handlers.onerror) handlers.onerror('unsupported'); return { stop: function () {} }; }

    var r = new SR();
    r.lang = 'en-US';
    r.interimResults = true;
    r.continuous = false;
    r.maxAlternatives = 3;

    var finalText = '';
    var alts = [];

    r.onresult = function (ev) {
      var interim = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var res = ev.results[i];
        if (res.isFinal) {
          finalText += res[0].transcript;
          for (var k = 0; k < res.length; k++) alts.push(res[k].transcript);
        } else {
          interim += res[0].transcript;
        }
      }
      if (handlers.oninterim) handlers.oninterim(finalText + interim);
    };
    r.onerror = function (ev) {
      if (handlers.onerror) handlers.onerror(ev.error || 'error');
    };
    r.onend = function () {
      if (handlers.onend) handlers.onend(finalText.trim(), alts);
    };

    try { r.start(); } catch (e) { if (handlers.onerror) handlers.onerror('start-failed'); }
    return { stop: function () { try { r.stop(); } catch (e) {} } };
  }

  /* ---------- 離線降級：錄音回放 ---------- */
  function recorderSupported() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && global.MediaRecorder);
  }

  function record() {
    if (!recorderSupported()) return Promise.reject(new Error('unsupported'));
    return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var chunks = [];
      var mr = new MediaRecorder(stream);
      mr.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      mr.start();
      return {
        stop: function () {
          return new Promise(function (resolve) {
            mr.onstop = function () {
              stream.getTracks().forEach(function (t) { t.stop(); });
              resolve(URL.createObjectURL(new Blob(chunks, { type: mr.mimeType || 'audio/webm' })));
            };
            try { mr.stop(); } catch (e) { resolve(null); }
          });
        }
      };
    });
  }

  /* ==========================================================================
     發音比對評分
     ========================================================================== */
  function normalize(s) {
    return String(s || '').toLowerCase()
      .replace(/[’']/g, "'")
      .replace(/[^a-z0-9'\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function words(s) { return normalize(s).split(' ').filter(Boolean); }

  /** Levenshtein，用來容忍辨識器聽錯一兩個字母 */
  function lev(a, b) {
    var m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    var prev = new Array(n + 1), cur = new Array(n + 1);
    for (var j = 0; j <= n; j++) prev[j] = j;
    for (var i = 1; i <= m; i++) {
      cur[0] = i;
      for (var k = 1; k <= n; k++) {
        cur[k] = Math.min(prev[k] + 1, cur[k - 1] + 1, prev[k - 1] + (a[i - 1] === b[k - 1] ? 0 : 1));
      }
      var t = prev; prev = cur; cur = t;
    }
    return prev[n];
  }

  function similar(a, b) {
    if (a === b) return 1;
    var d = lev(a, b);
    return 1 - d / Math.max(a.length, b.length, 1);
  }

  /**
   * 比對「該唸的」與「聽到的」，回傳分數與逐字標記。
   * @returns {{score:number, marks:Array<{w:string, ok:boolean}>, hit:number, total:number}}
   */
  function scoreSpeech(target, heard) {
    var T = words(target), H = words(heard);
    var used = new Array(H.length);
    var marks = [], hit = 0;

    for (var i = 0; i < T.length; i++) {
      var best = -1, bestScore = 0;
      for (var j = 0; j < H.length; j++) {
        if (used[j]) continue;
        // 只在附近的位置找，避免整句亂配
        if (Math.abs(j - i) > 3) continue;
        var s = similar(T[i], H[j]);
        if (s > bestScore) { bestScore = s; best = j; }
      }
      var ok = bestScore >= 0.72;
      if (ok) { used[best] = true; hit++; }
      marks.push({ w: T[i], ok: ok });
    }

    var score = T.length ? hit / T.length : 0;
    // 唸了一堆多餘的字要稍微扣分
    var extra = Math.max(0, H.length - T.length);
    score = Math.max(0, score - extra * 0.04);
    return { score: score, marks: marks, hit: hit, total: T.length };
  }

  global.Speech = {
    speak: speak, stop: stop, available: available, btn: btn,
    voiceList: voiceList, reloadVoices: loadVoices,
    sttSupported: sttSupported, sttUsable: sttUsable, online: online, listen: listen,
    recorderSupported: recorderSupported, record: record,
    scoreSpeech: scoreSpeech, normalize: normalize, words: words, similar: similar
  };
})(window);

</script>
<script>
/* ===== js/ui.js ===== */
/* ==========================================================================
   ui.js — 共用 UI 工具：toast、modal、頂部狀態列、DOM 小幫手
   ========================================================================== */
(function (global) {
  'use strict';

  /* ---------- DOM ---------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  /* ---------- Toast ---------- */
  function toast(msg, kind, ms) {
    var root = $('#toast-root');
    if (!root) return;
    var t = el('div', 'toast' + (kind ? ' ' + kind : ''), esc(msg));
    root.appendChild(t);
    setTimeout(function () {
      t.style.transition = 'opacity .3s, transform .3s';
      t.style.opacity = '0';
      t.style.transform = 'translateY(8px)';
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 320);
    }, ms || 2000);
  }

  /* ---------- Modal ---------- */
  var modalOnClose = null;

  function modal(html, onClose) {
    var root = $('#modal-root');
    $('#modal-body').innerHTML = html;
    root.hidden = false;
    modalOnClose = onClose || null;
    var firstBtn = $('#modal-body .btn');
    if (firstBtn) setTimeout(function () { firstBtn.focus(); }, 50);
  }

  function closeModal() {
    var root = $('#modal-root');
    if (root.hidden) return;
    root.hidden = true;
    $('#modal-body').innerHTML = '';
    var fn = modalOnClose; modalOnClose = null;
    if (fn) fn();
  }

  function confirm(title, msg, okText, onOk, danger) {
    modal(
      '<h2>' + esc(title) + '</h2>' +
      '<p class="muted">' + msg + '</p>' +
      '<div class="row mt16" style="gap:10px">' +
      '<button class="btn btn-ghost grow" data-modal-close>取消</button>' +
      '<button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + ' grow" id="modal-ok">' + esc(okText || '確定') + '</button>' +
      '</div>'
    );
    $('#modal-ok').onclick = function () { closeModal(); onOk(); };
  }

  /* ---------- 頂部狀態列 ---------- */
  function refreshChips() {
    var d = State.data;
    var s = $('#chip-streak'), g = $('#chip-gems'), x = $('#chip-xp');
    if (s) s.textContent = d.g.streak;
    if (g) g.textContent = d.g.gems;
    if (x) x.textContent = d.today.xp;

    var pct = State.goalPct();
    var ring = $('#goal-ring');
    if (ring) {
      var C = 2 * Math.PI * 15.5;
      ring.style.strokeDasharray = C.toFixed(2);
      ring.style.strokeDashoffset = (C * (1 - pct)).toFixed(2);
      ring.style.stroke = pct >= 1 ? 'var(--gold)' : 'var(--green)';
    }
    var lab = $('#chip-goal-pct');
    if (lab) lab.textContent = pct >= 1 ? '✓' : Math.round(pct * 100) + '%';
  }

  function setNavActive(hash) {
    $$('.navbtn').forEach(function (b) {
      var target = b.getAttribute('data-nav');
      b.classList.toggle('active', hash.indexOf(target) === 0);
    });
  }

  /* ---------- 進度條 ---------- */
  function pbar(pct, cls) {
    return '<div class="pbar"><div class="pbar-fill ' + (cls || '') + '" style="width:' +
      Math.round(Math.max(0, Math.min(1, pct)) * 100) + '%"></div></div>';
  }

  /* ---------- 星星 ---------- */
  function stars(n) {
    var out = '';
    for (var i = 1; i <= 3; i++) out += (i <= n ? '⭐' : '☆');
    return out;
  }

  /* ---------- 剪貼簿 ---------- */
  function copy(text, okMsg) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast(okMsg || '已複製', 'good'); }
      catch (e) { toast('複製失敗，請手動選取', 'bad'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast(okMsg || '已複製', 'good');
      }, fallback);
    } else fallback();
  }

  /* ---------- 主題 ---------- */
  function applyTheme() {
    var t = State.data.profile.theme;
    if (t === 'auto') {
      t = (global.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#131f24' : '#58cc02');
  }

  /* ---------- 事件代理：所有 data-nav / data-modal-close ---------- */
  document.addEventListener('click', function (e) {
    var navEl = e.target.closest ? e.target.closest('[data-nav]') : null;
    if (navEl) { location.hash = navEl.getAttribute('data-nav'); return; }
    if (e.target.closest && e.target.closest('[data-modal-close]')) { closeModal(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  function countUp(node, to, ms) {
    var from = 0, t0 = performance.now();
    ms = ms || 600;
    (function step(t) {
      var k = Math.min(1, (t - t0) / ms);
      node.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  global.UI = {
    $: $, $$: $$, esc: esc, el: el,
    toast: toast, modal: modal, closeModal: closeModal, confirm: confirm,
    refreshChips: refreshChips, setNavActive: setNavActive,
    pbar: pbar, stars: stars, copy: copy, applyTheme: applyTheme, countUp: countUp
  };
})(window);

</script>
<script>
/* ===== js/scheduler.js ===== */
/* ==========================================================================
   scheduler.js — 組裝題目佇列
   關卡的 plan 只描述「要出哪些題、各幾題」，真正挑哪些單字/句子在這裡決定。
   原則：新字優先教、舊字混進來複習、句子從例句庫抽。
   ========================================================================== */
(function (global) {
  'use strict';

  var S = Content.shuffle, SAMPLE = Content.sample, PICK = Content.pick;

  /* ---------- 挑單字 ---------- */

  /** 這一關還沒學過（沒進 SRS）的字 */
  function unseenOf(unitId) {
    return Content.vocabOf(unitId).filter(function (v) { return !SRS.has(v.id); });
  }

  /** 挑 n 個「這關要新教」的字：先給沒學過的，沒了就挑最生疏的回鍋 */
  function newWords(unitId, n) {
    var unseen = unseenOf(unitId);
    if (unseen.length >= n) return unseen.slice(0, n);

    var rest = Content.vocabOf(unitId)
      .filter(function (v) { return SRS.has(v.id); })
      .sort(function (a, b) { return SRS.levelOf(a.id) - SRS.levelOf(b.id); });
    return unseen.concat(rest.slice(0, n - unseen.length));
  }

  /** 練習用字：這關的字 + 一部分舊字（讓複習自然發生） */
  function practicePool(unitId, focus) {
    var here = Content.vocabOf(unitId);
    var older = Content.vocabUpTo(unitId).filter(function (v) { return v.u !== unitId && SRS.has(v.id); });
    var due = older.filter(function (v) { return State.data.srs[v.id].due <= State.dayStr(); });
    return (focus || []).concat(here, SAMPLE(due, 8), SAMPLE(older, 6));
  }

  function dedupe(list) {
    var seen = {}, out = [];
    list.forEach(function (v) { if (v && !seen[v.id]) { seen[v.id] = 1; out.push(v); } });
    return out;
  }

  /* ---------- 挑句子 ---------- */

  /** 從單字例句庫抽句子。回傳 {en, zh, from} */
  function sentencesFrom(vocabList, opts) {
    opts = opts || {};
    var out = [];
    vocabList.forEach(function (v) {
      (v.ex || []).forEach(function (pair, i) {
        var en = pair[0], zh = pair[1];
        var wc = en.split(/\s+/).length;
        if (opts.maxWords && wc > opts.maxWords) return;
        if (opts.minWords && wc < opts.minWords) return;
        out.push({ en: en, zh: zh, from: v.id, kind: i === 0 ? 'daily' : 'work' });
      });
    });
    return out;
  }

  /** 文法點自帶的練習句 */
  function grammarSentences(unitId) {
    var out = [];
    Content.grammarOf(unitId).forEach(function (g) {
      (g.sents || []).forEach(function (p) {
        out.push({ en: p[0], zh: p[1], from: g.id, kind: 'grammar' });
      });
    });
    return out;
  }

  /** 文法題（依 k 種類過濾） */
  function grammarQuestions(unitId, kinds, n) {
    var pool = [];
    Content.grammarOf(unitId).forEach(function (g) {
      (g.qs || []).forEach(function (q) {
        if (!kinds || kinds.indexOf(q.k) >= 0) {
          pool.push({ g: g, q: q });
        }
      });
    });
    // 這關的題不夠就往前面的關卡借
    if (pool.length < n) {
      Content.grammarUpTo(unitId).forEach(function (g) {
        if (g.u === unitId) return;
        (g.qs || []).forEach(function (q) {
          if (!kinds || kinds.indexOf(q.k) >= 0) pool.push({ g: g, q: q });
        });
      });
    }
    return SAMPLE(pool, n);
  }

  /* ==========================================================================
     組裝關卡佇列
     ========================================================================== */
  function buildLesson(unitId) {
    var u = Content.unit(unitId);
    var recipe = Content.planOf(unitId);   // 起步取向可能會換掉發音關卡的配方
    if (!u || !recipe) return [];

    var queue = [];
    var intro = [];
    var cards = [];
    var body = [];
    var tail = [];

    var focus = [];   // 這關新教的字，其他題型優先用它們
    var plan = {};
    recipe.forEach(function (p) { plan[p[0]] = p[1]; });

    // 有教新字的關卡就自動配拼字題（課表沒特別指定時）。
    // 「認得出來」和「拼得出來」是兩件事，後者才撐得住寫作與聽寫。
    if (plan.flashcard && plan.spell === undefined) {
      plan.spell = Math.max(2, Math.round(plan.flashcard / 3));
    }

    /* --- 1. 教學卡 --- */
    if (plan.intro) {
      if (u.phonics && Content.phonics(u.phonics)) {
        intro.push({ type: 'intro', kind: 'phonics', ref: Content.phonics(u.phonics), unitId: unitId });
      }
      if (u.irregular && Content.irregulars().length) {
        intro.push({ type: 'intro', kind: 'irregular', ref: Content.irregulars(), unitId: unitId });
      }
      Content.grammarOf(unitId).forEach(function (g) {
        if (g.teach) intro.push({ type: 'intro', kind: 'grammar', ref: g, unitId: unitId });
      });
    }

    /* --- 2. 單字卡（新字） --- */
    if (plan.flashcard) {
      focus = newWords(unitId, plan.flashcard);
      focus.forEach(function (v) {
        cards.push({ type: 'flashcard', ref: v, unitId: unitId });
      });
    }

    var pool = dedupe(practicePool(unitId, focus));
    var focusOrPool = focus.length ? focus : pool;

    /* --- 3. 單字回想（中英互選） --- */
    if (plan.recall) {
      var rc = SAMPLE(pool, plan.recall);
      // 不足就從新字補
      while (rc.length < plan.recall && focusOrPool.length) rc.push(PICK(focusOrPool));
      rc.forEach(function (v, i) {
        body.push({ type: 'recall', ref: v, dir: i % 2 ? 'zh2en' : 'en2zh', unitId: unitId });
      });
    }

    /* --- 3.5 字母銀行拼字：認得 → 拼得出來 --- */
    if (plan.spell) {
      // 優先拼「剛學過但還不熟」的字，長度 3–10 才適合拼
      var spellPool = pool.filter(function (v) {
        return v.w.length >= 3 && v.w.length <= 10 && !/\s/.test(v.w) && SRS.levelOf(v.id) < 3;
      });
      if (!spellPool.length) spellPool = focusOrPool;
      SAMPLE(spellPool, plan.spell).forEach(function (v) {
        body.push({ type: 'spell', ref: v, unitId: unitId });
      });
    }

    /* --- 3.6 不規則動詞三態 --- */
    if (plan.irregular) {
      // 先問沒被問倒過的，答錯過的交給弱點怪獸帶回來
      SAMPLE(Content.irregulars(), plan.irregular).forEach(function (iv, i) {
        // 三態同形的字問過去分詞沒有鑑別度，一律問過去式
        var ask = (iv.t !== 'A' && i % 3 === 2) ? 'pp' : 'p';
        body.push({ type: 'irregular', ref: iv, ask: ask, unitId: unitId });
      });
    }

    /* --- 4. 聽力：聽單字或句子選意思 --- */
    if (plan.listen) {
      var half = Math.ceil(plan.listen / 2);
      SAMPLE(pool, half).forEach(function (v) {
        body.push({ type: 'listen', mode: 'word', ref: v, unitId: unitId });
      });
      var sPool = grammarSentences(unitId).concat(sentencesFrom(focusOrPool, { maxWords: 12 }));
      SAMPLE(sPool, plan.listen - half).forEach(function (s) {
        body.push({ type: 'listen', mode: 'sentence', ref: s, unitId: unitId });
      });
    }

    /* --- 5. 聽寫填空 --- */
    if (plan.dictate) {

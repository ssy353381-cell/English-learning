<script>
/* ===== js/views/map.js ===== */
/* ==========================================================================
   views/map.js — 關卡地圖（蜿蜒路徑，一格一格解鎖）
   ========================================================================== */
(function (global) {
  'use strict';

  var esc = UI.esc;
  global.Views = global.Views || {};

  Views.map = function () {
    var cur = Content.currentUnitId();
    var html = '<h1>學習地圖</h1>' +
      '<p class="muted">從 26 個字母到多益 990。一次只要打好眼前這一關。</p>' +
      overallBar();

    Content.stages().forEach(function (st) {
      html += stageBlock(st, cur);
    });

    html += '<div class="card mt24 center">' +
      '<div class="big">🏁</div><div class="bold">Stage 2–6 的內容陸續補上中</div>' +
      '<p class="small muted mb0">地圖與遊戲機制已經完成，先把 Stage 0–1 打穿，' +
      '後面的關卡會直接接上去，進度不會流失。</p></div>';

    UI.$('#view').innerHTML = html;

    // 捲到目前的關卡
    setTimeout(function () {
      var node = UI.$('[data-unit="' + cur + '"]');
      if (node) node.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 120);
  };

  function overallBar() {
    var ids = Content.orderedUnitIds().filter(Content.isReady);
    var done = ids.filter(State.isUnitDone).length;
    var s = SRS.stats();
    var c = Content.counts();
    return '<div class="card">' +
      '<div class="row-between mb8"><span class="bold">總進度</span>' +
      '<span class="small muted">' + done + ' / ' + ids.length + ' 關　・　' +
      s.seen + ' / ' + c.vocab + ' 字</span></div>' +
      UI.pbar(ids.length ? done / ids.length : 0) + '</div>';
  }

  function stageBlock(st, cur) {
    var ids = st.units.map(function (u) { return u.id; });
    var done = ids.filter(State.isUnitDone).length;
    var open = st.ready;

    var html = '<div class="stage-header ' + (open ? '' : 'locked') + '" ' +
      'style="' + (open ? 'background:var(--' + st.color + ')' : '') + '">' +
      '<div><div class="stage-sub">STAGE ' + st.n + '　' + esc(st.level) + '</div>' +
        '<h2>' + st.icon + ' ' + esc(st.name) + '</h2>' +
        '<div class="stage-sub">' + esc(st.sub) + '</div></div>' +
      '<div class="right"><div class="bold">' + done + '/' + ids.length + '</div>' +
        (open ? '' : '<div class="stage-sub">製作中</div>') + '</div>' +
      '</div>';

    if (st.desc) html += '<p class="small muted">' + esc(st.desc) + '</p>';

    html += '<div class="path">';
    st.units.forEach(function (u, i) {
      html += '<div class="path-row" data-off="' + (i % 8) + '">' + nodeHTML(u, cur) + '</div>';
    });
    html += '</div>';
    return html;
  }

  function nodeHTML(u, cur) {
    var ready = Content.isReady(u.id);
    var unlocked = ready && Content.isUnlocked(u.id);
    var rec = State.data.units[u.id];
    var doneN = rec && rec.s > 0;
    var isCur = u.id === cur;

    var cls = 'node';
    if (u.boss) cls += ' boss';
    if (doneN) cls += ' done';
    else if (isCur && unlocked) cls += ' current';
    if (!unlocked) cls += ' locked';
    // 階段可以分批開放，所以同一個階段裡「還沒解鎖」和「根本還沒做」會並存。
    // 兩者都畫成鎖頭的話，使用者會一路練上去撞牆卻不知道是撞到什麼。
    if (!ready) cls += ' wip';

    var crown = rec && rec.lv ? '<span class="node-crown">' +
      (rec.lv >= 5 ? '👑' : '⭐'.repeat(Math.min(3, rec.s || 1))) + '</span>' : '';

    var unseen = ready ? Scheduler.unseenOf(u.id).length : 0;
    var vocabTotal = ready ? Content.vocabOf(u.id).length : 0;
    var learned = vocabTotal - unseen;

    return '<button class="' + cls + '" data-unit="' + u.id + '" ' +
      (unlocked ? '' : 'disabled ') +
      'title="' + esc(u.title) + (ready ? '' : '（製作中）') + '">' +
      (unlocked ? (u.icon || '📘') : (ready ? '🔒' : '🚧')) + crown +
      '<span class="node-label">' + u.n + '. ' + esc(shortTitle(u.title)) +
      (vocabTotal && unlocked ? '　<span class="tiny faint">' + learned + '/' + vocabTotal + '字</span>' : '') +
      '</span>' +
      (isCur && unlocked ? '<span class="node-here">從這裡開始</span>' : '') +
      '</button>';
  }

  function shortTitle(t) {
    return t.length > 12 ? t.slice(0, 11) + '…' : t;
  }

  /* ---------- 點關卡 → 顯示說明卡 ---------- */
  document.addEventListener('click', function (e) {
    var n = e.target.closest ? e.target.closest('[data-unit]') : null;
    if (!n || n.disabled) return;
    var id = n.getAttribute('data-unit');
    var u = Content.unit(id);
    if (!u) return;

    var rec = State.data.units[id] || { s: 0, lv: 0, best: 0 };
    var unseen = Scheduler.unseenOf(id).length;
    var total = Content.vocabOf(id).length;
    var st = Content.stageOf(id);

    UI.modal(
      '<div class="center">' +
        '<div style="font-size:3rem">' + (u.icon || '📘') + '</div>' +
        '<div class="tag ' + (u.boss ? 'gold' : 'blue') + '">' +
          (u.boss ? '👑 魔王關' : st.name) + '</div>' +
        '<h2 class="mt8">第 ' + u.n + ' 關　' + esc(u.title) + '</h2>' +
        (u.goal ? '<p class="muted">' + esc(u.goal) + '</p>' : '') +
        (rec.s ? '<div style="font-size:1.5rem;letter-spacing:3px">' + UI.stars(rec.s) + '</div>' +
          '<p class="small muted">最佳成績 ' + Math.round(rec.best * 100) + '%　・　皇冠 Lv.' + (rec.lv || 0) + '</p>' : '') +
        (total ? '<div class="mt8">' + UI.pbar((total - unseen) / total) +
          '<div class="small muted mt8">單字 ' + (total - unseen) + ' / ' + total +
          (unseen ? '　（這次會教 ' + Math.min(unseen, planCount(u)) + ' 個新字）' : '　新字已學完') +
          '</div></div>' : '') +
        '<button class="btn btn-primary btn-lg mt16" id="go">' +
          (rec.s ? '再打一次' : '開始這一關') + '</button>' +
      '</div>'
    );
    UI.$('#go').onclick = function () { UI.closeModal(); location.hash = '#/lesson/' + id; };
  });

  function planCount(u) {
    var n = 0;
    (Content.planOf(u.id) || []).forEach(function (p) { if (p[0] === 'flashcard') n = p[1]; });
    return n;
  }
})(window);

</script>
<script>
/* ===== js/views/lesson.js ===== */
/* ==========================================================================
   views/lesson.js — 關卡執行器
   負責：跑題目佇列、批改列、答錯重排、結算畫面
   ========================================================================== */
(function (global) {
  'use strict';

  var esc = UI.esc;
  global.Views = global.Views || {};

  var session = null;

  function bestStars(unitId) {
    var r = State.data.units[unitId];
    return (r && r.s) || 0;
  }

  /* ==========================================================================
     進入關卡
     mode: 'unit' | 'review' | 'challenge'
     ========================================================================== */
  function start(mode, unitId, opts) {
    opts = opts || {};
    var queue, title, sub;

    if (mode === 'challenge') {
      queue = Scheduler.buildChallenge();
      if (!queue || !queue.length) {
        UI.toast('先學一些單字再來挑戰吧', 'bad');
        location.hash = '#/home';
        return;
      }
      title = '每日挑戰';
      sub = '隨機小考';
    } else if (mode === 'review') {
      queue = Scheduler.buildReview(opts.limit || 20);
      if (!queue.length) {
        renderNothingToReview();
        return;
      }
      title = '複習';
      sub = '間隔重複';
    } else {
      var u = Content.unit(unitId);
      if (!u || !Content.isReady(unitId)) {
        UI.toast('這一關的內容還在製作中', 'bad');
        location.hash = '#/map';
        return;
      }
      if (!Content.isUnlocked(unitId)) {
        UI.toast('先過前一關才會解鎖喔', 'bad');
        location.hash = '#/map';
        return;
      }
      queue = Scheduler.buildLesson(unitId);
      title = '第 ' + u.n + ' 關　' + u.title;
      sub = u.goal || '';
    }

    session = {
      mode: mode, unitId: unitId, queue: queue, idx: 0,
      correct: 0, total: 0, missed: [], startedAt: Date.now(),
      title: title, sub: sub, cleanup: []
    };

    document.body.classList.add('in-lesson');
    renderShell();
    runCurrent();
  }

  /* ---------- 外殼 ---------- */
  function renderShell() {
    var view = UI.$('#view');
    view.innerHTML =
      '<div class="lesson-top">' +
        '<button class="lesson-quit" id="quit" aria-label="離開">✕</button>' +
        UI.pbar(0) +
        '<span class="small bold muted" id="qcount"></span>' +
      '</div>' +
      '<div class="q-body" id="q-host"></div>' +
      '<div class="checkbar" id="checkbar"></div>';

    UI.$('#quit').onclick = quitConfirm;
  }

  function quitConfirm() {
    if (session && session.total === 0) { exit(); return; }
    UI.confirm('要離開嗎？', '這一關的進度不會保留，但已經記住的單字會留在複習排程裡。',
      '離開', exit, true);
  }

  function exit() {
    cleanup();
    document.body.classList.remove('in-lesson');
    var back = session && session.mode === 'unit' ? '#/map' : '#/home';
    session = null;
    location.hash = back;
  }

  function cleanup() {
    if (!session) return;
    session.cleanup.forEach(function (fn) { try { fn(); } catch (e) {} });
    session.cleanup = [];
    Speech.stop();
  }

  /* ---------- 進度 ---------- */
  function updateProgress() {
    var fill = UI.$('#view .pbar-fill');
    if (fill) fill.style.width = Math.round(session.idx / Math.max(1, session.queue.length) * 100) + '%';
    var c = UI.$('#qcount');
    if (c) c.textContent = Math.min(session.idx + 1, session.queue.length) + '/' + session.queue.length;
  }

  /* ==========================================================================
     跑一題
     ========================================================================== */
  function runCurrent() {
    cleanup();
    if (!session) return;

    if (session.idx >= session.queue.length) { finish(); return; }

    var q = session.queue[session.idx];
    var mod = Ex[q.type];
    if (!mod) {
      console.warn('未知題型：' + q.type);
      session.idx++;
      runCurrent();
      return;
    }

    updateProgress();
    var host = UI.$('#q-host');
    host.innerHTML = '';
    host.classList.remove('anim-shake');

    var bar = UI.$('#checkbar');
    bar.className = 'checkbar';
    bar.innerHTML = '';

    var checkFn = null;
    var answered = false;

    var api = {
      q: q,

      ready: function (fn) {
        checkFn = fn;
        bar.innerHTML = '<button class="btn btn-primary btn-lg" id="checkbtn" disabled>檢查</button>';
        UI.$('#checkbtn').onclick = api.submit;
      },

      enableCheck: function (on) {
        var b = UI.$('#checkbtn');
        if (b) b.disabled = !on;
      },

      submit: function () {
        if (answered || !checkFn) return;
        var b = UI.$('#checkbtn');
        if (b && b.disabled) return;
        checkFn();
      },

      setContinue: function (text) {
        bar.innerHTML = '<button class="btn btn-primary btn-lg" id="contbtn">' + esc(text || '繼續') + '</button>';
        UI.$('#contbtn').onclick = function () { api.next(); };
      },

      result: function (ok, o) {
        if (answered) return;
        answered = true;
        o = o || {};

        var c = o.correct != null ? o.correct : (ok ? 1 : 0);
        var t = o.total != null ? o.total : 1;

        if (!q.retry && !o.neutral) {
          session.correct += c;
          session.total += t;
        }

        if (!ok) {
          if (!o.neutral) {
            session.missed.push(q);
            // 答錯的題排到最後再問一次（同一題最多重來一次）
            if (!q.retry) {
              var copy = {};
              for (var k in q) copy[k] = q[k];
              copy.retry = true;
              session.queue.push(copy);
            }
          }
          host.classList.add('anim-shake');
          Sfx.play('wrong');
        } else {
          Sfx.play('correct');
        }

        bar.className = 'checkbar ' + (o.neutral ? '' : (ok ? 'ok' : 'no'));
        bar.innerHTML =
          '<div class="check-msg ' + (ok ? 'text-green' : 'text-red') + '">' +
            '<span class="ico">' + (o.neutral ? '➡️' : (ok ? '✅' : '❌')) + '</span>' +
            '<span>' + (o.title || (ok ? '正確' : '再看一次')) + '</span>' +
          '</div>' +
          (o.detail ? '<div class="mb8">' + o.detail + '</div>' : '') +
          '<button class="btn ' + (ok ? 'btn-primary' : 'btn-danger') + ' btn-lg" id="contbtn">繼續</button>';
        UI.$('#contbtn').onclick = function () { api.next(); };
        UI.$('#contbtn').focus();
      },

      next: function () {
        session.idx++;
        runCurrent();
      },

      onCleanup: function (fn) { session.cleanup.push(fn); }
    };

    // Enter 鍵送出 / 繼續
    function onEnter(e) {
      if (e.key !== 'Enter') return;
      if (e.target && e.target.tagName === 'TEXTAREA' && !e.ctrlKey) return;
      var cont = UI.$('#contbtn');
      if (cont) { e.preventDefault(); cont.click(); return; }
      var chk = UI.$('#checkbtn');
      if (chk && !chk.disabled) { e.preventDefault(); api.submit(); }
    }
    document.addEventListener('keydown', onEnter);
    api.onCleanup(function () { document.removeEventListener('keydown', onEnter); });

    try {
      mod.render(q, host, api);
    } catch (err) {
      console.error('題目渲染失敗', q, err);
      host.innerHTML = '<div class="warn-box">這一題出了點問題，先跳過。</div>';
      api.setContinue('繼續');
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
    State.markActive();
  }

  /* ==========================================================================
     結算
     ========================================================================== */
  function finish() {
    cleanup();
    Sfx.play('finish');
    var s = session;
    var rate = s.total ? s.correct / s.total : 1;
    var mins = Math.max(1, Math.round((Date.now() - s.startedAt) / 60000));

    var res;
    if (s.mode === 'unit') {
      res = Gamify.finishLesson(s.unitId, s.correct, s.total);
    } else {
      // 複習與挑戰：直接給 XP，不動關卡星等
      var xp = s.correct * 3 + (s.mode === 'challenge' ? 15 : 8);
      State.data.today.correct += s.correct;
      State.data.today.total += s.total;
      State.data.total.correct += s.correct;
      State.data.total.answered += s.total;
      if (s.mode === 'challenge') {
        State.data.today.challenge = true;
        Gamify.addGems(3, '完成每日挑戰');
      }
      State.save(true);
      Gamify.addXP(xp);
      res = { passed: rate >= 0.6, stars: 0, rate: rate, xp: xp, gems: 0 };
      if (Gamify.goalMet()) res.streakFired = Gamify.touchStreak();
      Gamify.check();
    }

    document.body.classList.remove('in-lesson');

    var u = s.mode === 'unit' ? Content.unit(s.unitId) : null;
    var view = UI.$('#view');

    view.innerHTML =
      '<div class="center mt24 anim-pop">' +
        '<div style="font-size:4.4rem">' + (res.passed ? (res.stars === 3 ? '🏆' : '🎉') : '💪') + '</div>' +
        '<h1>' + (res.passed ? '過關！' : '再挑戰一次') + '</h1>' +
        (s.mode === 'unit'
          ? '<div style="font-size:1.8rem;letter-spacing:4px">' + UI.stars(res.stars) + '</div>' +
            (bestStars(s.unitId) > res.stars
              ? '<div class="small muted">本次成績（這一關的最佳紀錄是 ' + UI.stars(bestStars(s.unitId)) + '）</div>'
              : '') +
            (res.crownUp ? '<div class="tag gold mt8">👑 皇冠 Lv.' + res.crown + '</div>' : '')
          : '<p class="muted">' + esc(s.title) + '</p>') +
      '</div>' +

      '<div class="kpi-grid mt24">' +
        '<div class="kpi"><div class="kpi-num text-green" id="k-acc">0</div><div class="kpi-lab">正確率 %</div></div>' +
        '<div class="kpi"><div class="kpi-num text-gold" id="k-xp">0</div><div class="kpi-lab">獲得 XP</div></div>' +
        '<div class="kpi"><div class="kpi-num text-blue">' + s.correct + '/' + s.total + '</div><div class="kpi-lab">答對題數</div></div>' +
        '<div class="kpi"><div class="kpi-num">' + mins + '</div><div class="kpi-lab">花費分鐘</div></div>' +
      '</div>' +

      (res.gems ? '<div class="card card-hl center mt16">💎 +' + res.gems + '　' +
        (res.firstClear ? '首次通關獎勵' : '') + '</div>' : '') +

      missedHTML(s) +

      '<div class="stack mt24">' +
        (s.mode === 'unit'
          ? (res.passed
              ? '<button class="btn btn-primary btn-lg" data-nav="#/map">回到地圖</button>' +
                '<button class="btn btn-ghost btn-lg" id="again">再打一次（學更多新字）</button>'
              : '<button class="btn btn-primary btn-lg" id="again">再挑戰一次</button>' +
                '<button class="btn btn-ghost btn-lg" data-nav="#/map">回到地圖</button>')
          : '<button class="btn btn-primary btn-lg" data-nav="#/home">回到今日</button>') +
      '</div>';

    UI.countUp(UI.$('#k-acc'), Math.round(rate * 100), 700);
    UI.countUp(UI.$('#k-xp'), res.xp, 700);

    var again = UI.$('#again');
    if (again) again.onclick = function () { start('unit', s.unitId); };

    session = null;
    UI.refreshChips();
  }

  function missedHTML(s) {
    if (!s.missed.length) {
      return '<div class="card card-hl center mt16"><span class="big">🎯</span>' +
        '<div class="bold">全部答對，一題都沒錯</div></div>';
    }
    var rows = s.missed.slice(0, 8).map(function (q) {
      var label = '', sub = '';
      if (q.ref && q.ref.w) { label = q.ref.w; sub = q.ref.pos + ' ' + q.ref.zh; }
      else if (q.ref && q.ref.v) { label = q.ref.v; sub = q.ref.v + ' → ' + q.ref.p + ' → ' + q.ref.pp; }
      else if (q.ref && q.ref.en) { label = q.ref.en; sub = q.ref.zh || ''; }
      else if (q.ref && q.ref.q) { label = String(q.ref.q).slice(0, 46); sub = q.ref.why ? String(q.ref.why).replace(/<[^>]+>/g, '').slice(0, 40) : ''; }
      else if (q.ref && q.ref.title) { label = q.ref.title; sub = '閱讀理解'; }
      return '<div class="list-row">' + Speech.btn(label) +
        '<div class="grow"><div class="sentence-en">' + esc(label) + '</div>' +
        '<div class="sentence-zh">' + esc(sub) + '</div></div></div>';
    }).join('');

    return '<div class="card mt16">' +
      '<div class="card-title">👾 這些變成了弱點怪獸</div>' +
      '<p class="small muted">它們會排進複習，答對就消滅。</p>' + rows + '</div>';
  }

  function renderNothingToReview() {
    document.body.classList.remove('in-lesson');
    UI.$('#view').innerHTML =
      '<div class="empty"><div class="empty-ico">✨</div>' +
      '<h2>今天沒有要複習的東西</h2>' +
      '<p>間隔重複的重點就是「不用複習的時候就別複習」。去打新關卡吧。</p>' +
      '<button class="btn btn-primary btn-lg mt16" data-nav="#/map">前往地圖</button></div>';
  }

  /* ---------- 路由入口 ---------- */
  Views.lesson = function (params) {
    var id = params.id;
    if (id === 'challenge') return start('challenge');
    if (id === 'review') return start('review', null, params);
    return start('unit', id);
  };

  Views.lessonExit = function () {
    if (session) { cleanup(); session = null; }
    document.body.classList.remove('in-lesson');
  };
})(window);

</script>
<script>
/* ===== js/views/review.js ===== */
/* ==========================================================================
   views/review.js — 複習中心：到期單字、弱點怪獸、單字庫瀏覽
   ========================================================================== */
(function (global) {
  'use strict';

  var esc = UI.esc;
  global.Views = global.Views || {};

  var tab = 'due';

  Views.review = function (params) {
    if (params && params.weak) tab = 'weak';
    render();
  };

  function render() {
    var due = SRS.dueIds();
    var weak = SRS.weakList();
    var st = SRS.stats();

    var html =
      '<h1>複習</h1>' +
      '<p class="muted">背單字唯一有效的方法，是在快忘掉的那一刻剛好複習到。</p>' +

      '<div class="kpi-grid mb16">' +
        '<div class="kpi"><div class="kpi-num text-red">' + due.length + '</div><div class="kpi-lab">今天到期</div></div>' +
        '<div class="kpi"><div class="kpi-num" style="color:var(--purple)">' + weak.length + '</div><div class="kpi-lab">弱點怪獸</div></div>' +
        '<div class="kpi"><div class="kpi-num text-green">' + st.mastered + '</div><div class="kpi-lab">已精熟</div></div>' +
        '<div class="kpi"><div class="kpi-num text-blue">' + st.seen + '</div><div class="kpi-lab">學過總數</div></div>' +
      '</div>' +

      (due.length
        ? '<button class="btn btn-primary btn-lg mb16" data-nav="#/lesson/review">開始複習 ' +
          Math.min(due.length, 20) + ' 個字</button>'
        : '<div class="card card-hl center"><span class="big">✨</span>' +
          '<div class="bold">今天沒有到期的單字</div>' +
          '<p class="small muted mb0">這是好事，代表排程正常運作。去打新關卡吧。</p></div>') +

      '<div class="seg mt16 mb16">' +
        '<button data-tab="due"  class="' + (tab === 'due' ? 'on' : '') + '">📅 排程</button>' +
        '<button data-tab="weak" class="' + (tab === 'weak' ? 'on' : '') + '">👾 怪獸</button>' +
        '<button data-tab="all"  class="' + (tab === 'all' ? 'on' : '') + '">📔 單字庫</button>' +
      '</div>' +
      '<div id="tabbody"></div>';

    UI.$('#view').innerHTML = html;
    UI.$$('[data-tab]').forEach(function (b) {
      b.onclick = function () { tab = b.getAttribute('data-tab'); render(); };
    });
    renderTab();
  }

  function renderTab() {
    var body = UI.$('#tabbody');
    if (tab === 'due') body.innerHTML = forecastHTML();
    else if (tab === 'weak') body.innerHTML = weakHTML();
    else body.innerHTML = allHTML();
  }

  /* ---------- 排程預測 ---------- */
  function forecastHTML() {
    var f = SRS.forecast(7);
    var max = Math.max.apply(null, f.map(function (x) { return x.count; }).concat([1]));
    var days = ['日', '一', '二', '三', '四', '五', '六'];

    var bars = f.map(function (x, i) {
      var p = x.count / max;
      var dt = x.day.split('-');
      var wd = new Date(+dt[0], +dt[1] - 1, +dt[2]).getDay();
      return '<div class="bar-col">' +
        '<div class="bar-lab">' + x.count + '</div>' +
        '<div class="bar ' + (i === 0 ? 'today' : '') + '" style="height:' + Math.round(p * 100) + '%"></div>' +
        '<div class="bar-lab">' + (i === 0 ? '今天' : days[wd]) + '</div></div>';
    }).join('');

    var st = SRS.stats();
    return '<div class="card">' +
      '<div class="card-title">📅 未來 7 天的複習量</div>' +
      '<div class="bars">' + bars + '</div>' +
      '<p class="small muted mt16 mb0">複習量會自己平衡：答對的字間隔會越拉越長，' +
      '答錯的會被拉回來。每天照做就好，不用自己排。</p>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title">🧠 記憶狀態分布</div>' +
        levelBar('學習中', st.learning, 'var(--red)') +
        levelBar('熟悉（間隔 ≥ 7 天）', st.familiar, 'var(--blue)') +
        levelBar('精熟（間隔 ≥ 21 天）', st.mastered, 'var(--green)') +
      '</div>';
  }

  function levelBar(label, n, color) {
    var total = Math.max(1, SRS.stats().seen);
    return '<div class="mb8"><div class="row-between small"><span>' + label + '</span>' +
      '<span class="bold">' + n + '</span></div>' +
      '<div class="pbar pbar-sm"><div class="pbar-fill" style="width:' +
      Math.round(n / total * 100) + '%;background:' + color + '"></div></div></div>';
  }

  /* ---------- 弱點怪獸 ---------- */
  function weakHTML() {
    var list = SRS.weakList();
    if (!list.length) {
      return '<div class="empty"><div class="empty-ico">🛡️</div>' +
        '<div class="bold">目前沒有怪獸</div>' +
        '<p class="muted">答錯的題目會變成怪獸住在這裡，答對就消滅。</p></div>';
    }
    var rows = list.sort(function (a, b) { return b.n - a.n; }).map(function (w) {
      var it = Content.item(w.r);
      var word = it && (it.w || it.v);
      var label = it ? (word || it.title || it.id) : w.r;
      var sub = it
        ? (it.v ? it.v + ' → ' + it.p + ' → ' + it.pp
                : (it.zh || (it.title ? '閱讀理解' : '文法題')))
        : '';
      var typeTag = { vocab: '單字', grammar: '文法', reading: '閱讀', irregular: '動詞三態' }[w.t] || w.t;
      return '<div class="list-row">' +
        (word ? Speech.btn(word) : '<span style="font-size:1.4rem">👾</span>') +
        '<div class="grow"><div class="sentence-en">' + esc(label) + '</div>' +
        '<div class="sentence-zh">' + esc(sub) + '</div></div>' +
        '<div class="right"><span class="tag red">錯 ' + w.n + ' 次</span>' +
        '<div class="tiny muted mt8">' + typeTag + '</div></div></div>';
    }).join('');

    return '<div class="card">' +
      '<div class="card-title">👾 弱點怪獸 ' + list.length + ' 隻</div>' +
      '<p class="small muted">下次複習或打關卡時會優先出現，答對就消滅。</p>' +
      rows + '</div>' +
      '<button class="btn btn-purple btn-lg" data-nav="#/lesson/review">去打怪</button>';
  }

  /* ---------- 單字庫 ---------- */
  var filterUnit = 'all';

  function allHTML() {
    var units = Content.orderedUnitIds().filter(Content.isReady);
    var opts = '<option value="all">全部關卡</option>' + units.map(function (id) {
      var u = Content.unit(id);
      return '<option value="' + id + '"' + (filterUnit === id ? ' selected' : '') + '>' +
        u.n + '. ' + esc(u.title) + '</option>';
    }).join('');

    var list = filterUnit === 'all' ? Content.allVocab() : Content.vocabOf(filterUnit);

    var rows = list.map(function (v) {
      var lvl = SRS.levelOf(v.id);
      var mark = ['⚪', '🔴', '🔵', '🟢'][lvl];
      var r = State.data.srs[v.id];
      return '<div class="list-row">' + Speech.btn(v.w) +
        '<div class="grow"><div class="sentence-en">' + (v.ic ? v.ic + ' ' : '') + esc(v.w) +
        (State.data.profile.showKK && v.kk ? ' <span class="word-kk">[' + esc(v.kk) + ']</span>' : '') + '</div>' +
        '<div class="sentence-zh"><span class="word-pos">' + esc(v.pos) + '</span>' + esc(v.zh) + '</div></div>' +
        '<div class="right"><div>' + mark + '</div>' +
        '<div class="tiny muted">' + (r ? '下次 ' + r.due.slice(5) : '未學') + '</div></div></div>';
    }).join('');

    return '<div class="card">' +
      '<div class="row-between mb8"><div class="card-title mb0">📔 單字庫（' + list.length + '）</div>' +
      '<select id="ufilter" class="btn btn-sm btn-ghost">' + opts + '</select></div>' +
      '<p class="small muted">⚪未學　🔴學習中　🔵熟悉　🟢精熟</p>' +
      rows + '</div>';
  }

  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'ufilter') {
      filterUnit = e.target.value;
      renderTab();
    }
  });
})(window);

</script>
<script>
/* ===== js/views/stats.js ===== */
/* ==========================================================================
   views/stats.js — 統計與成就：跟過去的自己比
   ========================================================================== */
(function (global) {
  'use strict';

  var esc = UI.esc;
  global.Views = global.Views || {};

  Views.stats = function () {
    var d = State.data;
    var lv = Gamify.levelInfo();
    var st = SRS.stats();

    UI.$('#view').innerHTML =
      '<h1>學習統計</h1>' +

      /* 等級 */
      '<div class="card">' +
        '<div class="row-between mb8">' +
          '<div><div class="card-title mb0">⚡ Lv.' + lv.level + '</div>' +
          '<div class="small muted">總經驗 ' + d.g.xp + ' XP</div></div>' +
          '<div class="right small muted">再 ' + (lv.need - lv.into) + ' XP 升級</div>' +
        '</div>' +
        UI.pbar(lv.pct, 'gold') +
      '</div>' +

      /* 核心數字 */
      '<div class="kpi-grid mb16">' +
        '<div class="kpi"><div class="kpi-num" style="color:var(--orange)">' + d.g.streak + '</div><div class="kpi-lab">連續天數</div></div>' +
        '<div class="kpi"><div class="kpi-num text-green">' + st.mastered + '</div><div class="kpi-lab">精熟單字</div></div>' +
        '<div class="kpi"><div class="kpi-num text-blue">' + Math.round(d.total.min) + '</div><div class="kpi-lab">累計分鐘</div></div>' +
        '<div class="kpi"><div class="kpi-num">' + accPct(d) + '%</div><div class="kpi-lab">總正確率</div></div>' +
      '</div>' +

      week14() +
      compareCard() +
      toeicEstimate() +
      achievementsCard();
  };

  function accPct(d) {
    return d.total.answered ? Math.round(d.total.correct / d.total.answered * 100) : 0;
  }

  /* ---------- 近 14 天 XP ---------- */
  function week14() {
    var d = State.data;
    var days = [], max = 1;
    for (var i = 13; i >= 0; i--) {
      var key = State.addDays(d.today.day, -i);
      var xp = key === d.today.day ? d.today.xp : ((d.hist[key] && d.hist[key].xp) || 0);
      max = Math.max(max, xp);
      days.push({ key: key, xp: xp, today: i === 0 });
    }
    var goal = State.goalXP();
    var bars = days.map(function (x) {
      return '<div class="bar-col" title="' + x.key + '：' + x.xp + ' XP">' +
        '<div class="bar ' + (x.today ? 'today' : '') + '" style="height:' +
          Math.round(x.xp / max * 100) + '%"></div>' +
        '<div class="bar-lab">' + x.key.slice(8) + '</div></div>';
    }).join('');

    var hit = days.filter(function (x) { return x.xp >= goal; }).length;

    return '<div class="card">' +
      '<div class="row-between mb8"><div class="card-title mb0">📈 近 14 天</div>' +
      '<span class="small muted">達標 ' + hit + ' / 14 天</span></div>' +
      '<div class="bars">' + bars + '</div>' +
      '</div>';
  }

  /* ---------- 跟上週的自己比 ---------- */
  function compareCard() {
    var d = State.data;
    function sum(fromIdx, toIdx) {
      var o = { xp: 0, min: 0, c: 0, t: 0, days: 0 };
      for (var i = fromIdx; i <= toIdx; i++) {
        var key = State.addDays(d.today.day, -i);
        var h = key === d.today.day
          ? { xp: d.today.xp, min: d.today.min, c: d.today.correct, t: d.today.total }
          : d.hist[key];
        if (!h) continue;
        o.xp += h.xp || 0; o.min += h.min || 0; o.c += h.c || 0; o.t += h.t || 0;
        if ((h.xp || 0) > 0) o.days++;
      }
      return o;
    }
    var thisW = sum(0, 6), lastW = sum(7, 13);

    function delta(a, b, unit) {
      var diff = a - b;
      if (!b && !a) return '<span class="muted">—</span>';
      var sign = diff > 0 ? '▲' : (diff < 0 ? '▼' : '＝');
      var cls = diff > 0 ? 'text-green' : (diff < 0 ? 'text-red' : 'muted');
      return '<span class="' + cls + ' bold">' + sign + ' ' + Math.abs(Math.round(diff)) + (unit || '') + '</span>';
    }

    return '<div class="card">' +
      '<div class="card-title">🪞 跟上週的自己比</div>' +
      '<table class="tbl"><tbody>' +
      '<tr><td>學習天數</td><td class="right bold">' + thisW.days + ' 天</td><td class="right">' + delta(thisW.days, lastW.days, ' 天') + '</td></tr>' +
      '<tr><td>累計 XP</td><td class="right bold">' + thisW.xp + '</td><td class="right">' + delta(thisW.xp, lastW.xp) + '</td></tr>' +
      '<tr><td>學習時間</td><td class="right bold">' + Math.round(thisW.min) + ' 分</td><td class="right">' + delta(thisW.min, lastW.min, ' 分') + '</td></tr>' +
      '<tr><td>正確率</td><td class="right bold">' + (thisW.t ? Math.round(thisW.c / thisW.t * 100) : 0) + '%</td>' +
        '<td class="right">' + delta(thisW.t ? thisW.c / thisW.t * 100 : 0, lastW.t ? lastW.c / lastW.t * 100 : 0, '%') + '</td></tr>' +
      '</tbody></table>' +
      '<p class="small muted mt8 mb0">沒有排行榜，因為單機學習真正的對手只有上禮拜的你。</p>' +
      '</div>';
  }

  /* ---------- 粗略的多益落點 ---------- */
  function toeicEstimate() {
    var st = SRS.stats();
    var known = st.mastered + st.familiar * 0.6 + st.learning * 0.25;
    var acc = State.data.total.answered ? State.data.total.correct / State.data.total.answered : 0;

    // 非常粗略的估算：字彙量是主軸，正確率做微調。只當作方向感，不是預測分數。
    var base = 150 + known * 0.42;
    var est = Math.round(Math.min(990, base * (0.85 + acc * 0.3)) / 5) * 5;
    if (known < 30) est = null;

    var stages = [
      { s: 0, t: '開口第一步', to: 250 },
      { s: 1, t: '日常生存', to: 450 },
      { s: 2, t: '生活溝通', to: 600 },
      { s: 3, t: '職場基礎', to: 750 },
      { s: 4, t: '多益核心', to: 860 },
      { s: 5, t: '高分衝刺', to: 950 },
      { s: 6, t: '滿分狙擊', to: 990 }
    ];
    var rows = stages.map(function (x) {
      var reached = est != null && est >= x.to;
      return '<div class="list-row"><span style="font-size:1.1rem">' + (reached ? '✅' : '⬜') + '</span>' +
        '<div class="grow"><span class="bold">Stage ' + x.s + '　' + x.t + '</span></div>' +
        '<span class="tag ' + (reached ? 'green' : '') + '">~' + x.to + '</span></div>';
    }).join('');

    return '<div class="card">' +
      '<div class="card-title">🎯 目前的落點（粗估）</div>' +
      (est == null
        ? '<p class="muted">再多學一些單字，這裡就會出現估算值。</p>'
        : '<div class="center"><div class="huge text-blue">' + est + '</div>' +
          '<div class="small muted">依已精熟字彙量與整體正確率推算</div></div>') +
      '<div class="mt16">' + rows + '</div>' +
      '<div class="warn-box mt16">這只是「方向感」，不是模考成績。真正的分數要靠完整的計時模考，' +
      '那會在 Stage 5 出現。到 990 大約需要 2–4 年，重點是每天都打開它。</div>' +
      '</div>';
  }

  /* ---------- 成就 ---------- */
  function achievementsCard() {
    var list = Gamify.earned();
    var got = list.filter(function (x) { return x.got; }).length;
    var cells = list.map(function (x) {
      return '<div class="badge ' + (x.got ? 'got' : 'locked') + '" title="' + esc(x.def.desc) + '">' +
        '<div class="badge-ico">' + x.def.icon + '</div>' +
        '<div class="badge-name">' + esc(x.def.name) + '</div>' +
        (x.got ? '<div class="tiny faint">' + x.got.slice(5) + '</div>' : '') +
        '</div>';
    }).join('');

    return '<div class="card">' +
      '<div class="row-between mb8"><div class="card-title mb0">🏅 成就</div>' +
      '<span class="small muted">' + got + ' / ' + list.length + '</span></div>' +
      '<div class="badges">' + cells + '</div></div>';
  }
})(window);

</script>
<script>
/* ===== js/views/settings.js ===== */
/* ==========================================================================
   views/settings.js — 設定、備份、手機同步

(function (global) {
  'use strict';

  var esc = UI.esc;
  global.Views = global.Views || {};

  Views.settings = function () {
    var p = State.data.profile;
    var voices = Speech.voiceList();

    UI.$('#view').innerHTML =
      '<h1>設定</h1>' +

      /* ---- 學習 ---- */
      '<div class="card">' +
        '<div class="card-title">🎯 每日目標</div>' +
        '<div class="seg" id="goalseg">' +

            return '<button data-goal="' + m + '" class="' + (p.goalMin === m ? 'on' : '') + '">' +
              m + ' 分鐘</button>';
          }).join('') +
        '</div>' +
        '<p class="small muted mt8 mb0">目標換算成 ' + (p.goalMin * 3) + ' XP。達標當天連續天數才會 +1。</p>' +
      '</div>' +

      /* ---- 起步取向 ---- */
      '<div class="card">' +
        '<div class="card-title">🧭 起步取向</div>' +
        '<div class="seg" id="trackseg">' +
          [['phonics', '先練發音'], ['vocab', '先學單字']].map(function (t) {
            return '<button data-track="' + t[0] + '" class="' + (p.track === t[0] ? 'on' : '') + '">' +
              t[1] + '</button>';
          }).join('') +
        '</div>' +
        '<p class="small muted mt8 mb0">' +
          (p.track === 'vocab'
            ? '第 1–5 關會多教新字、提早出排句題，聽音與跟讀減半。'
            : '第 1–5 關以聽音、跟讀、聽寫為主，新字少一點，把發音底子打穩。') +
          '關卡順序與解鎖條件兩邊完全一樣，隨時可以換。</p>' +
      '</div>' +

      /* ---- 語音 ---- */
      '<div class="card">' +
        '<div class="card-title">🔊 語音</div>' +
        (voices.length
          ? '<div class="list-row"><div class="grow">英文語音</div>' +
            '<select id="voicesel" class="btn btn-sm btn-ghost">' +
              voices.map(function (v) {
                return '<option value="' + esc(v.name) + '"' + (p.voice === v.name ? ' selected' : '') + '>' +
                  esc(v.name.replace(/^Microsoft /, '').slice(0, 28)) + '</option>';
              }).join('') +
            '</select></div>'
          : '<div class="warn-box">找不到英文語音。Windows 請到「設定 → 時間與語言 → 語音 → 管理語音 → 新增語音」' +
            '安裝 English，然後重新整理這一頁。</div>') +

        '<div class="list-row"><div class="grow">朗讀速度<div class="small muted" id="ratelab">' +
          p.rate.toFixed(2) + '×</div></div>' +
          '<input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="' + p.rate + '" style="width:140px"></div>' +

        toggleRow('autoPlay', '出現英文時自動朗讀', p.autoPlay) +
        toggleRow('sound', '答題音效', p.sound) +

        '<button class="btn btn-blue btn-block btn-sm mt8" id="testvoice">🔈 試聽</button>' +
      '</div>' +

      /* ---- 顯示 ---- */
      '<div class="card">' +
        '<div class="card-title">🎨 顯示</div>' +
        '<div class="list-row"><div class="grow">主題</div>' +
          '<div class="seg" style="width:190px" id="themeseg">' +
            [['auto', '跟系統'], ['light', '淺色'], ['dark', '深色']].map(function (t) {
              return '<button data-theme="' + t[0] + '" class="' + (p.theme === t[0] ? 'on' : '') + '">' + t[1] + '</button>';
            }).join('') +
          '</div></div>' +
        toggleRow('showKK', '顯示 KK 音標', p.showKK) +
        '<div class="list-row"><div class="grow">暱稱</div>' +
          '<input id="nick" class="blank-input" style="min-width:120px;text-align:right" ' +
          'value="' + esc(p.nickname) + '" placeholder="（選填）" maxlength="12"></div>' +
      '</div>' +

      /* ---- 備份與同步 ---- */
      '<div class="card">' +
        '<div class="card-title">💾 備份與手機同步</div>' +
        '<p class="small muted">進度存在這個瀏覽器裡。換裝置、清快取前請先備份。</p>' +
        '<div class="stack">' +
          '<button class="btn btn-primary" id="exp">⬇️ 下載進度檔</button>' +
          '<button class="btn btn-blue" id="code">📋 複製進度碼（傳到手機用）</button>' +
          '<button class="btn btn-ghost" id="imp">⬆️ 匯入進度檔</button>' +
          '<button class="btn btn-ghost" id="paste">📥 貼上進度碼</button>' +
        '</div>' +
        '<input type="file" id="file" accept=".json,application/json" hidden>' +
        '<div class="hint-box mt16">手機同步做法：在電腦按「複製進度碼」→ 用 LINE 或 Email 傳給自己 →' +
        '在手機上開同一個 App → 按「貼上進度碼」。反過來也一樣。</div>' +
      '</div>' +

      /* ---- 資料 ---- */
      '<div class="card">' +
        '<div class="card-title">📊 目前資料</div>' +
        dataSummary() +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title">⚠️ 危險區</div>' +
        '<button class="btn btn-danger btn-block" id="reset">清除所有進度</button>' +
      '</div>' +

      '<p class="center tiny faint mt24">English Quest ・ 存檔格式 v' + State.VERSION + '</p>';

    bind();
  };

  function toggleRow(key, label, on) {
    return '<div class="list-row"><div class="grow">' + label + '</div>' +
      '<label class="switch"><input type="checkbox" data-toggle="' + key + '"' + (on ? ' checked' : '') + '>' +
      '<span class="switch-track"></span><span class="switch-knob"></span></label></div>';
  }

  function dataSummary() {
    var d = State.data;
    var st = SRS.stats();
    var units = 0;
    for (var k in d.units) if (d.units[k].s > 0) units++;
    var bytes = 0;
    try { bytes = new Blob([State.toJSON()]).size; } catch (e) {}
    return '<table class="tbl"><tbody>' +
      '<tr><td>開始學習日</td><td class="right bold">' + esc(d.created) + '</td></tr>' +
      '<tr><td>學過的單字</td><td class="right bold">' + st.seen + '</td></tr>' +
      '<tr><td>通關數</td><td class="right bold">' + units + '</td></tr>' +
      '<tr><td>紀錄天數</td><td class="right bold">' + Object.keys(d.hist).length + '</td></tr>' +
      '<tr><td>開啟次數</td><td class="right bold">' + (d.total.sessions || 0) + '</td></tr>' +
      '<tr><td>存檔大小</td><td class="right bold">' + (bytes ? (bytes / 1024).toFixed(1) + ' KB' : '—') + '</td></tr>' +
      '</tbody></table>';
  }

  function bind() {
    var p = State.data.profile;

    UI.$$('#goalseg [data-goal]').forEach(function (b) {
      b.onclick = function () {
        p.goalMin = +b.getAttribute('data-goal');
        State.save(true); UI.refreshChips(); Views.settings();
      };
    });

    UI.$$('#trackseg [data-track]').forEach(function (b) {
      b.onclick = function () {
        p.track = b.getAttribute('data-track');
        State.save(true); Views.settings();
      };
    });

    UI.$$('#themeseg [data-theme]').forEach(function (b) {
      b.onclick = function () {
        p.theme = b.getAttribute('data-theme');
        State.save(true); UI.applyTheme(); Views.settings();
      };
    });

    UI.$$('[data-toggle]').forEach(function (c) {
      c.onchange = function () {
        p[c.getAttribute('data-toggle')] = c.checked;
        State.save(true);
      };
    });

    var rate = UI.$('#rate');
    if (rate) rate.oninput = function () {
      p.rate = +rate.value;
      UI.$('#ratelab').textContent = p.rate.toFixed(2) + '×';
      State.save();
    };

    var vs = UI.$('#voicesel');
    if (vs) vs.onchange = function () {
      p.voice = vs.value; State.save(true); Speech.reloadVoices();
      Speech.speak('Hello, let\'s learn English together.');
    };

    var tv = UI.$('#testvoice');
    if (tv) tv.onclick = function () {
      Speech.speak('The meeting will start at nine thirty in the main conference room.');
    };

    var nick = UI.$('#nick');
    if (nick) nick.onchange = function () { p.nickname = nick.value.trim(); State.save(true); };

    UI.$('#exp').onclick = function () { State.download(); UI.toast('已下載進度檔', 'good'); };

    UI.$('#code').onclick = function () {
      var code = State.toCode();
      UI.copy(code, '進度碼已複製（' + (code.length / 1024).toFixed(1) + ' KB）');
    };

    UI.$('#imp').onclick = function () { UI.$('#file').click(); };
    UI.$('#file').onchange = function (e) {
      var f = e.target.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          State.importJSON(r.result);
          UI.toast('進度已還原', 'good');
          UI.applyTheme(); UI.refreshChips(); Views.settings();
        } catch (err) {
          UI.toast('匯入失敗：' + err.message, 'bad', 4000);
        }
      };
      r.readAsText(f);
    };

    UI.$('#paste').onclick = function () {
      UI.modal(
        '<h2>貼上進度碼</h2>' +
        '<p class="muted small">把另一台裝置複製的進度碼整段貼進來。這會覆蓋目前的進度。</p>' +
        '<textarea class="textarea" id="codein" style="min-height:120px" placeholder="EQ1:..."></textarea>' +
        '<div class="row mt16" style="gap:10px">' +
          '<button class="btn btn-ghost grow" data-modal-close>取消</button>' +
          '<button class="btn btn-primary grow" id="doimport">匯入</button></div>'
      );
      UI.$('#doimport').onclick = function () {
        try {
          State.fromCode(UI.$('#codein').value);
          UI.closeModal();
          UI.toast('進度已還原', 'good');
          UI.applyTheme(); UI.refreshChips(); Views.settings();
        } catch (err) {
          UI.toast('進度碼無效', 'bad', 3500);
        }
      };
    };

    UI.$('#reset').onclick = function () {
      UI.confirm('確定要清除所有進度？',
        '所有單字記憶排程、關卡星等、連續天數都會歸零，<b>而且無法復原</b>。<br><br>' +
        '建議先按「下載進度檔」備份。',
        '我確定，全部清除', function () {
          State.reset();
          UI.applyTheme(); UI.refreshChips();
          UI.toast('已清除，重新開始', 'good');
          location.hash = '#/home';
        }, true);
    };
  }
})(window);

</script>
<script>
/* ===== js/views/shop.js ===== */
/* ==========================================================================
   views/shop.js — 寶石商店
   寶石只買「保護」與「便利」，不能拿來跳過學習。
   ========================================================================== */
(function (global) {
  'use strict';

  global.Views = global.Views || {};

  var ITEMS = [
    { id: 'freeze', icon: '🛡️', name: '連續天數護盾', cost: 40,
      desc: '斷一天不會歸零。最多存 3 個，斷線時自動使用。' },
    { id: 'double', icon: '⚡', name: '雙倍 XP（今日）', cost: 60,
      desc: '接下來到今天結束，所有 XP 加倍。' },
    { id: 'refill', icon: '🎲', name: '重抽每日挑戰', cost: 25,
      desc: '把今天已完成的每日挑戰重置，可以再刷一次。' }
  ];

  Views.shop = function () {
    var g = State.data.g;

    UI.$('#view').innerHTML =
      '<h1>寶石商店</h1>' +
      '<div class="card card-hl center">' +
        '<div style="font-size:2.6rem">💎</div>' +
        '<div class="huge text-blue">' + g.gems + '</div>' +
        '<p class="small muted mb0">通關、首次過關、連續 7 天都會拿到寶石</p>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title">🛡️ 目前的護盾</div>' +
        '<div class="row" style="gap:10px;font-size:2rem">' +
          [0, 1, 2].map(function (i) {
            return '<span style="opacity:' + (i < g.freeze ? 1 : .25) + '">🛡️</span>';
          }).join('') +
          '<span class="grow small muted">' + g.freeze + ' / 3</span>' +
        '</div>' +
      '</div>' +

      ITEMS.map(itemCard).join('') +

      '<div class="hint-box">寶石不能用來跳過關卡或直接解鎖答案 — ' +
      '那樣只會騙到自己。它只買「別讓你放棄」的東西。</div>';

    bind();
  };

  function itemCard(it) {
    var afford = State.data.g.gems >= it.cost;
    return '<div class="card">' +
      '<div class="row">' +
        '<div style="font-size:2.2rem;line-height:1">' + it.icon + '</div>' +
        '<div class="grow"><div class="bold">' + UI.esc(it.name) + '</div>' +
        '<div class="small muted">' + UI.esc(it.desc) + '</div></div>' +
      '</div>' +
      '<button class="btn ' + (afford ? 'btn-blue' : 'btn-ghost') + ' btn-block btn-sm mt8" ' +
        'data-buy="' + it.id + '"' + (afford ? '' : ' disabled') + '>💎 ' + it.cost + '</button>' +
      '</div>';
  }

  function bind() {
    UI.$$('[data-buy]').forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-buy');
        var it = ITEMS.filter(function (x) { return x.id === id; })[0];
        if (!it) return;

        if (id === 'freeze') {
          if (Gamify.buyFreeze(it.cost)) Views.shop();
          return;
        }
        if (id === 'double') {
          if (State.data.g.doubleDay === State.dayStr()) { UI.toast('今天已經是雙倍了', 'bad'); return; }
          if (!Gamify.spendGems(it.cost)) { UI.toast('寶石不夠', 'bad'); return; }
          State.data.g.doubleDay = State.dayStr();
          State.save(true);
          UI.toast('⚡ 今天 XP 加倍！', 'gold');
          Views.shop();
          return;
        }
        if (id === 'refill') {
          if (!State.data.today.challenge) { UI.toast('今天的挑戰還沒做', 'bad'); return; }
          if (!Gamify.spendGems(it.cost)) { UI.toast('寶石不夠', 'bad'); return; }
          State.data.today.challenge = false;
          State.save(true);
          UI.toast('🎲 每日挑戰已重置', 'good');
          Views.shop();
        }
      };
    });
  }
})(window);

</script>

<script>
/* ===== js/app.js ===== */
/* ==========================================================================
   app.js — 啟動與路由
   路由格式： #/home  #/map  #/lesson/s0u1  #/review?weak=1  #/stats  #/settings  #/shop
   ========================================================================== */
(function (global) {
  'use strict';

  function parseHash() {
    var h = (location.hash || '#/home').replace(/^#/, '');
    var qIdx = h.indexOf('?');
    var query = {};
    if (qIdx >= 0) {
      h.slice(qIdx + 1).split('&').forEach(function (kv) {
        var p = kv.split('=');
        query[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '1');
      });
      h = h.slice(0, qIdx);
    }
    var parts = h.split('/').filter(Boolean);
    return { name: parts[0] || 'home', id: parts[1] || '', query: query, raw: h };
  }

  var lastRoute = '';

  function route() {
    var r = parseHash();

    // 離開課程時把狀態清乾淨
    if (lastRoute === 'lesson' && r.name !== 'lesson') Views.lessonExit();
    lastRoute = r.name;

    State.rollDay();
    UI.refreshChips();
    UI.setNavActive('#/' + r.name);
    UI.closeModal();

    var params = { id: r.id };
    for (var k in r.query) params[k] = r.query[k];

    var fn = Views[r.name];
    if (!fn) { location.hash = '#/home'; return; }

    try {
      fn(params);
    } catch (err) {
      console.error('畫面渲染失敗：' + r.name, err);
      UI.$('#view').innerHTML =
        '<div class="empty"><div class="empty-ico">😵</div>' +
        '<h2>這一頁出了點問題</h2>' +
        '<p class="muted small">' + UI.esc(err.message) + '</p>' +
        '<button class="btn btn-primary mt16" data-nav="#/home">回到首頁</button></div>';
    }

    if (r.name !== 'lesson') window.scrollTo(0, 0);
  }

  /* ---------- 首次啟動的歡迎流程 ---------- */
  function welcome() {
    var c = Content.counts();
    UI.modal(
      '<div class="center">' +
        '<div style="font-size:3.4rem">🚀</div>' +
        '<h2>歡迎來到 English Quest</h2>' +
        '<p class="muted">從 26 個字母出發，目標多益 990。</p>' +
      '</div>' +
      '<div class="card mt16">' +
        '<div class="card-title">先講三件老實話</div>' +
        '<ul class="small" style="padding-left:1.2em">' +
          '<li><b>這是一條 2–4 年的路。</b>沒有捷徑，但每天 30 分鐘就夠。</li>' +
          '<li><b>前兩個階段完全不碰考題。</b>先把發音和基本句子練熟，考試技巧之後才有用。</li>' +
          '<li><b>能不能成功，看的是連續天數。</b>所以這個 App 只有一個目標：讓你明天還想打開它。</li>' +
        '</ul>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">每天想學多久？</div>' +
        '<div class="seg" id="wgoal">' +
          '<button data-g="20">20 分</button>' +
          '<button data-g="40" class="on">40 分</button>' +
          '<button data-g="60">60 分</button>' +
        '</div>' +
        '<p class="small muted mt8 mb0">之後可以在設定裡改。</p>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">你想從哪裡下手？</div>' +
        '<div class="seg" id="wtrack">' +
          '<button data-t="phonics" class="on">先練發音</button>' +
          '<button data-t="vocab">先學單字</button>' +
        '</div>' +
        '<p class="small muted mt8 mb0">兩邊走的是同一條路、同樣的關卡，' +
        '差別只在前五關一堂課裡練幾題發音、學幾個新字。之後可以在設定裡改。</p>' +
      '</div>' +
      '<p class="center small muted">目前內容：' + c.vocab + ' 個單字　・　' +
        c.units + ' 個可玩關卡</p>' +
      '<button class="btn btn-primary btn-lg" id="wstart">開始第一關</button>'
    );

    UI.$$('#wgoal [data-g]').forEach(function (b) {
      b.onclick = function () {
        UI.$$('#wgoal [data-g]').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        State.data.profile.goalMin = +b.getAttribute('data-g');
        State.save(true);
        UI.refreshChips();
      };
    });

    UI.$$('#wtrack [data-t]').forEach(function (b) {
      b.onclick = function () {
        UI.$$('#wtrack [data-t]').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        State.data.profile.track = b.getAttribute('data-t');
        State.save(true);
      };
    });

    UI.$('#wstart').onclick = function () {
      State.data.g.welcomed = true;
      State.save(true);
      UI.closeModal();
      location.hash = '#/lesson/' + Content.currentUnitId();
    };
  }

  /* ---------- 啟動 ---------- */
  function boot() {
    State.load();
    State.data.total.sessions++;      // 開啟次數，設定頁的資料摘要會顯示
    State.save();
    UI.applyTheme();
    UI.refreshChips();
    State.startClock();

    // 系統主題變更時跟著切
    if (global.matchMedia) {
      var mq = matchMedia('(prefers-color-scheme: dark)');
      if (mq.addEventListener) mq.addEventListener('change', UI.applyTheme);
    }

    // 分頁切回來時檢查有沒有跨日
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { State.rollDay(); UI.refreshChips(); Gamify.noticeShield(); }
    });

    global.addEventListener('hashchange', route);

    if (!location.hash) location.hash = '#/home';
    route();

    // 第一次來的人不會有護盾，兩個彈窗不會撞在一起
    if (!State.data.g.welcomed) setTimeout(welcome, 350);
    else setTimeout(Gamify.noticeShield, 350);

    // 內容檢查：資料檔沒載到時給清楚的訊息，而不是整頁空白
    var c = Content.counts();
    if (!c.vocab) {
      console.warn('沒有載入到任何單字資料');
      UI.toast('⚠️ 單字資料沒有載入，請確認 data/ 資料夾完整', 'bad', 6000);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window);

</script>
</body>
</html>

      var dPool = sentencesFrom(focusOrPool, { maxWords: 11 }).concat(grammarSentences(unitId));
      SAMPLE(dPool, plan.dictate).forEach(function (s) {
        body.push({ type: 'dictate', ref: s, unitId: unitId });
      });
    }

    /* --- 6. 跟讀 --- */
    if (plan.speak) {
      var kPool = sentencesFrom(focusOrPool, { maxWords: 10 });
      if (u.phonics) {
        // 發音關卡直接跟讀單字
        kPool = focusOrPool.map(function (v) { return { en: v.w, zh: v.zh, from: v.id, kind: 'word' }; }).concat(kPool);
      }
      SAMPLE(kPool, plan.speak).forEach(function (s) {
        body.push({ type: 'speak', ref: s, unitId: unitId });
      });
    }

    /* --- 7. 文法題 --- */
    if (plan.grammar) {
      grammarQuestions(unitId, ['mc', 'fix', 'trans'], plan.grammar).forEach(function (x) {
        body.push({ type: 'grammar', ref: x.q, g: x.g, unitId: unitId });
      });
    }

    /* --- 8. 句子填空 --- */
    if (plan.cloze) {
      var cz = grammarQuestions(unitId, ['cloze'], plan.cloze);
      cz.forEach(function (x) {
        body.push({ type: 'cloze', ref: x.q, g: x.g, unitId: unitId });
      });
      // 文法題庫不夠時，用例句自動挖空
      var need = plan.cloze - cz.length;
      if (need > 0) {
        SAMPLE(sentencesFrom(focusOrPool, { minWords: 4, maxWords: 12 }), need).forEach(function (s) {
          body.push({ type: 'cloze', ref: autoCloze(s), g: null, unitId: unitId });
        });
      }
    }

    /* --- 9. 拖曳排句 --- */
    if (plan.build) {
      var bPool = grammarSentences(unitId).concat(sentencesFrom(focusOrPool, { minWords: 4, maxWords: 10 }));
      SAMPLE(bPool, plan.build).forEach(function (s) {
        body.push({ type: 'build', ref: s, unitId: unitId });
      });
    }

    /* --- 9.5 多益 Part 1／Part 2：題目自成一體，不從單字庫抽 --- */
    // 這一關沒有自己的題目就往前借（魔王關就是靠這個混考前面所有的 Part 1／Part 2）
    if (plan.photo) {
      var pics = Content.photoOf(unitId);
      if (!pics.length) pics = Content.photoUpTo(unitId);
      SAMPLE(pics, plan.photo).forEach(function (p) {
        body.push({ type: 'photo', ref: p, unitId: unitId });
      });
    }
    if (plan.respond) {
      var reps = Content.respondOf(unitId);
      if (!reps.length) reps = Content.respondUpTo(unitId);
      SAMPLE(reps, plan.respond).forEach(function (r) {
        body.push({ type: 'respond', ref: r, unitId: unitId });
      });
    }

    /* --- 10. 閱讀（放最後，當作這關的收尾） --- */
    if (plan.read) {
      var arts = Content.readingOf(unitId);
      if (!arts.length) arts = Content.readingOf(Content.prevUnitId(unitId) || '');
      SAMPLE(arts, plan.read).forEach(function (a) {
        tail.push({ type: 'read', ref: a, unitId: unitId });
      });
    }

    /* --- 交錯：單字卡之間夾一題練習，比較不無聊 --- */
    queue = intro.slice();
    var shuffledBody = S(body);
    var bi = 0;
    cards.forEach(function (c, i) {
      queue.push(c);
      if (i % 2 === 1 && bi < shuffledBody.length) queue.push(shuffledBody[bi++]);
    });
    while (bi < shuffledBody.length) queue.push(shuffledBody[bi++]);
    queue = queue.concat(tail);

    queue.forEach(function (q, i) { q.i = i; });
    return queue;
  }

  /** 把句子裡挑一個「有意義」的字挖掉 */
  function autoCloze(s) {
    var toks = s.en.split(/(\s+)/);
    var idxs = [];
    for (var i = 0; i < toks.length; i++) {
      var clean = toks[i].replace(/[^A-Za-z']/g, '');
      if (clean.length >= 3) idxs.push(i);
    }
    var pickIdx = idxs.length ? PICK(idxs) : 0;
    var answer = toks[pickIdx].replace(/[^A-Za-z']/g, '');
    var punct = toks[pickIdx].replace(/[A-Za-z']/g, '');
    toks[pickIdx] = '___' + punct;
    return {
      k: 'cloze',
      q: toks.join(''),
      a: answer,
      zh: s.zh,
      why: '',
      _auto: true,
      _full: s.en
    };
  }

  /* ==========================================================================
     每日複習佇列（首頁「暖身」與複習頁共用）
     ========================================================================== */
  /**
   * 把一隻弱點怪獸變成一題。四種怪獸各有各的問法：
   *   vocab     → 中英互選
   *   grammar   記的是「文法點」，從它底下的題庫裡抽一題重問
   *   reading   記的是「文章」，整篇重讀一次
   *   irregular 記的是「動詞」，再問一次三態
   *   photo     記的是「照片」，同一張再聽一次四個描述
   *   respond   記的是「問句」，同一句再聽一次三個回應
   * 內容已經被移除（例如改版換了 id）就回傳 null。
   */
  function weakQuestion(w) {
    var it = Content.item(w.r);
    if (!it) return null;

    if (w.t === 'vocab') {
      return { type: 'recall', ref: it, dir: Math.random() < .5 ? 'en2zh' : 'zh2en',
               unitId: w.u, weak: w.k };
    }

    if (w.t === 'grammar') {
      var qs = it.qs || [];
      if (!qs.length) return null;
      // 複習要短，優先抽選擇題與填空；沒有的話再退回改錯／翻譯
      var quick = qs.filter(function (q) { return q.k === 'mc' || q.k === 'cloze'; });
      var q = PICK(quick.length ? quick : qs);
      return { type: q.k === 'cloze' ? 'cloze' : 'grammar', ref: q, g: it,
               unitId: w.u || it.u, weak: w.k };
    }

    if (w.t === 'reading') {
      return { type: 'read', ref: it, unitId: w.u || it.u, weak: w.k };
    }

    if (w.t === 'irregular') {
      return { type: 'irregular', ref: it, ask: (it.t !== 'A' && Math.random() < .4) ? 'pp' : 'p',
               unitId: w.u, weak: w.k };
    }

    if (w.t === 'photo') {
      return { type: 'photo', ref: it, unitId: w.u || it.u, weak: w.k };
    }

    if (w.t === 'respond') {
      return { type: 'respond', ref: it, unitId: w.u || it.u, weak: w.k };
    }

    return null;
  }

  function buildReview(limit) {
    limit = limit || 20;
    var out = [];
    var tail = [];   // 閱讀放最後，跟關卡一樣當收尾

    function taken() { return out.length + tail.length; }
    function hasRef(id) {
      return out.concat(tail).some(function (o) { return o.ref && o.ref.id === id; });
    }

    // 1) 弱點怪獸優先：錯最多次的先排。
    //    額度是用「真的排進去的題數」算的 — 出不了題的怪獸不該白佔名額。
    var budget = Math.ceil(limit * 0.4);
    SRS.weakList()
      .sort(function (a, b) { return b.n - a.n; })
      .forEach(function (w) {
        if (taken() >= budget) return;
        // 一篇文章要讀好幾分鐘，一次複習最多夾一篇
        if (w.t === 'reading' && tail.length) return;
        var q = weakQuestion(w);
        if (!q) return;
        if (q.type === 'read') tail.push(q);
        else out.push(q);
      });

    // 2) SRS 到期單字
    SRS.dueIds(limit).forEach(function (id) {
      if (taken() >= limit) return;
      var v = Content.item(id);
      if (!v || !v.w) return;
      if (hasRef(id)) return;
      var spellable = v.w.length >= 3 && v.w.length <= 10 && !/\s/.test(v.w);
      var r = Math.random();
      if (r < 0.3) out.push({ type: 'recall', ref: v, dir: 'en2zh', unitId: v.u, srs: true });
      else if (r < 0.55) out.push({ type: 'recall', ref: v, dir: 'zh2en', unitId: v.u, srs: true });
      else if (r < 0.8 || !spellable) out.push({ type: 'listen', mode: 'word', ref: v, unitId: v.u, srs: true });
      else out.push({ type: 'spell', ref: v, unitId: v.u, srs: true });
    });

    out = out.concat(tail);
    out.forEach(function (q, i) { q.i = i; });
    return out;
  }

  /* ==========================================================================
     每日挑戰：混合舊內容的隨機小考
     ========================================================================== */
  function buildChallenge(size) {
    size = size || 10;
    var learned = Content.allVocab().filter(function (v) { return SRS.has(v.id); });
    if (learned.length < 6) return null;

    var out = [];

    // 文法題：從所有「已解鎖且有題目」的關卡抽，早期關卡沒文法時才不會湊不滿
    var gPool = [];
    Content.orderedUnitIds().forEach(function (uid) {
      if (!Content.isReady(uid) || !State.isUnitDone(uid)) return;
      Content.grammarOf(uid).forEach(function (g) {
        (g.qs || []).forEach(function (q) {
          if (q.k === 'mc' || q.k === 'cloze') gPool.push({ g: g, q: q, u: uid });
        });
      });
    });
    SAMPLE(gPool, Math.min(4, Math.floor(size * 0.4))).forEach(function (x) {
      out.push({ type: x.q.k === 'cloze' ? 'cloze' : 'grammar', ref: x.q, g: x.g, unitId: x.u, challenge: true });
    });

    // 剩下的名額用單字題填滿，三種型態輪替
    var kinds = ['recall-en', 'listen', 'spell', 'recall-zh'];
    SAMPLE(learned, size - out.length).forEach(function (v, i) {
      var k = kinds[i % kinds.length];
      var spellable = v.w.length >= 3 && v.w.length <= 10 && !/\s/.test(v.w);
      if (k === 'spell' && !spellable) k = 'listen';
      if (k === 'listen') out.push({ type: 'listen', mode: 'word', ref: v, unitId: v.u, challenge: true });
      else if (k === 'spell') out.push({ type: 'spell', ref: v, unitId: v.u, challenge: true });
      else out.push({ type: 'recall', ref: v, dir: k === 'recall-zh' ? 'zh2en' : 'en2zh', unitId: v.u, challenge: true });
    });

    out = S(out);
    out.forEach(function (q, i) { q.i = i; });
    return out;
  }

  /* ==========================================================================
     今日建議：首頁用
     ========================================================================== */
  function todayPlan() {
    var due = SRS.dueCount();
    var weak = SRS.weakCount();
    var cur = Content.currentUnitId();
    var u = Content.unit(cur);
    var goalXP = State.goalXP();
    var pct = State.goalPct();

    var items = [];
    if (due > 0) {
      items.push({
        key: 'review', icon: '🔥', title: '暖身複習',
        desc: due + ' 個單字今天到期',
        hint: '大約 ' + Math.max(2, Math.round(due * 0.25)) + ' 分鐘',
        hash: '#/review', cta: '開始複習'
      });
    }
    if (u) {
      var rec = State.data.units[cur];
      var lv = (rec && rec.lv) || 0;
      var unseen = unseenOf(cur).length;
      items.push({
        key: 'lesson', icon: u.icon || '📘',
        title: (Content.stageOf(cur) ? Content.stageOf(cur).name + '　' : '') + '第 ' + u.n + ' 關',
        desc: u.title + (unseen ? '（還有 ' + unseen + ' 個新字）' : '（新字已學完，這關可再刷熟練度）'),
        hint: lv > 0 ? '皇冠 Lv.' + lv : '首次挑戰',
        hash: '#/lesson/' + cur, cta: lv > 0 ? '再打一次' : '開始學習'
      });
    }
    if (weak > 0) {
      items.push({
        key: 'weak', icon: '👾', title: '弱點怪獸',
        desc: '有 ' + weak + ' 隻怪獸還沒被打倒',
        hint: '答對就消滅',
        hash: '#/review?weak=1', cta: '去打怪'
      });
    }
    if (!State.data.today.challenge) {
      items.push({
        key: 'challenge', icon: '🎲', title: '每日挑戰',
        desc: '10 題隨機小考，完成拿 💎',
        hint: '約 3 分鐘',
        hash: '#/lesson/challenge', cta: '接受挑戰'
      });
    }

    return { items: items, pct: pct, goalXP: goalXP, due: due, weak: weak, currentUnit: cur };
  }

  global.Scheduler = {
    buildLesson: buildLesson,
    buildReview: buildReview,
    buildChallenge: buildChallenge,
    todayPlan: todayPlan,
    unseenOf: unseenOf,
    sentencesFrom: sentencesFrom
  };
})(window);

</script>

<!-- ===== 練習題型 ===== -->
<script>
/* ===== js/exercises/common.js ===== */
/* ==========================================================================
   exercises/common.js — 題型共用工具
   --------------------------------------------------------------------------
   題型模組契約：
     Ex[type] = {
       scored: true/false,            // 是否計分
       render: function (q, host, api) { ... }
     }
   api 提供：
     api.ready(fn)          設定「檢查」按鈕要執行什麼（fn 自行呼叫 api.result）
     api.enableCheck(bool)  啟用/停用檢查按鈕
     api.result(ok, opts)   送出結果 → 顯示批改列
     api.setContinue(text)  不計分的卡片用：直接顯示「繼續」按鈕
     api.next()             進下一題
   ========================================================================== */
(function (global) {
  'use strict';

  global.Ex = global.Ex || {};

  var esc = UI.esc;

  /* ---------- 選項清單 ---------- */
  /**
   * @param {Array} opts   [{html, value, correct}]
   * @param {object} cfg   { grid2:bool, onPick:fn(idx, optEl) }
   */
  function options(host, opts, cfg) {
    cfg = cfg || {};
    var wrap = document.createElement('div');
    wrap.className = 'opts' + (cfg.grid2 ? ' grid2' : '');
    var nodes = [];

    opts.forEach(function (o, i) {
      var b = document.createElement('button');
      b.className = 'opt';
      b.type = 'button';
      b.innerHTML = (cfg.grid2 ? '' : '<span class="opt-kbd">' + (i + 1) + '</span>') + o.html;
      b.addEventListener('click', function () {
        if (wrap.dataset.locked) return;
        nodes.forEach(function (n) { n.classList.remove('sel'); });
        b.classList.add('sel');
        wrap.dataset.picked = i;
        Sfx.play('click');
        if (cfg.onPick) cfg.onPick(i, b);
      });
      nodes.push(b);
      wrap.appendChild(b);
    });

    host.appendChild(wrap);

    return {
      el: wrap,
      nodes: nodes,
      picked: function () {
        return wrap.dataset.picked === undefined ? -1 : +wrap.dataset.picked;
      },
      lock: function (correctIdx) {
        wrap.dataset.locked = '1';
        nodes.forEach(function (n, i) {
          n.classList.add('opt-locked');
          n.classList.remove('sel');
          if (i === correctIdx) n.classList.add('correct');
          else if (String(i) === wrap.dataset.picked) n.classList.add('wrong');
        });
      }
    };
  }

  /* ---------- 鍵盤 1–9 選項快捷 ---------- */
  function bindKeys(optCtl, api) {
    function onKey(e) {
      if (e.target && /input|textarea/i.test(e.target.tagName)) return;
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= optCtl.nodes.length) {
        optCtl.nodes[n - 1].click();
        e.preventDefault();
      }
    }
    document.addEventListener('keydown', onKey);
    api.onCleanup(function () { document.removeEventListener('keydown', onKey); });
  }

  /* ---------- 題目標題 ---------- */
  function prompt(host, text, sub) {
    var d = document.createElement('div');
    d.innerHTML = '<div class="q-prompt">' + text + '</div>' +
      (sub ? '<p class="muted small mt0">' + sub + '</p>' : '');
    host.appendChild(d);
    return d;
  }

  /* ---------- 例句區塊 ---------- */
  function exampleHTML(v, showZh) {
    if (!v.ex || !v.ex.length) return '';
    var rows = v.ex.map(function (p, i) {
      return '<div class="ex-item">' +
        '<span class="ex-tag ' + (i === 0 ? 'daily">日常' : 'work">職場') + '</span> ' +
        Speech.btn(p[0], false, 'speak-inline') +
        '<div class="sentence-en">' + esc(p[0]) + '</div>' +
        (showZh === false ? '' : '<div class="sentence-zh">' + esc(p[1]) + '</div>') +
        '</div>';
    }).join('');
    return '<div class="ex-list">' + rows + '</div>';
  }

  /* ---------- 單字卡 HTML ---------- */
  function wordCardHTML(v, opts) {
    opts = opts || {};
    var showKK = State.data.profile.showKK && v.kk;
    return '<div class="wordcard">' +
      (v.ic ? '<div class="word-icon">' + v.ic + '</div>' : '') +
      '<div class="word-main">' + esc(v.w) + '</div>' +
      (showKK ? '<div class="word-kk">[' + esc(v.kk) + ']</div>' : '') +
      '<div class="row" style="justify-content:center;gap:8px;margin-top:10px">' +
        Speech.btn(v.w) + Speech.btn(v.w, true) +
      '</div>' +
      (opts.hideZh ? '' :
        '<div class="word-zh"><span class="word-pos">' + esc(v.pos) + '</span>' + esc(v.zh) + '</div>') +
      (opts.showEx === false ? '' : exampleHTML(v)) +
      '</div>';
  }

  /* ---------- 文字比對（寫作/聽寫用） ---------- */
  /**
   * 縮寫展開成完整寫法：I'm 和 I am、don't 和 do not 只是寫法不同，不該判錯。
   * 輸入與答案都會過這一關，所以只會讓比對更寬鬆，不會把對的判成錯的。
   * 's 與 'd 刻意不處理 — 它們有歧義（is/has、would/had），
   * 展開反而可能把 He's got 和 He has got 判成不一樣。
   */
  function expandContractions(s) {
    return s
      .replace(/\bwon't\b/g, 'will not')
      .replace(/\bcan't\b/g, 'can not')
      .replace(/\bcannot\b/g, 'can not')
      .replace(/\bshan't\b/g, 'shall not')
      .replace(/n't\b/g, ' not')
      .replace(/\blet's\b/g, 'let us')
      .replace(/'m\b/g, ' am')
      .replace(/'re\b/g, ' are')
      .replace(/'ll\b/g, ' will')
      .replace(/'ve\b/g, ' have');
  }

  function normalizeAns(s) {
    return expandContractions(
      String(s || '').toLowerCase()
        .replace(/[’‘]/g, "'").replace(/[“”]/g, '"'))
      .replace(/[.,!?;:]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function sameText(a, b) { return normalizeAns(a) === normalizeAns(b); }

  /** 接受多個正確答案 */
  function matchAny(input, answers) {
    for (var i = 0; i < answers.length; i++) {
      if (sameText(input, answers[i])) return true;
    }
    return false;
  }

  /** 差一兩個字母時提示「很接近」 */
  function nearMiss(input, answer) {
    var a = normalizeAns(input), b = normalizeAns(answer);
    if (!a || !b) return false;
    return Speech.similar(a, b) >= 0.82;
  }

  /* ---------- 把句子切成可拖曳的字塊 ---------- */
  function tokenize(sentence) {
    return sentence.trim().split(/\s+/);
  }

  /* ---------- 標記單字答對/答錯，餵給 SRS ---------- */
  function gradeVocab(v, ok, slow, unitId) {
    if (!v || !v.id) return;
    SRS.grade(v.id, ok ? (slow ? 1 : 2) : 0);
    if (ok) SRS.clearWeak('vocab', v.id);
    else SRS.addWeak('vocab', v.id, unitId || v.u);
  }

  function gradeGrammar(g, ok, unitId) {
    if (!g || !g.id) return;
    if (ok) SRS.clearWeak('grammar', g.id);
    else SRS.addWeak('grammar', g.id, unitId || g.u);
  }

  global.ExUtil = {
    options: options, bindKeys: bindKeys, prompt: prompt,
    exampleHTML: exampleHTML, wordCardHTML: wordCardHTML,
    normalizeAns: normalizeAns, expandContractions: expandContractions,
    sameText: sameText, matchAny: matchAny,
    nearMiss: nearMiss, tokenize: tokenize,
    gradeVocab: gradeVocab, gradeGrammar: gradeGrammar
  };
})(window);

</script>
<script>
/* ===== js/exercises/intro.js ===== */
/* ==========================================================================
   exercises/intro.js — 教學卡（發音表 / 文法概念）
   不計分，讀完按「我懂了」進下一題。
   ========================================================================== */
(function (global) {
  'use strict';

  var esc = UI.esc;

  /** 通用區塊渲染器：發音表與文法卡共用同一套語法 */
  function renderSections(sections) {
    return (sections || []).map(function (s) {
      var out = '';
      if (s.h)  out += '<h3 class="mt16">' + s.h + '</h3>';
      if (s.p)  out += '<p>' + s.p + '</p>';

      if (s.formula) {
        out += '<div class="rule-box"><div class="rule-formula">' + s.formula + '</div>' +
               (s.formulaNote ? '<div class="small muted center">' + s.formulaNote + '</div>' : '') +
               '</div>';
      }

      if (s.list) {
        out += '<ul>' + s.list.map(function (li) { return '<li>' + li + '</li>'; }).join('') + '</ul>';
      }

      if (s.table) {
        out += '<div style="overflow-x:auto"><table class="tbl"><thead><tr>' +
          s.table.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
          s.table.rows.map(function (r) {
            return '<tr>' + r.map(function (c, ci) {
              var cell = String(c);
              // 第一欄如果是英文，加上發音按鈕
              if (ci === 0 && s.table.speak && /[A-Za-z]/.test(cell)) {
                var plain = cell.replace(/<[^>]+>/g, '').replace(/[^A-Za-z' ]/g, '').trim();
                return '<td class="en">' + cell +
                  (plain ? ' ' + Speech.btn(plain, false, 'speak-mini') : '') + '</td>';
              }
              return '<td' + (ci === 0 ? ' class="en"' : '') + '>' + cell + '</td>';
            }).join('') + '</tr>';
          }).join('') +
          '</tbody></table></div>';
      }

      if (s.words) {
        out += '<div class="row wrap mt8" style="gap:8px">' + s.words.map(function (w) {
          var word = typeof w === 'string' ? w : w.w;
          var zh = typeof w === 'string' ? '' : w.zh;
          var ic = typeof w === 'string' ? '' : (w.ic || '');
          return '<button class="tok" data-speak="' + esc(word) + '">' +
            (ic ? ic + ' ' : '') + esc(word) +
            (zh ? ' <span class="muted small">' + esc(zh) + '</span>' : '') + '</button>';
        }).join('') + '</div>';
      }

      if (s.ex) {
        out += '<div class="ex-list">' + s.ex.map(function (p) {
          return '<div class="ex-item">' + Speech.btn(p[0], false, 'speak-inline') +
            '<div class="sentence-en">' + esc(p[0]) + '</div>' +
            '<div class="sentence-zh">' + esc(p[1]) + '</div></div>';
        }).join('') + '</div>';
      }

      if (s.tip)  out += '<div class="hint-box">💡 ' + s.tip + '</div>';
      if (s.warn) out += '<div class="warn-box">⚠️ ' + s.warn + '</div>';

      return out;
    }).join('');
  }

  /** 不規則動詞表：從資料現組一張教學卡，依詞型分三組呈現 */
  var IRREG_GROUPS = [
    { t: 'A', h: 'A 型：三態同形', p: '最好背的一組 — 三個形態長得一模一樣。' },
    { t: 'B', h: 'B 型：過去式＝過去分詞', p: '只要記兩個形態，數量最多。' },
    { t: 'C', h: 'C 型：三態都不同', p: '最容易錯的一組，多益也考最兇。' }
  ];

  function irregularTeach(list) {
    return {
      title: '不規則動詞 ' + list.length + ' 個',
      lead: '規則動詞加 -ed 就好，這些不行。但它們不是亂長的 — 按變化形態分成三組，要背的量立刻少一半。',
      sections: IRREG_GROUPS.map(function (g) {
        var rows = list.filter(function (iv) { return iv.t === g.t; })
          .map(function (iv) { return [iv.v, iv.p, iv.pp, iv.zh]; });
        return {
          h: g.h + '（' + rows.length + ' 個）',
          p: g.p,
          table: { head: ['原形', '過去式', '過去分詞', '中文'], rows: rows, speak: true }
        };
      })
    };
  }

  var TAGS = {
    grammar:   ['blue',  '文法'],
    irregular: ['gold',  '不規則動詞'],
    phonics:   ['green', '發音']
  };

  Ex.intro = {
    scored: false,
    render: function (q, host, api) {
      var d = q.ref;
      var teach = q.kind === 'grammar' ? d.teach
                : q.kind === 'irregular' ? irregularTeach(d)
                : d;
      var title = teach.title || d.title || '學習重點';
      var tag = TAGS[q.kind] || TAGS.phonics;

      host.innerHTML =
        '<div class="tag ' + tag[0] + '">' + tag[1] + '</div>' +
        '<h2 class="mt8">' + esc(title) + '</h2>' +
        (teach.lead ? '<p class="muted">' + teach.lead + '</p>' : '') +
        '<div class="card">' + renderSections(teach.sections) + '</div>';

      api.setContinue('我懂了 👍');
    }
  };

  global.ExIntro = { renderSections: renderSections };
})(window);

</script>
<script>
/* ===== js/exercises/flashcard.js ===== */
/* ==========================================================================
   exercises/flashcard.js — 單字卡（新字教學）＋ recall（中英互選）
   ========================================================================== */
(function (global) {
  'use strict';

  var esc = UI.esc;

  /* ======================= 單字卡：教新字，不計分 ======================= */
  Ex.flashcard = {
    scored: false,
    render: function (q, host, api) {
      var v = q.ref;
      host.innerHTML =
        '<div class="tag green">新單字</div>' +
        ExUtil.wordCardHTML(v);

      // 第一次見到就建立 SRS 紀錄，讓它明天排進複習
      if (!SRS.has(v.id)) {
        SRS.rec(v.id);
        State.data.today.newWords++;
        State.save();
      }

      if (State.data.profile.autoPlay) {
        setTimeout(function () { Speech.speak(v.w); }, 250);
      }
      api.setContinue('記起來了');
    }
  };

  /* ======================= recall：看中文選英文 / 看英文選中文 ======================= */
  Ex.recall = {
    scored: true,
    render: function (q, host, api) {
      var v = q.ref;
      var zh2en = q.dir === 'zh2en';
      var t0 = Date.now();

      var wrongs = Content.distractors(v, 3);
      var pool = Content.shuffle([v].concat(wrongs));
      var correctIdx = pool.indexOf(v);

      ExUtil.prompt(host,
        zh2en ? '「' + esc(v.zh) + '」的英文是？' : '這個字是什麼意思？',
        zh2en ? '<span class="word-pos">' + esc(v.pos) + '</span>' : '');

      if (!zh2en) {
        host.insertAdjacentHTML('beforeend',
          '<div class="wordcard" style="padding:16px">' +
            (v.ic ? '<div class="word-icon">' + v.ic + '</div>' : '') +
            '<div class="word-main">' + esc(v.w) + '</div>' +
            (State.data.profile.showKK && v.kk ? '<div class="word-kk">[' + esc(v.kk) + ']</div>' : '') +
            '<div class="mt8">' + Speech.btn(v.w) + '</div>' +
          '</div>');
      }

      var opts = pool.map(function (x) {
        return { html: zh2en
          ? '<span class="en bold">' + esc(x.w) + '</span>'
          : '<span class="bold">' + esc(x.zh) + '</span>' };
      });

      var ctl = ExUtil.options(host, opts, {
        onPick: function () { api.enableCheck(true); }
      });
      ExUtil.bindKeys(ctl, api);
      api.enableCheck(false);

      api.ready(function () {
        var picked = ctl.picked();
        if (picked < 0) return;
        var ok = picked === correctIdx;
        var slow = (Date.now() - t0) > 9000;
        ctl.lock(correctIdx);
        ExUtil.gradeVocab(v, ok, slow, q.unitId);
        if (q.weak && ok) SRS.clearWeak('vocab', v.id);

        api.result(ok, {
          title: ok ? (slow ? '答對了，但想久了一點' : '答對！') : '正確答案是',
          detail: '<div class="row" style="gap:8px">' + Speech.btn(v.w) +
            '<div><div class="sentence-en">' + esc(v.w) +
            (v.kk ? ' <span class="word-kk">[' + esc(v.kk) + ']</span>' : '') + '</div>' +
            '<div class="sentence-zh">' + esc(v.pos) + ' ' + esc(v.zh) + '</div></div></div>' +
            (v.ex && v.ex[0] ? '<div class="sentence-en mt8">' + esc(v.ex[0][0]) + '</div>' +
              '<div class="sentence-zh">' + esc(v.ex[0][1]) + '</div>' : '')
        });
      });
    }
  };
})(window);

</script>
<script>
/* ===== js/exercises/spell.js ===== */
/* ==========================================================================
   exercises/spell.js — 字母銀行拼字
   --------------------------------------------------------------------------
   難度階梯裡缺的那一階：
     選擇題（認得就好） → 字母銀行拼字（要拼得出來） → 空白打字（最難）
   對零基礎的人，直接叫他打字太挫折；點字母剛好，手機上也比鍵盤好按。
   提示強度會隨熟練度自動降低：越熟的字，露出的首字母越少。
   ========================================================================== */
(function (global) {
  'use strict';

  var esc = UI.esc;

  /** 依 SRS 熟練度決定要先露幾個字母 */
  function hintCount(word, level) {
    if (word.length <= 3) return 0;
    if (level >= 2) return 0;               // 熟悉以上：完全不給
    if (level === 1) return 1;              // 學習中：給第一個字母
    return word.length >= 7 ? 2 : 1;        // 第一次拼：長字給兩個
  }

  Ex.spell = {
    scored: true,
    render: function (q, host, api) {
      var v = q.ref;
      var word = v.w;
      var letters = word.split('');
      var lvl = SRS.levelOf(v.id);
      var given = hintCount(word, lvl);

      // 句子挖空：優先用例句，讓拼字發生在語境裡而不是孤立背單字
      var ex = (v.ex && v.ex[0]) ? v.ex[0] : null;
      var before = '', after = '', zhLine = v.zh;
      if (ex) {
        var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
        var m = ex[0].match(re);
        if (m) {
          var i = ex[0].search(re);
          before = ex[0].slice(0, i);
          after = ex[0].slice(i + m[0].length);
          zhLine = ex[1];
        } else { ex = null; }
      }

      ExUtil.prompt(host, ex ? '把句子裡缺的字拼出來' : '拼出這個字');

      // 提示：已給的字母 + 底線
      var hintStr = letters.map(function (c, i) {
        return i < given ? c : (c === ' ' || c === '-' || c === "'" ? c : '_');
      }).join(' ');

      host.insertAdjacentHTML('beforeend',
        '<div class="card center">' +
          (v.ic ? '<div class="word-icon">' + v.ic + '</div>' : '') +
          (ex
            ? '<div class="cloze-text"><span class="en">' + esc(before) + '</span>' +
              '<b class="text-blue" id="slot">' + '＿'.repeat(Math.max(1, letters.length - given)) + '</b>' +
              '<span class="en">' + esc(after) + '</span></div>'
            : '<div class="cloze-text"><b class="text-blue" id="slot">＿</b></div>') +
          '<div class="sentence-zh mt8">' + esc(zhLine) + '</div>' +
          '<div class="word-kk mt8" style="letter-spacing:3px">' + esc(hintStr) + '</div>' +
          '<div class="row mt8" style="justify-content:center;gap:8px">' +
            '<span class="word-pos">' + esc(v.pos) + '</span>' +
            '<span class="small muted">' + esc(v.zh) + '</span>' +
          '</div>' +
        '</div>' +

        '<div class="build-area" id="slots" style="justify-content:center;min-height:56px"></div>' +
        '<div class="bank" id="bank" style="justify-content:center"></div>' +
        '<div class="row mt16" style="gap:8px;justify-content:center">' +
          '<button class="btn btn-ghost btn-sm" id="clear">↺ 全部清掉</button>' +
          '<button class="btn btn-ghost btn-sm" id="hear">🔊 聽一次</button>' +
        '</div>');

      var slots = UI.$('#slots', host);
      var bank = UI.$('#bank', host);
      var slot = UI.$('#slot', host);

      // 已給的字母直接鎖在前面
      for (var g = 0; g < given; g++) {
        var fixed = document.createElement('span');
        fixed.className = 'tok';
        fixed.style.opacity = '.55';
        fixed.textContent = letters[g];
        slots.appendChild(fixed);
      }

      // 字母銀行：剩下的字母打亂，再加 2 個干擾字母
      var pool = letters.slice(given);
      var noise = 'abcdefghijklmnopqrstuvwxyz'.split('')
        .filter(function (c) { return word.toLowerCase().indexOf(c) < 0; });
      pool = pool.concat(Content.sample(noise, word.length > 6 ? 3 : 2));

      Content.shuffle(pool).forEach(function (ch) {
        var b = document.createElement('button');
        b.className = 'tok';
        b.type = 'button';
        b.textContent = ch;
        b.style.minWidth = '42px';
        b.onclick = function () { placeLetter(b); };
        bank.appendChild(b);
      });

      function placeLetter(b) {
        if (b.classList.contains('used')) return;
        Sfx.play('click');
        var c = document.createElement('span');
        c.className = 'tok';
        c.textContent = b.textContent;
        c.style.minWidth = '42px';
        c.onclick = function () {
          if (slots.dataset.locked) return;
          Sfx.play('click');
          slots.removeChild(c);
          b.classList.remove('used');
          sync();
        };
        slots.appendChild(c);
        b.classList.add('used');
        sync();
      }

      function typed() {
        return Array.prototype.map.call(slots.children, function (n) { return n.textContent; }).join('');
      }

      function sync() {
        var t = typed();
        if (slot) slot.textContent = t || '＿'.repeat(Math.max(1, letters.length - given));
        api.enableCheck(t.length >= Math.max(2, word.length - 2));
      }

      UI.$('#clear', host).onclick = function () {
        if (slots.dataset.locked) return;
        while (slots.children.length > given) slots.removeChild(slots.lastChild);
        UI.$$('.tok', bank).forEach(function (n) { n.classList.remove('used'); });
        sync();
      };
      UI.$('#hear', host).onclick = function () { Speech.speak(word); };

      api.enableCheck(false);
      sync();

      // 桌機：直接用鍵盤敲字母也可以
      function onKey(e) {
        if (e.target && /input|textarea/i.test(e.target.tagName)) return;
        if (e.key === 'Backspace') {
          if (slots.children.length > given) slots.lastChild.click();
          e.preventDefault();
          return;
        }
        if (!/^[a-zA-Z]$/.test(e.key)) return;
        var hit = UI.$$('.tok', bank).filter(function (n) {
          return !n.classList.contains('used') && n.textContent.toLowerCase() === e.key.toLowerCase();
        })[0];
        if (hit) { hit.click(); e.preventDefault(); }
      }
      document.addEventListener('keydown', onKey);
      api.onCleanup(function () { document.removeEventListener('keydown', onKey); });

      api.ready(function () {
        slots.dataset.locked = '1';
        var mine = typed();
        var ok = mine.toLowerCase() === word.toLowerCase();

        Array.prototype.forEach.call(slots.children, function (n, i) {
          var right = word[i] && n.textContent.toLowerCase() === word[i].toLowerCase();
          n.style.borderColor = right ? 'var(--green)' : 'var(--red)';
          n.style.color = right ? 'var(--green-dark)' : 'var(--red-dark)';
        });
        if (slot) slot.textContent = word;

        ExUtil.gradeVocab(v, ok, false, q.unitId);
        Speech.speak(word);

        api.result(ok, {
          title: ok ? '拼對了！' : '正確拼法是 ' + word,
          detail: '<div class="row" style="gap:8px">' + Speech.btn(word) + Speech.btn(word, true) +
            '<div><div class="sentence-en">' + esc(word) +
            (v.kk ? ' <span class="word-kk">[' + esc(v.kk) + ']</span>' : '') + '</div>' +
            '<div class="sentence-zh">' + esc(v.pos) + ' ' + esc(v.zh) + '</div></div></div>' +
            (ok ? '' : '<div class="small muted mt8">你拼的：' + esc(mine) + '</div>') +
            (ex ? '<div class="sentence-en mt8">' + esc(ex[0]) + '</div>' +
                  '<div class="sentence-zh">' + esc(ex[1]) + '</div>' : '')
        });
      });
    }
  };
})(window);

</script>
<script>
/* ===== js/exercises/listening.js ===== */
/* ==========================================================================
   exercises/listening.js — 聽力：聽音辨義（單字/句子）與聽寫填空
   ========================================================================== */
(function (global) {
  'use strict';

  var esc = UI.esc;

  function playerHTML(text) {
    return '<div class="center" style="padding:12px 0">' +
      '<button class="speak-btn" data-speak="' + esc(text) + '" ' +
        'style="width:88px;height:88px;font-size:2.4rem">🔊</button>' +
      '<div class="mt8">' +
        '<button class="btn btn-ghost btn-sm" data-speak="' + esc(text) + '" data-slow="1">🐢 慢速重播</button>' +
      '</div></div>';
  }

  function autoplay(text) {
    if (!Speech.available()) return;
    setTimeout(function () { Speech.speak(text); }, 300);
  }

  function noVoiceWarning() {
    if (Speech.available()) return '';
    return '<div class="warn-box">找不到英文語音。請確認系統已安裝英語語音套件' +
      '（Windows：設定 → 時間與語言 → 語音 → 新增語音 → English）。' +
      '在語音修好之前，這一題可以看文字作答。</div>';
  }

  /* ======================= 聽音辨義 ======================= */
  Ex.listen = {
    scored: true,
    render: function (q, host, api) {
      var isWord = q.mode === 'word';
      var target = isWord ? q.ref.w : q.ref.en;
      var t0 = Date.now();

      ExUtil.prompt(host, isWord ? '聽到的是哪個字？' : '這句話的意思是？');
      host.insertAdjacentHTML('beforeend', noVoiceWarning() + playerHTML(target));

      // 沒有語音時直接把文字露出來，避免整題卡死
      if (!Speech.available()) {
        host.insertAdjacentHTML('beforeend',
          '<div class="card card-tight center sentence-en">' + esc(target) + '</div>');
      }

      var pool, correctIdx, opts;

      if (isWord) {
        var v = q.ref;
        pool = Content.shuffle([v].concat(Content.distractors(v, 3)));
        correctIdx = pool.indexOf(v);
        opts = pool.map(function (x) {
          return { html: '<span class="en bold">' + esc(x.w) + '</span>' +
            '<span class="muted small">　' + esc(x.zh) + '</span>' };
        });
      } else {
        // 句子題：從同關卡其他句子抽誘答
        var all = Scheduler.sentencesFrom(Content.vocabUpTo(q.unitId), { maxWords: 14 })
          .filter(function (s) { return s.zh !== q.ref.zh; });
        var wrong = Content.sample(all, 3);
        pool = Content.shuffle([q.ref].concat(wrong));
        correctIdx = pool.indexOf(q.ref);
        opts = pool.map(function (x) { return { html: esc(x.zh) }; });
      }

      var ctl = ExUtil.options(host, opts, { onPick: function () { api.enableCheck(true); } });
      ExUtil.bindKeys(ctl, api);
      api.enableCheck(false);
      autoplay(target);

      api.ready(function () {
        var picked = ctl.picked();
        if (picked < 0) return;
        var ok = picked === correctIdx;
        ctl.lock(correctIdx);
        if (isWord) ExUtil.gradeVocab(q.ref, ok, (Date.now() - t0) > 9000, q.unitId);
        api.result(ok, {
          title: ok ? '聽對了！' : '再聽一次',
          detail: '<div class="row" style="gap:8px">' + Speech.btn(target) +
            '<div><div class="sentence-en">' + esc(target) + '</div>' +
            '<div class="sentence-zh">' + esc(isWord ? q.ref.zh : q.ref.zh) + '</div></div></div>'
        });
      });
    }
  };

  /* ======================= 聽寫填空 ======================= */
  Ex.dictate = {
    scored: true,
    render: function (q, host, api) {
      var s = q.ref;
      var toks = ExUtil.tokenize(s.en);

      // 挑 1–2 個「有內容」的字挖空
      var candidates = [];
      toks.forEach(function (t, i) {
        var clean = t.replace(/[^A-Za-z']/g, '');
        if (clean.length >= 3) candidates.push(i);
      });
      var blanks = Content.sample(candidates.length ? candidates : [0], toks.length > 7 ? 2 : 1);
      blanks.sort(function (a, b) { return a - b; });

      ExUtil.prompt(host, '聽寫：把空格補完');
      host.insertAdjacentHTML('beforeend', noVoiceWarning() + playerHTML(s.en));

      var html = '<div class="cloze-text center">';
      toks.forEach(function (t, i) {
        if (blanks.indexOf(i) >= 0) {
          var clean = t.replace(/[^A-Za-z']/g, '');
          var punct = t.replace(/[A-Za-z']/g, '');
          html += '<input class="blank-input" data-i="' + i + '" data-a="' + esc(clean) +
                  '" size="' + Math.max(4, clean.length) + '" autocomplete="off" ' +
                  'autocapitalize="off" spellcheck="false"> ' + esc(punct) + ' ';
        } else {
          html += esc(t) + ' ';
        }
      });
      html += '</div>';
      host.insertAdjacentHTML('beforeend', html);
      host.insertAdjacentHTML('beforeend',
        '<p class="muted small center mt8">' + esc(s.zh) + '</p>');

      var inputs = UI.$$('.blank-input', host);
      inputs.forEach(function (inp) {
        inp.addEventListener('input', function () {
          var any = inputs.some(function (x) { return x.value.trim(); });
          api.enableCheck(any);
        });
        inp.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); api.submit(); }
        });
      });
      api.enableCheck(false);
      if (inputs[0]) setTimeout(function () { inputs[0].focus(); }, 120);
      autoplay(s.en);

      api.ready(function () {
        var allOk = true;
        inputs.forEach(function (inp) {
          var ok = ExUtil.sameText(inp.value, inp.getAttribute('data-a'));
          inp.classList.add(ok ? 'correct' : 'wrong');
          inp.disabled = true;
          if (!ok) { allOk = false; inp.value = inp.getAttribute('data-a'); }
        });
        var v = Content.item(s.from);
        if (v && v.w) ExUtil.gradeVocab(v, allOk, false, q.unitId);
        api.result(allOk, {
          title: allOk ? '全對！耳朵很準' : '正確的句子是',
          detail: '<div class="row" style="gap:8px">' + Speech.btn(s.en) +
            '<div><div class="sentence-en">' + esc(s.en) + '</div>' +
            '<div class="sentence-zh">' + esc(s.zh) + '</div></div></div>'
        });
      });
    }
  };
})(window);

</script>
<script>
/* ===== js/exercises/speaking.js ===== */
/* ==========================================================================
   exercises/speaking.js — 口說跟讀
   --------------------------------------------------------------------------
   三種模式，依環境自動選：
     A. 連網 + 支援辨識 → 真的比對你唸的內容，逐字標紅
     B. 離線但可錄音     → 錄下來回放，跟原音對照後自評
     C. 兩者都不行       → 純跟讀，唸完按繼續（不擋學習）
   ========================================================================== */
(function (global) {
  'use strict';

  var esc = UI.esc;

  function header(host, s) {
    var isWord = s.kind === 'word';
    ExUtil.prompt(host, isWord ? '跟著唸這個字' : '跟著唸這句話');
    host.insertAdjacentHTML('beforeend',
      '<div class="wordcard">' +
        '<div class="' + (isWord ? 'word-main' : 'sentence-en big') + '">' + esc(s.en) + '</div>' +
        '<div class="sentence-zh mt8">' + esc(s.zh) + '</div>' +
        '<div class="row mt16" style="justify-content:center;gap:10px">' +
          Speech.btn(s.en) + Speech.btn(s.en, true) +
        '</div>' +
      '</div>');
  }

  function marksHTML(marks) {
    return marks.map(function (m) {
      return '<span class="' + (m.ok ? 'hit' : 'miss') + '">' + esc(m.w) + '</span>';
    }).join(' ');
  }

  Ex.speak = {
    scored: true,
    render: function (q, host, api) {
      var s = q.ref;
      header(host, s);

      var useSTT = Speech.sttUsable();
      var useRec = !useSTT && Speech.recorderSupported();

      /* ---------------- C. 兩者都不行：純跟讀 ---------------- */
      if (!useSTT && !useRec) {
        host.insertAdjacentHTML('beforeend',
          '<div class="hint-box">這個瀏覽器沒有麥克風功能可用，先用「聽 → 跟著唸出聲」的方式練習。' +
          '出聲唸出來比在心裡默念有效得多。</div>');
        api.setContinue('我唸過了');
        return;
      }

      var modeNote = useSTT
        ? '<p class="muted small center">按麥克風後對著它唸，唸完再按一次結束。</p>'
        : '<div class="hint-box">目前是離線狀態，無法自動評分。改成錄下你的聲音跟原音對照，' +
          '由你自己判斷像不像 — 這反而更能練出耳朵。</div>';

      host.insertAdjacentHTML('beforeend',
        modeNote +
        '<div class="center"><button class="mic-btn" id="mic">🎤</button></div>' +
        '<div id="heard" class="heard mt16 center muted">還沒開始</div>' +
        '<div id="playback" class="center mt8"></div>' +
        '<div class="center mt8"><button class="btn btn-ghost btn-sm" id="skip">這題先跳過</button></div>');

      var mic = UI.$('#mic', host);
      var heard = UI.$('#heard', host);
      var playback = UI.$('#playback', host);
      var recording = false;
      var ctl = null;
      var recCtl = null;
      var finished = false;

      UI.$('#skip', host).onclick = function () {
        if (finished) return;
        finished = true;
        api.result(true, { title: '跳過', detail: '沒關係，之後再回來練這句。', neutral: true });
      };

      /* ---------------- A. 語音辨識 ---------------- */
      function startSTT() {
        heard.textContent = '聽你唸…';
        heard.classList.remove('muted');
        ctl = Speech.listen({
          oninterim: function (t) { heard.textContent = t || '聽你唸…'; },
          onerror: function (err) {
            recording = false;
            mic.classList.remove('rec');
            if (err === 'not-allowed' || err === 'service-not-allowed') {
              heard.innerHTML = '<span class="text-red">麥克風被擋住了</span>';
              host.insertAdjacentHTML('beforeend',
                '<div class="warn-box">瀏覽器封鎖了麥克風。請點網址列左邊的鎖頭圖示 → 允許麥克風，' +
                '然後重新整理。<br>' +
                '（注意：用 file:// 直接開啟時，部分瀏覽器不允許麥克風，這種情況請按「跳過」，' +
                '或改用打包後的單檔版放到手機瀏覽器使用。）</div>');
            } else if (err === 'no-speech') {
              heard.innerHTML = '<span class="muted">沒聽到聲音，再試一次</span>';
            } else {
              heard.innerHTML = '<span class="muted">辨識失敗（' + esc(err) + '），可以按跳過</span>';
            }
          },
          onend: function (text) {
            recording = false;
            mic.classList.remove('rec');
            if (!text) { return; }
            judge(text);
          }
        });
      }

      function judge(text) {
        if (finished) return;
        finished = true;
        var r = Speech.scoreSpeech(s.en, text);
        var ok = r.score >= 0.6;
        heard.innerHTML = marksHTML(r.marks);

        var pctTxt = Math.round(r.score * 100);
        var v = Content.item(s.from);
        if (v && v.w) ExUtil.gradeVocab(v, ok, false, q.unitId);

        api.result(ok, {
          title: ok ? (r.score >= 0.9 ? '幾乎完美！' : '不錯，聽得出來了') : '再試一次會更好',
          detail:
            '<div class="row" style="gap:14px;align-items:center">' +
              '<div class="score-big ' + (ok ? 'text-green' : 'text-red') + '">' + pctTxt + '<span class="small">分</span></div>' +
              '<div class="grow"><div class="small muted">辨識結果</div>' +
              '<div class="heard" style="background:transparent;padding:0">' + marksHTML(r.marks) + '</div></div>' +
            '</div>' +
            '<div class="row mt8" style="gap:8px">' + Speech.btn(s.en) + Speech.btn(s.en, true) +
            '<span class="small muted">再聽一次標準音</span></div>'
        });
      }

      /* ---------------- B. 離線錄音 ---------------- */
      function startRec() {
        heard.textContent = '錄音中…';
        Speech.record().then(function (c) {
          recCtl = c;
        }).catch(function () {
          recording = false;
          mic.classList.remove('rec');
          heard.innerHTML = '<span class="text-red">無法開啟麥克風</span>';
        });
      }

      function stopRec() {
        if (!recCtl) { heard.textContent = '沒有錄到聲音'; return; }
        recCtl.stop().then(function (url) {
          recCtl = null;
          if (!url) { heard.textContent = '沒有錄到聲音'; return; }
          heard.innerHTML = '<span class="muted">聽聽看你自己的聲音，再跟原音比較</span>';
          playback.innerHTML =
            '<audio controls src="' + url + '" style="width:100%;max-width:320px"></audio>' +
            '<div class="row mt16" style="gap:8px;justify-content:center">' + Speech.btn(s.en) +
            '<span class="small muted">標準音</span></div>' +
            '<div class="mt16 bold">你覺得像不像？</div>' +
            '<div class="row mt8" style="gap:8px">' +
              '<button class="btn btn-ghost grow" data-self="0">還差很多</button>' +
              '<button class="btn btn-blue grow" data-self="1">還可以</button>' +
              '<button class="btn btn-primary grow" data-self="2">很像</button>' +
            '</div>';
          UI.$$('[data-self]', playback).forEach(function (b) {
            b.onclick = function () {
              if (finished) return;
              finished = true;
              var lv = +b.getAttribute('data-self');
              var v = Content.item(s.from);
              if (v && v.w) ExUtil.gradeVocab(v, lv >= 1, lv === 1, q.unitId);
              api.result(lv >= 1, {
                title: lv === 2 ? '很好，這句過關' : (lv === 1 ? '有抓到感覺了' : '沒關係，多聽幾次再唸'),
                detail: '<div class="row" style="gap:8px">' + Speech.btn(s.en) + Speech.btn(s.en, true) +
                  '<div class="sentence-en">' + esc(s.en) + '</div></div>' +
                  '<div class="small muted mt8">離線模式沒有自動評分。連上網路後，這一題會改成逐字比對。</div>'
              });
            };
          });
        });
      }

      mic.onclick = function () {
        if (finished) return;
        Speech.stop();
        recording = !recording;
        mic.classList.toggle('rec', recording);
        if (recording) { playback.innerHTML = ''; useSTT ? startSTT() : startRec(); }
        else { useSTT ? (ctl && ctl.stop()) : stopRec(); }
      };

      api.onCleanup(function () {
        if (ctl) ctl.stop();
        if (recCtl) recCtl.stop();
      });
    }
  };
})(window);

</script>
<script>
/* ===== js/exercises/reading.js ===== */
/* ==========================================================================
   exercises/reading.js — 短文閱讀
   讀完 → 作答 → 一次批改。文章可點任一個字查意思、可整篇朗讀、有計時。
   ========================================================================== */
(function (global) {
  'use strict';

  var esc = UI.esc;

  /* ---------- 建一份「單字表」供點字查詢 ---------- */
  var lex = null;
  function lexicon() {
    if (lex) return lex;
    lex = {};
    Content.allVocab().forEach(function (v) {
      lex[v.w.toLowerCase()] = v;
      // 常見變化形也對得到
      var w = v.w.toLowerCase();
      [w + 's', w + 'es', w + 'ed', w + 'ing', w + 'd'].forEach(function (f) {
        if (!lex[f]) lex[f] = v;
      });
    });
    (Content.irregulars() || []).forEach(function (iv) {
      var base = lex[iv.v];
      if (!base) return;
      if (!lex[iv.p]) lex[iv.p] = base;
      if (!lex[iv.pp]) lex[iv.pp] = base;
    });
    return lex;
  }

  /** 把文章切成可點的字 */
  function markup(text) {
    return esc(text).replace(/([A-Za-z][A-Za-z'’-]*)/g, function (m) {
      var known = lexicon()[m.toLowerCase()];
      return '<span class="w' + (known ? ' known' : '') + '" data-w="' + m + '">' + m + '</span>';
    }).replace(/\n/g, '<br>');
  }

  /* ---------- 點字彈窗 ---------- */
  var pop = null;
  function closePop() { if (pop && pop.parentNode) pop.parentNode.removeChild(pop); pop = null; }

  function showPop(target, word) {
    closePop();
    var v = lexicon()[word.toLowerCase()];
    pop = document.createElement('div');
    pop.className = 'wordpop';
    pop.innerHTML =
      '<div class="row" style="gap:8px">' + Speech.btn(word) +
        '<div class="grow"><div class="sentence-en bold">' + esc(word) + '</div>' +
        (v
          ? (State.data.profile.showKK && v.kk ? '<div class="word-kk">[' + esc(v.kk) + ']</div>' : '') +
            '<div class="sentence-zh"><span class="word-pos">' + esc(v.pos) + '</span>' + esc(v.zh) + '</div>'
          : '<div class="sentence-zh muted">這個字還沒收進單字庫，先聽發音</div>') +
        '</div></div>';
    document.body.appendChild(pop);

    var r = target.getBoundingClientRect();
    var w = pop.offsetWidth, h = pop.offsetHeight;
    var left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2));
    var top = r.top - h - 8;
    if (top < 8) top = r.bottom + 8;
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
    Speech.speak(word, { rate: 0.8 });
  }

  document.addEventListener('click', function (e) {
    var w = e.target.closest ? e.target.closest('.w') : null;
    if (w) { showPop(w, w.getAttribute('data-w')); return; }
    if (pop && !(e.target.closest && e.target.closest('.wordpop'))) closePop();
  });

  /* ======================= 閱讀題 ======================= */
  Ex.read = {
    scored: true,
    render: function (q, host, api) {
      var a = q.ref;
      var t0 = Date.now();
      var wordCount = (a.text || '').split(/\s+/).filter(Boolean).length;

      host.innerHTML =
        '<div class="row-between">' +
          '<div class="tag blue">閱讀 ・ ' + wordCount + ' 字</div>' +
          '<div class="readtimer" id="rtimer">00:00</div>' +
        '</div>' +
        '<div class="article mt8">' +
          (a.title ? '<h3>' + esc(a.title) + '</h3>' : '') +
          '<div id="artbody">' + markup(a.text) + '</div>' +
        '</div>' +
        '<div class="row" style="gap:8px">' +
          Speech.btn(a.text) +
          '<span class="small muted">整篇朗讀（點文章裡任何一個字可以查意思）</span>' +
        '</div>' +
        '<div id="qzone"></div>';

      var timer = UI.$('#rtimer', host);
      var tick = setInterval(function () {
        var s = Math.floor((Date.now() - t0) / 1000);
        timer.textContent = ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + (s % 60)).slice(-2);
      }, 500);
      api.onCleanup(function () { clearInterval(tick); closePop(); });

      /* --- 問題區 --- */
      var qs = a.qs || [];
      var picks = new Array(qs.length).fill(-1);
      var zone = UI.$('#qzone', host);

      zone.innerHTML = '<div class="divider"></div><h3>讀完了嗎？回答下面的問題</h3>';

      qs.forEach(function (qq, qi) {
        var box = document.createElement('div');
        box.className = 'card';
        box.innerHTML = '<div class="q-prompt" style="font-size:1rem">' +
          (qi + 1) + '. ' + esc(qq.q) + '</div>';
        zone.appendChild(box);

        var order = Content.shuffle(qq.opts.map(function (o, i) { return i; }));
        var ctl = ExUtil.options(box,
          order.map(function (oi) { return { html: esc(qq.opts[oi]) }; }),
          { onPick: function (idx) {
              picks[qi] = order[idx];
              api.enableCheck(picks.every(function (p) { return p >= 0; }));
            } });
        qq._ctl = ctl;
        qq._order = order;
      });

      api.enableCheck(false);

      api.ready(function () {
        clearInterval(tick);
        var secs = Math.max(1, Math.round((Date.now() - t0) / 1000));
        var wpm = Math.round(wordCount / (secs / 60));
        var correct = 0;

        qs.forEach(function (qq, qi) {
          var ok = picks[qi] === qq.a;
          if (ok) correct++;
          qq._ctl.lock(qq._order.indexOf(qq.a));
          if (!ok) SRS.addWeak('reading', a.id, q.unitId);
        });
        if (correct === qs.length) SRS.clearWeak('reading', a.id);

        var allOk = correct === qs.length;
        api.result(allOk, {
          correct: correct, total: qs.length,
          title: allOk ? '全部答對！' : '答對 ' + correct + ' / ' + qs.length + ' 題',
          detail:
            '<div class="row wrap" style="gap:14px">' +
              '<div><div class="small muted">閱讀時間</div><div class="bold">' + secs + ' 秒</div></div>' +
              '<div><div class="small muted">閱讀速度</div><div class="bold">' + wpm + ' 字/分</div></div>' +
              '<div><div class="small muted">多益目標</div><div class="bold">150 字/分</div></div>' +
            '</div>' +
            (a.zh ? '<details class="mt8"><summary class="bold" style="cursor:pointer">看中文翻譯</summary>' +
              '<div class="sentence-zh mt8">' + esc(a.zh).replace(/\n/g, '<br>') + '</div></details>' : '') +
            (qs.some(function (qq) { return qq.why; })
              ? '<div class="check-detail">' + qs.filter(function (qq) { return qq.why; })
                  .map(function (qq, i) { return '・' + qq.why; }).join('<br>') + '</div>'
              : '')
        });
      });
    }
  };
})(window);

</script>
<script>
/* ===== js/exercises/writing.js ===== */
/* ==========================================================================
   exercises/writing.js — 寫作：拖曳排句（build）與句子填空（cloze）
   排句採「點選」而非拖曳：手機上更好按，桌機也一樣快。
   ========================================================================== */
(function (global) {
  'use strict';

  var esc = UI.esc;

  /* ======================= build：把單字排成正確的句子 ======================= */
  Ex.build = {
    scored: true,
    render: function (q, host, api) {
      var s = q.ref;
      var correct = ExUtil.tokenize(s.en);

      // 誘答字塊：從同關卡的常見字抓 1–2 個混進去
      var extras = [];
      if (correct.length <= 8) {
        var pool = Content.vocabUpTo(q.unitId)
          .map(function (v) { return v.w; })
          .filter(function (w) { return correct.indexOf(w) < 0 && w.indexOf(' ') < 0; });
        extras = Content.sample(pool, correct.length >= 6 ? 2 : 1);
      }

      var bankWords = Content.shuffle(correct.concat(extras));

      ExUtil.prompt(host, '把單字排成正確的句子');
      host.insertAdjacentHTML('beforeend',
        '<div class="card card-tight center">' +
          '<div class="sentence-zh big bold">' + esc(s.zh) + '</div>' +
        '</div>' +
        '<div class="build-area" id="build"></div>' +
        '<div class="bank" id="bank"></div>');

      var build = UI.$('#build', host);
      var bank = UI.$('#bank', host);

      bankWords.forEach(function (w, i) {
        var b = document.createElement('button');
        b.className = 'tok';
        b.type = 'button';
        b.textContent = w;
        b.dataset.k = i;
        b.onclick = function () { moveToBuild(b); };
        bank.appendChild(b);
      });

      function moveToBuild(b) {
        if (b.classList.contains('used')) return;
        Sfx.play('click');
        var c = b.cloneNode(true);
        c.classList.remove('used');
        c.onclick = function () {
          Sfx.play('click');
          build.removeChild(c);
          b.classList.remove('used');
          sync();
        };
        build.appendChild(c);
        b.classList.add('used');
        sync();
      }

      function current() {
        return Array.prototype.map.call(build.children, function (n) { return n.textContent; });
      }

      function sync() { api.enableCheck(build.children.length > 0); }
      api.enableCheck(false);

      api.ready(function () {
        var mine = current();
        var ok = ExUtil.sameText(mine.join(' '), s.en);
        Array.prototype.forEach.call(build.children, function (n) { n.onclick = null; });
        UI.$$('.tok', bank).forEach(function (n) { n.onclick = null; });
        build.style.borderBottomColor = ok ? 'var(--green)' : 'var(--red)';

        var v = Content.item(s.from);
        if (v && v.w) ExUtil.gradeVocab(v, ok, false, q.unitId);
        else if (s.from) ExUtil.gradeGrammar({ id: s.from, u: q.unitId }, ok, q.unitId);

        api.result(ok, {
          title: ok ? '句子正確！' : '正確的排法是',
          detail: '<div class="row" style="gap:8px">' + Speech.btn(s.en) +
            '<div><div class="sentence-en">' + esc(s.en) + '</div>' +
            '<div class="sentence-zh">' + esc(s.zh) + '</div></div></div>' +
            (ok ? '' : '<div class="small muted mt8">你排的：' + esc(mine.join(' ')) + '</div>')
        });
      });
    }
  };

  /* ======================= cloze：句子填空 ======================= */
  Ex.cloze = {
    scored: true,
    render: function (q, host, api) {
      var c = q.ref;
      var answers = [c.a].concat(c.alt || []);
      var hasOpts = !!(c.opts && c.opts.length);

      ExUtil.prompt(host, hasOpts ? '選出正確的字填進空格' : '把空格填完');

      var sentenceHTML = esc(c.q).replace(/_{2,}/g,
        hasOpts ? '<b class="text-blue">＿＿＿</b>'
                : '<input class="blank-input" id="cz" size="10" autocomplete="off" autocapitalize="off" spellcheck="false">');

      host.insertAdjacentHTML('beforeend',
        '<div class="card"><div class="cloze-text">' + sentenceHTML + '</div>' +
        (c.zh ? '<div class="sentence-zh mt8">' + esc(c.zh) + '</div>' : '') + '</div>');

      if (hasOpts) {
        var order = Content.shuffle(c.opts.map(function (o, i) { return i; }));
        var correctIdx = order.indexOf(c.a);
        var ctl = ExUtil.options(host,
          order.map(function (oi) { return { html: '<span class="en bold">' + esc(c.opts[oi]) + '</span>' }; }),
          { grid2: c.opts.length === 4 && c.opts.every(function (o) { return o.length < 12; }),
            onPick: function () { api.enableCheck(true); } });
        ExUtil.bindKeys(ctl, api);
        api.enableCheck(false);

        api.ready(function () {
          var picked = ctl.picked();
          if (picked < 0) return;
          var ok = picked === correctIdx;
          ctl.lock(correctIdx);
          finish(ok, c.opts[c.a]);
        });
      } else {
        var inp = UI.$('#cz', host);
        if (inp) {
          inp.addEventListener('input', function () { api.enableCheck(!!inp.value.trim()); });
          inp.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); api.submit(); }
          });
          setTimeout(function () { inp.focus(); }, 120);
        }
        api.enableCheck(false);

        api.ready(function () {
          if (!inp) return;
          var ok = ExUtil.matchAny(inp.value, answers);
          inp.disabled = true;
          inp.classList.add(ok ? 'correct' : 'wrong');
          var near = !ok && ExUtil.nearMiss(inp.value, c.a);
          if (!ok) inp.value = c.a;
          finish(ok, c.a, near, inp.value);
        });
      }

      function finish(ok, answerText, near) {
        if (q.g) ExUtil.gradeGrammar(q.g, ok, q.unitId);
        var full = c._full || String(c.q).replace(/_{2,}/, answerText);
        api.result(ok, {
          title: ok ? '正確！' : (near ? '差一點點，拼字再看一次' : '正確答案是 ' + answerText),
          detail: '<div class="row" style="gap:8px">' + Speech.btn(full) +
            '<div><div class="sentence-en">' + esc(full) + '</div>' +
            (c.zh ? '<div class="sentence-zh">' + esc(c.zh) + '</div>' : '') + '</div></div>' +
            (c.why ? '<div class="check-detail">' + c.why + '</div>' : '')
        });
      }
    }
  };
})(window);

</script>
<script>
/* ===== js/exercises/grammar.js ===== */
/* ==========================================================================
   exercises/grammar.js — 文法題
     mc    選擇題
     fix   改錯（把錯誤的句子改對）
     trans 中翻英造句
   ========================================================================== */
(function (global) {
  'use strict';

  var esc = UI.esc;

  Ex.grammar = {
    scored: true,
    render: function (q, host, api) {
      var c = q.ref;
      if (c.k === 'fix')   return renderFix(q, host, api);
      if (c.k === 'trans') return renderTrans(q, host, api);
      return renderMC(q, host, api);
    }
  };

  /* ---------------- 選擇題 ---------------- */
  function renderMC(q, host, api) {
    var c = q.ref;
    var order = Content.shuffle(c.opts.map(function (o, i) { return i; }));
    var correctIdx = order.indexOf(c.a);

    ExUtil.prompt(host, c.title || '選出正確的答案');
    host.insertAdjacentHTML('beforeend',
      '<div class="card"><div class="cloze-text">' +
        esc(c.q).replace(/_{2,}/g, '<b class="text-blue">＿＿＿</b>') + '</div>' +
      (c.zh ? '<div class="sentence-zh mt8">' + esc(c.zh) + '</div>' : '') + '</div>');

    var short = c.opts.every(function (o) { return String(o).length < 14; });
    var ctl = ExUtil.options(host,
      order.map(function (oi) { return { html: '<span class="en bold">' + esc(c.opts[oi]) + '</span>' }; }),
      { grid2: short && c.opts.length === 4, onPick: function () { api.enableCheck(true); } });
    ExUtil.bindKeys(ctl, api);
    api.enableCheck(false);

    api.ready(function () {
      var picked = ctl.picked();
      if (picked < 0) return;
      var ok = picked === correctIdx;
      ctl.lock(correctIdx);
      ExUtil.gradeGrammar(q.g, ok, q.unitId);
      var full = String(c.q).replace(/_{2,}/, c.opts[c.a]);
      api.result(ok, {
        title: ok ? '正確！' : '正確答案是 ' + c.opts[c.a],
        detail: '<div class="row" style="gap:8px">' + Speech.btn(full) +
          '<div class="sentence-en">' + esc(full) + '</div></div>' +
          (c.why ? '<div class="check-detail">' + c.why + '</div>' : '')
      });
    });
  }

  /* ---------------- 改錯 ---------------- */
  function renderFix(q, host, api) {
    var c = q.ref;
    ExUtil.prompt(host, '這句話有一個錯誤，把它改對', c.zh ? esc(c.zh) : '');
    host.insertAdjacentHTML('beforeend',
      '<div class="card card-tight center">' +
        '<div class="sentence-en big" style="text-decoration:underline wavy var(--red)">' + esc(c.q) + '</div>' +
      '</div>' +
      '<textarea class="textarea" id="fixin" placeholder="在這裡寫出正確的句子" ' +
        'autocapitalize="sentences" spellcheck="false"></textarea>' +
      '<div class="row mt8"><button class="btn btn-ghost btn-sm" id="hint">看提示</button></div>');

    var inp = UI.$('#fixin', host);
    inp.addEventListener('input', function () { api.enableCheck(!!inp.value.trim()); });
    api.enableCheck(false);
    setTimeout(function () { inp.focus(); }, 150);

    UI.$('#hint', host).onclick = function () {
      UI.toast('💡 ' + (c.hint || '注意動詞和主詞有沒有配好'), '', 3200);
    };

    api.ready(function () {
      var answers = [c.a].concat(c.alt || []);
      var ok = ExUtil.matchAny(inp.value, answers);
      inp.disabled = true;
      ExUtil.gradeGrammar(q.g, ok, q.unitId);
      api.result(ok, {
        title: ok ? '改對了！' : '正確的句子是',
        detail: '<div class="row" style="gap:8px">' + Speech.btn(c.a) +
          '<div><div class="sentence-en">' + esc(c.a) + '</div>' +
          (c.zh ? '<div class="sentence-zh">' + esc(c.zh) + '</div>' : '') + '</div></div>' +
          (ok ? '' : '<div class="small muted mt8">你寫的：' + esc(inp.value) + '</div>') +
          (c.why ? '<div class="check-detail">' + c.why + '</div>' : '')
      });
    });
  }

  /* ---------------- 中翻英 ---------------- */
  function renderTrans(q, host, api) {
    var c = q.ref;
    var answers = [c.a].concat(c.alt || []);

    ExUtil.prompt(host, '把這句中文翻成英文');
    host.insertAdjacentHTML('beforeend',
      '<div class="card card-tight center"><div class="big bold">' + esc(c.zh) + '</div></div>' +
      '<textarea class="textarea" id="transin" placeholder="Type in English…" ' +
        'autocapitalize="sentences" spellcheck="false"></textarea>' +
      '<div class="row mt8" style="gap:8px">' +
        '<button class="btn btn-ghost btn-sm" id="hint">看提示</button>' +
        '<span class="small muted">大小寫和句點不影響判分</span>' +
      '</div>');

    var inp = UI.$('#transin', host);
    inp.addEventListener('input', function () { api.enableCheck(!!inp.value.trim()); });
    api.enableCheck(false);
    setTimeout(function () { inp.focus(); }, 150);

    UI.$('#hint', host).onclick = function () {
      var first = c.a.split(/\s+/).slice(0, 2).join(' ');
      UI.toast('💡 開頭是「' + first + '…」', '', 3200);
    };

    api.ready(function () {
      var ok = ExUtil.matchAny(inp.value, answers);
      var near = !ok && ExUtil.nearMiss(inp.value, c.a);
      inp.disabled = true;
      ExUtil.gradeGrammar(q.g, ok, q.unitId);
      api.result(ok, {
        title: ok ? '翻得好！' : (near ? '很接近了，再看一次正確寫法' : '參考答案'),
        detail: '<div class="row" style="gap:8px">' + Speech.btn(c.a) +
          '<div><div class="sentence-en">' + esc(c.a) + '</div>' +
          '<div class="sentence-zh">' + esc(c.zh) + '</div></div></div>' +
          (c.alt && c.alt.length ? '<div class="small muted mt8">也可以說：' + esc(c.alt.join('　/　')) + '</div>' : '') +
          (ok ? '' : '<div class="small muted mt8">你寫的：' + esc(inp.value) + '</div>') +
          (c.why ? '<div class="check-detail">' + c.why + '</div>' : '')
      });
    });
  }
})(window);

</script>
<script>
/* ===== js/exercises/irregular.js ===== */
/* ==========================================================================
   exercises/irregular.js — 不規則動詞三態
   給原形與中文，問過去式或過去分詞。這些字沒有規則可循，只能靠反覆問。
   ========================================================================== */
(function (global) {
  'use strict';

  var esc = UI.esc;

  var LABEL = { p: '過去式', pp: '過去分詞' };

  /** be 的過去式是 was/were，兩個都算對，寫成 was/were 也算 */
  function answersFor(iv, ask) {
    var raw = String(iv[ask] || '');
    var out = raw.indexOf('/') >= 0 ? raw.split('/') : [];
    out.push(raw);
    return out;
  }

  Ex.irregular = {
    scored: true,
    render: function (q, host, api) {
      var iv = q.ref;
      var ask = q.ask === 'pp' ? 'pp' : 'p';
      var answers = answersFor(iv, ask);

      ExUtil.prompt(host, '寫出 ' + LABEL[ask], esc(iv.zh));

      host.insertAdjacentHTML('beforeend',
        '<div class="wordcard">' +
          '<div class="word-main">' + esc(iv.v) + '</div>' +
          '<div class="row" style="justify-content:center;gap:8px;margin-top:10px">' +
            Speech.btn(iv.v) +
          '</div>' +
          '<div class="cloze-text mt16">' + esc(iv.v) + ' → ' +
            '<input class="blank-input" id="ivin" size="10" autocomplete="off" ' +
            'autocapitalize="off" spellcheck="false">' +
          '</div>' +
        '</div>' +
        '<div class="row mt8"><button class="btn btn-ghost btn-sm" id="hint">看提示</button></div>');

      var inp = UI.$('#ivin', host);
      inp.addEventListener('input', function () { api.enableCheck(!!inp.value.trim()); });
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); api.submit(); }
      });
      api.enableCheck(false);
      setTimeout(function () { inp.focus(); }, 120);

      UI.$('#hint', host).onclick = function () {
        var a = answers[0];
        UI.toast('💡 開頭是「' + a.charAt(0) + '」，共 ' + a.length + ' 個字母', '', 3000);
      };

      api.ready(function () {
        var ok = ExUtil.matchAny(inp.value, answers);
        inp.disabled = true;
        inp.classList.add(ok ? 'correct' : 'wrong');
        if (!ok) inp.value = iv[ask];

        if (ok) SRS.clearWeak('irregular', iv.id);
        else SRS.addWeak('irregular', iv.id, q.unitId);

        api.result(ok, {
          title: ok ? '正確！' : LABEL[ask] + '是 ' + iv[ask],
          detail: '<div class="row" style="gap:8px">' + Speech.btn(iv[ask].replace('/', ' or ')) +
            '<div class="grow"><div class="sentence-en">' +
              esc(iv.v) + ' → ' + esc(iv.p) + ' → ' + esc(iv.pp) + '</div>' +
            '<div class="sentence-zh">' + esc(iv.zh) + '</div></div></div>'
        });
      });
    }
  };
})(window);

</script>
<script>
/* ===== js/exercises/toeic.js ===== */
/* ==========================================================================
   exercises/toeic.js — 多益聽力題型
     Ex.photo   Part 1 看圖聽描述（一張圖 + 四句描述，選出符合的那句）
     Ex.respond Part 2 應答問題（一句問句 + 三個回應，選出最合適的）
   --------------------------------------------------------------------------
   這兩種題的訓練重點是「只靠耳朵」，所以選項文字預設不顯示 —— 印出來就變成
   閱讀測驗了。但這是學習 App 不是模擬考，卡住的人可以按「顯示英文」把文字叫
   出來；沒有 TTS 語音時也會自動顯示，否則整題無法作答。
   ========================================================================== */
(function (global) {
  'use strict';

  var esc = UI.esc;
  var LETTERS = ['A', 'B', 'C', 'D'];

  function noVoiceWarning() {
    if (Speech.available()) return '';
    return '<div class="warn-box">找不到英文語音，這一題先用文字作答。' +
      '（Windows：設定 → 時間與語言 → 語音 → 新增語音 → English）</div>';
  }

  /**
   * 依序朗讀多段文字，正在唸的那一項會亮起來。
   * @returns {{stop:fn}} 控制器 —— 離開題目時要呼叫，否則語音會跟著跑到下一題
   */
  function playSeries(texts, nodes, onDone) {
    var i = 0, stopped = false;

    function unlight() {
      nodes.forEach(function (n) { if (n) n.classList.remove('opt-playing'); });
    }

    function step() {
      if (stopped) return;
      if (i >= texts.length) { unlight(); if (onDone) onDone(); return; }
      var n = nodes[i];
      if (n) n.classList.add('opt-playing');
      Speech.speak(texts[i]).then(function () {
        if (stopped) return;
        if (n) n.classList.remove('opt-playing');
        i++;
        setTimeout(step, 320);   // 選項之間留一點空隙，不然黏成一串聽不出斷句
      });
    }

    step();
    return { stop: function () { stopped = true; Speech.stop(); unlight(); } };
  }

  /** 「顯示英文」開關：預設藏起來，按了才露出 */
  function revealControl(host, onToggle) {
    var wrap = document.createElement('div');
    wrap.className = 'center mt8';
    wrap.innerHTML = '<button class="btn btn-ghost btn-sm" type="button">👁️ 顯示英文</button>';
    var b = wrap.firstChild;
    var shown = false;
    b.addEventListener('click', function () {
      shown = !shown;
      b.innerHTML = shown ? '🙈 隱藏英文' : '👁️ 顯示英文';
      onToggle(shown);
    });
    host.appendChild(wrap);
    return wrap;
  }

  /**
   * 兩種題型共用的骨架：一段音檔式的題幹 + 幾個只有字母的選項。
   * @param cfg {{ intro, sub, head, lead, texts, answer, grade, detail, host, api, q }}
   */
  function audioChoice(cfg) {
    var host = cfg.host, api = cfg.api, q = cfg.q;
    var texts = cfg.texts;
    var forceText = !Speech.available();
    var player = null;

    ExUtil.prompt(host, cfg.intro, cfg.sub);
    host.insertAdjacentHTML('beforeend', noVoiceWarning() + (cfg.head || ''));

    // 重播列：整組重播，或單獨重播某一個選項
    var barHTML = '<div class="center" style="padding:6px 0">' +
      '<button class="btn btn-primary" type="button" id="playall">🔊 播放</button>' +
      '<div class="mt8 row" style="gap:6px;justify-content:center;flex-wrap:wrap" id="replay"></div>' +
      '</div>';
    host.insertAdjacentHTML('beforeend', barHTML);

    var opts = texts.map(function (t, i) {
      return {
        html: '<span class="opt-letter">' + LETTERS[i] + '</span>' +
              '<span class="opt-say" data-i="' + i + '">' +
                '<span class="opt-text' + (forceText ? '' : ' is-hidden') + '">' + esc(t) + '</span>' +
              '</span>'
      };
    });

    var ctl = ExUtil.options(host, opts, { onPick: function () { api.enableCheck(true); } });
    // 選項顯示 A–D（多益的編號方式），但鍵盤快捷仍是 1–4，所以只把數字藏起來
    ctl.el.classList.add('opts-lettered');
    ExUtil.bindKeys(ctl, api);
    api.enableCheck(false);

    // 單獨重播的小按鈕
    var replay = UI.$('#replay', host);
    texts.forEach(function (t, i) {
      var b = document.createElement('button');
      b.className = 'btn btn-ghost btn-sm';
      b.type = 'button';
      b.textContent = LETTERS[i];
      b.addEventListener('click', function () {
        if (player) player.stop();
        player = playSeries([t], [ctl.nodes[i]]);
      });
      replay.appendChild(b);
    });

    if (!forceText) {
      revealControl(host, function (shown) {
        UI.$$('.opt-text, .ask-text', host).forEach(function (el) {
          if (shown) el.classList.remove('is-hidden');
          else el.classList.add('is-hidden');
        });
      });
    }

    function playAll() {
      if (player) player.stop();
      player = playSeries(cfg.lead ? [cfg.lead].concat(texts) : texts,
                          cfg.lead ? [null].concat(ctl.nodes) : ctl.nodes);
    }
    UI.$('#playall', host).addEventListener('click', playAll);
    api.onCleanup(function () { if (player) player.stop(); });

    if (Speech.available()) setTimeout(playAll, 400);

    api.ready(function () {
      if (player) player.stop();
      var picked = ctl.picked();
      if (picked < 0) return;
      var ok = picked === cfg.answer;
      ctl.lock(cfg.answer);

      // 作答後一律把文字露出來 —— 訂正時看不到原文等於白答
      UI.$$('.opt-text', host).forEach(function (el) { el.classList.remove('is-hidden'); });

      // 評分交給呼叫端做：弱點型別寫成字面值，才擋得住「新增型別忘了改
      // scheduler.weakQuestion」——那個檢查是靠掃描原始碼的字串跑的
      cfg.grade(ok);

      api.result(ok, {
        title: ok ? '答對了！' : '正確答案是 ' + LETTERS[cfg.answer],
        detail: cfg.detail()
      });
    });
  }

  /** 作答後的對照表：四個選項的英文與中文一起列出來 */
  function answerTable(texts, zhList, answer) {
    return '<div class="opt-review">' + texts.map(function (t, i) {
      return '<div class="opt-review-row' + (i === answer ? ' is-answer' : '') + '">' +
        '<span class="opt-letter">' + LETTERS[i] + '</span>' +
        Speech.btn(t, false, 'speak-inline') +
        '<div><div class="sentence-en">' + esc(t) + '</div>' +
        '<div class="sentence-zh">' + esc((zhList || [])[i] || '') + '</div></div>' +
        '</div>';
    }).join('') + '</div>';
  }

  /* ======================= Part 1：看圖聽描述 ======================= */
  Ex.photo = {
    scored: true,
    render: function (q, host, api) {
      var p = q.ref;

      audioChoice({
        host: host, api: api, q: q,
        grade: function (ok) {
          if (ok) SRS.clearWeak('photo', p.id);
          else SRS.addWeak('photo', p.id, q.unitId || p.u);
        },
        intro: '看圖，選出最符合的描述',
        sub: 'Part 1：四句描述只會唸一次，聽不清楚可以重播',
        head: '<div class="photo-frame">' + p.svg + '</div>',
        texts: p.opts,
        answer: p.a,
        detail: function () {
          return answerTable(p.opts, p.zh, p.a) +
            (p.why ? '<div class="check-detail">' + esc(p.why) + '</div>' : '');
        }
      });
    }
  };

  /* ======================= Part 2：應答問題 ======================= */
  Ex.respond = {
    scored: true,
    render: function (q, host, api) {
      var r = q.ref;
      var forceText = !Speech.available();

      audioChoice({
        host: host, api: api, q: q,
        grade: function (ok) {
          if (ok) SRS.clearWeak('respond', r.id);
          else SRS.addWeak('respond', r.id, q.unitId || r.u);
        },
        intro: '聽問句，選出最適合的回應',
        sub: 'Part 2：先聽懂開頭的疑問詞，答案通常就定了一半',
        head: '<div class="ask-card">' +
                '<div class="ask-label">問句</div>' +
                Speech.btn(r.ask) +
                '<div class="sentence-en ask-text' + (forceText ? '' : ' is-hidden') + '">' +
                  esc(r.ask) + '</div>' +
              '</div>',
        lead: r.ask,
        texts: r.opts,
        answer: r.a,
        detail: function () {
          // 問句本身也要露出來，不然使用者不知道自己聽錯的是哪個字
          UI.$$('.ask-text', host).forEach(function (el) { el.classList.remove('is-hidden'); });
          return '<div class="opt-review-row is-ask">' +
              Speech.btn(r.ask, false, 'speak-inline') +
              '<div><div class="sentence-en">' + esc(r.ask) + '</div>' +
              '<div class="sentence-zh">' + esc(r.askZh || '') + '</div></div>' +
            '</div>' +
            answerTable(r.opts, r.zh, r.a) +
            (r.why ? '<div class="check-detail">' + esc(r.why) + '</div>' : '');
        }
      });
    }
  };
})(window);

</script>

        '<div class="kpi"><div class="kpi-num text-blue">' + st.familiar + '</div><div class="kpi-lab">熟悉中</div></div>' +
        '<div class="kpi"><div class="kpi-num text-gold">' + doneUnits + '/' + c.units + '</div><div class="kpi-lab">通關數</div></div>' +
